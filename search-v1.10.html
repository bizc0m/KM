const KM_INDEX=[{"id":"watch-agentsview-session-intelligence-md","title":"AgentsView - Session Intelligence","canonical":"","type":"Veille outils IA / intelligence de sessions agents.","bucket":"watch","tags":["agents","coding agents","session intelligence","local first","search","analytics","token costs","devtools","sensitive"],"status":"sensible","path":"watch/agentsview-session-intelligence.md","github":"https://github.com/kenn-io/agentsview","summary":"AgentsView est une app desktop/web local first pour parcourir, chercher et analyser les sessions d'agents IA de code. Elle indexe les fichiers de sessions locaux dans SQLite, fournit une recherche full text, des tableaux de bord, des statistiques d'usage et des rapports de couts/tokens. Agents cites comme supportes ou visibles dans la documentation : Claude Code, Codex, Gemini, Copilot, Cursor, OpenCode, OpenHands, Amp, VS Code Copilot, Kiro, Warp et autres.","relations":[],"raw":"# AgentsView - Session Intelligence\n\n## Type\n\nVeille outils IA / intelligence de sessions agents.\n\n## Tags\n\nagents, coding-agents, session-intelligence, local-first, search, analytics, token-costs, devtools, sensitive\n\n## Sources\n\n- Site : `https://www.agentsview.io/`\n- Repo : `https://github.com/kenn-io/agentsview`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `kenn-io/agentsview`\n- description : local-first session intelligence and analytics for coding agents\n- stars lus : 1087\n- forks lus : 139\n- licence : MIT\n- archived : false\n- dernier push lu : 2026-05-22\n\n## Resume court\n\nAgentsView est une app desktop/web local-first pour parcourir, chercher et analyser les sessions d'agents IA de code. Elle indexe les fichiers de sessions locaux dans SQLite, fournit une recherche full-text, des tableaux de bord, des statistiques d'usage et des rapports de couts/tokens.\n\nAgents cites comme supportes ou visibles dans la documentation : Claude Code, Codex, Gemini, Copilot, Cursor, OpenCode, OpenHands, Amp, VS Code Copilot, Kiro, Warp et autres.\n\n## Usage utile\n\n- Rechercher dans les anciennes sessions Codex/Claude/Cursor.\n- Retrouver une decision, une erreur ou un prompt sans relire manuellement les chats.\n- Mesurer couts/tokens et usage par agent/projet.\n- Alimenter KM avec des resumes de sessions, apres nettoyage privacy.\n- Comparer l'activite agents par projet.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Exposition de prompts | les sessions peuvent contenir secrets, chemins locaux, donnees personnelles ou contexte client | sensible |\n| Sync distante | PostgreSQL sync peut sortir les historiques du poste local | sensible |\n| Partage d'archives | import/export de chats peut diffuser images, prompts ou tool calls sensibles | sensible |\n| Monitoring humain | usage en equipe pouvant surveiller les pratiques individuelles sans consentement clair | sensible |\n\n## Garde-fous\n\n- Garder l'usage local-first par defaut.\n- Ne pas pousser la base SQLite, exports ou historiques bruts dans Git.\n- Nettoyer secrets, chemins personnels, noms et donnees sensibles avant toute fiche KM.\n- Activer la sync distante seulement avec consentement, auth et perimetre clair.\n- Ne jamais exposer l'interface au reseau sans authentification.","integratedAt":"2026-05-22","theme":"dev"},{"id":"watch-ai-open-source-tools-inventory-md","title":"AI Open Source Tools Inventory","canonical":"","type":"Inventaire outils issu de veille X et sources web verifiees.","bucket":"watch","tags":["ia","open source","github","tools","devtools","agents","saas","osint","inventory"],"status":"a verifier","path":"watch/ai-open-source-tools-inventory.md","github":"https://github.com/calcom/cal.diy","summary":"AI Open Source Tools Inventory Type Inventaire outils issu de veille X et sources web verifiees. Tags ia, open source, github, tools, devtools, agents, saas, osint, inventory Source Inventaire detaille extrait de : Resume Les posts X fournis ont Hub, interne critique |\n| 39 | AgentsView | `https://github.com/kenn-io/agentsview` | session intelligence / analytics agents | `agentsview.io` | verifie GitHub, sensible |\n| 40 | NanoClaw | `https://github.com/nanocoai/nanoclaw` | personal AI agent / messaging / containers | `nanoclaw.dev` | verifie GitHub, sensible |\n| 41 | AutoResearchClaw | `https://github.com/aiming-lab/AutoResearchClaw` | autonomous research / papers / experiments | GitHub | verifie GitHub, sensible |\n| 42 | Awesome Free LLM APIs | `https://github.com/mnfst/awesome-free-llm-apis` | free LLM API providers / OpenAI-compatible endpoints | GitHub | verifie GitHub, sensible |\n| 43 | PentestGPT | `https://github.com/GreyDGL/PentestGPT` | autonomous penetration testing agent | Vibe Shit / pentestgpt.com | verifie GitHub, #ROUGE |\n| 44 | CC-GUI / MossX | `https://vibeshit.org/product/ccgui` | vibe coding editor / multi-engine AI dev panels | Vibe Shit / mossx.ai | a verifier, sensible |\n\n## Verification liens\n\nVerification effectuee le 2026-05-22.\n\n| Statut | Nombre | Note |\n| --- | --- | --- |\n| Verifies GitHub/API | 30 | Repos existants et accessibles via GitHub API |\n| Verifies HTTP/site | 2 | `Spacesuit`, `Voicebox` site officiel HTTP 200 ; Voicebox repo aussi verifie |\n| Corriges depuis recherche web | 6 | `ViMax`, `openscreen`, `voicebox`, `openshorts`, `freellmapi`, `ARGO` |\n| Sensibles | 5 | finance/trading, vehicle/OSINT, anti-detection |\n\nCorrections importantes :\n\n- `Cal.com` : le lien tweet `github.com/calcom/cal.com` resout via GitHub vers `github.com/calcom/cal.diy`.\n- `FreeLLMAPI` : deux repos trouves ; `tashfeenahmed/freellmapi` correspond au claim de popularite, `platoba/freellmapi` existe mais a 0 star au moment de la verification.\n- `LibreChat` : le tweet cite `librechat.ai`, le repo verifie est `danny-avila/LibreChat`.\n- `ARGO` : repo verifie `xark-argo/argo`.\n\n## Elements non indexes individuellement\n\n| Element | Pourquoi | Action |\n| --- | --- | --- |\n| 26 Image OSINT tools | le post lu annonce une liste mais ne donne pas les noms dans le texte extrait | ouvrir/media/source a verifier avant inventaire |\n| Claude Code redirect repo | le post lu ne donne pas le nom ni l'URL du repo dans le texte extrait | chercher le repo ou lire commentaires si disponible |\n| Vehicle Search Tools | le post pointe vers une section GitHub, pas une liste detaillee dans le tweet | verifier le repo source avant extraction |\n\n## Doublons fusionnes\n\n- `Cal.com` / `CalCom`.\n- `Vibe-Trading`.\n- Lien `sweexx9` fourni deux fois, compte une seule source.\n\n## Garde-fous\n\n- Les outils finance/trading ne sont pas des conseils financiers.\n- Les outils OSINT et vehicle search restent privacy-sensitive.\n- Les outils de redirection IA doivent etre audites avant usage : secrets, licences, conditions d'utilisation, exposition des prompts.\n- Les outils anti-detection doivent etre cadrés legalement et ethniquement avant tout usage.\n\n## Classification abus possible\n\n| Outil / famille | Usage utile | Usage abusif possible | Classement |\n| --- | --- | --- | --- |\n| Spacesuit, AppFlowy, Penpot | organisation, design, documentation | fuite de donnees si documents sensibles mal partages | interne |\n| Cal.com | scheduling, events, rendez-vous | collecte abusive de contacts, spam d'invitations | interne |\n| Plausible Analytics | analytics privacy-first | tracking sans consentement si mal configure | interne |\n| Ghost, Listmonk, Postiz | publication, newsletter, social scheduling | spam, manipulation sociale, diffusion non validee | interne |\n| n8n | automatisation workflows | automatisation de spam, scraping, exfiltration si connecteurs mal controles | #ROUGE si connecte a donnees sensibles |\n| Supabase, Medusa, Coolify | backend, ecommerce, deploy | fuite de donnees, mauvaise config auth/secrets | interne |\n| ViMax, OpenShorts, Hyperframes | creation video, demos | deepfake, usurpation, contenu trompeur | sensible ; #ROUGE seulement si usurpation/deepfake cible |\n| Pipecat, Voicebox, Whisper | agents vocaux, TTS/STT, transcription | clonage vocal non consenti, usurpation, enregistrement non consenti | sensible ; #ROUGE seulement si usurpation cible |\n| FreeLLMAPI, LibreChat, ARGO | routage LLM, chat self-hosted, agent local | fuite de prompts/secrets, contournement quotas/conditions, automatisation non surveillee | #ROUGE si secrets ou comptes tiers |\n| Playwright MCP | tests navigateur, QA | scraping abusif, actions automatisees non autorisees | #ROUGE si cible externe sans autorisation |\n| Vibe-Trading, AutoHedge, Fincept Terminal | recherche finance, simulation | conseil financier automatise, trading non supervise, pertes financieres | sensible finance |\n| Vaultwarden | hygiene secrets | coffre mal configure exposant secrets | interne critique |\n| Open-LLM-VTuber | avatar/compagnon IA | manipulation affective, captation de publics vulnerables | sensible |\n| Claude Ads | audit campagnes ads | manipulation publicitaire, contournement policies plateformes | sensible |\n| Agentic Inbox | tri email, brouillons | envoi non valide, fuite email, usurpation | sensible ; #ROUGE si envoi autonome abusif |\n| Camofox Browser | tests anti-bot legitimes | contournement detection, scraping furtif, abus plateformes | #ROUGE non diffusable |\n| Vehicle Search Tools | investigation autorisee | doxxing, stalking, identification de particuliers | #ROUGE non diffusable |\n| Image OSINT tools | verification images, threat intel | geolocalisation abusive, identification non consentie | #ROUGE non diffusable |\n| yt-dlp | archivage legitime, recuperation de contenus autorises | telechargement non autorise, violation copyright, contournement plateformes | sensible |\n| Ollama | IA locale privacy-first | execution non controlee, mauvaise hygiene prompts/secrets | interne |\n| Fooocus | generation image locale | images trompeuses, usurpation visuelle | sensible |\n| PhotoGIMP | design local | confusion marque/interface si redistribution trompeuse | interne |\n| Open Design | generation UI/design | copie de designs ou confusion avec outils proprietaires | interne |\n| Bitwarden Server | gestion secrets | mauvaise configuration exposant secrets | interne critique |\n\nRegle : `#ROUGE` = risque offensif direct, a connaitre pour defense et prevention, pas a diffuser comme tutoriel, pas d'exploitation operationnelle. `Sensible` = utile mais garde-fous forts selon contexte.\n\n## Prochaines actions\n\n1. Verifier les repos GitHub un par un.\n2. Ajouter URL repo officielle quand elle est confirmee.\n3. Transformer chaque outil utile en fiche individuelle si integration.","integratedAt":"2026-05-22","theme":"osint"},{"id":"watch-ai-open-source-tools-watch-md","title":"AI Open Source Tools Watch","canonical":"","type":"Veille IA transversale.","bucket":"watch","tags":["ia","open source","github","devtools","agents","saas","osint","local first","privacy"],"status":"a verifier","path":"watch/ai-open-source-tools-watch.md","github":"","summary":"Lot de veille sur des outils IA et open source utiles pour remplacer des SaaS, construire des agents, travailler localement, faire de l'OSINT image, generer de la video ou documenter des alternatives privacy first.","relations":[],"raw":"# AI Open Source Tools Watch\n\n## Type\n\nVeille IA transversale.\n\n## Tags\n\nia, open-source, github, devtools, agents, saas, osint, local-first, privacy\n\n## Source\n\nLot de posts X publics fourni le 2026-05-22.\n\nLecture effectuee via FxTwitter API publique, sans compte X.\n\n## Resume court\n\nLot de veille sur des outils IA et open source utiles pour remplacer des SaaS, construire des agents, travailler localement, faire de l'OSINT image, generer de la video ou documenter des alternatives privacy-first.\n\n## Sources lues\n\n| Date post | Auteur | URL | Sujet | Statut |\n| --- | --- | --- | --- | --- |\n| 2026-04-09 | `spacesuit_app` | `https://x.com/spacesuit_app/status/2042343866389442668` | Spacesuit, canvas/adaptive workspace multiplateforme | a verifier |\n| 2026-05-21 | `xiaoying_eth` | `https://x.com/xiaoying_eth/status/2057388194711368074` | Repos open source monetisables : Cal.com, Plausible, Ghost, n8n, Supabase, Medusa, AppFlowy, Coolify, Listmonk | a verifier |\n| 2026-05-21 | `KanikaBK` | `https://x.com/KanikaBK/status/2057446142150066607` | ViMax, outil open source pour transformer une idee en court film | a verifier |\n| 2026-05-21 | `Sumanth_077` | `https://x.com/Sumanth_077/status/2057458115323539734` | Pipecat, framework Python pour agents vocaux temps reel | a verifier |\n| 2026-05-21 | `exploraX_` | `https://x.com/exploraX_/status/2057460324349915497` | Repos gratuits remplacant des SaaS : screen recording, voice, shorts, LLM API, browser automation, scheduling, transcription, social scheduling, password vault | a verifier |\n| 2026-05-21 | `Fluyeporlaweb` | `https://x.com/Fluyeporlaweb/status/2057461670977372344` | ARGO, alternative locale/open source a Manus avec RAG, Ollama et MCP | a verifier |\n| 2026-05-21 | `DeepTechTR` | `https://x.com/DeepTechTR/status/2057512199912923177` | Repos IA GitHub puissants, surtout trading/agents financiers | a cadrer |\n| 2026-05-21 | `DailyDarkWeb` | `https://x.com/DailyDarkWeb/status/2057534159313096859` | Liste d'outils Image OSINT | sensible |\n| 2026-05-21 | `sweexx9` | `https://x.com/sweexx9/status/2057560520916414628` | Redirection Claude Code vers fournisseurs gratuits | a verifier |\n\n## Deduplication\n\n- 10 liens fournis.\n- 9 liens uniques.\n- Doublon retire : `https://x.com/sweexx9/status/2057560520916414628?s=20`.\n\n## Arbitrage\n\n| Element | Decision | Raison |\n| --- | --- | --- |\n| Alternatives SaaS open source | garder | utile pour veille outils et stacks economes |\n| Agents vocaux / Pipecat | garder | directement utile aux themes IA agents |\n| ARGO local-first | garder | privacy-first, local, RAG, MCP |\n| ViMax video IA | garder | potentiel creation media, a verifier |\n| Image OSINT | garder avec prudence | utile renseignement, mais sensible |\n| Trading agents | a cadrer | risques financiers, ne pas traiter comme recommandation |\n| Redirection Claude Code gratuite | a verifier | risque legal, securite, tokens, conditions d'usage |\n\n## Risques\n\n- Posts X promotionnels ou incomplets.\n- Claims GitHub/stars/prix a reverifier avant usage.\n- Outils financiers : ne pas utiliser comme conseil financier.\n- OSINT image : usage privacy-first, pas de doxxing, pas de surveillance abusive.\n- Redirection de trafic IA : verifier securite, licences, conditions d'utilisation, exposition de prompts et secrets.\n\n## Prochaines actions\n\n1. Verifier les repos GitHub cites avant integration.\n2. Extraire seulement les outils compatibles privacy-first.\n4. Creer une sous-fiche dediee si un outil devient actionnable.","integratedAt":"2026-05-22","theme":"osint"},{"id":"watch-ai-trending-md","title":"AI Trending","canonical":"","type":"Veille IA transversale.","bucket":"watch","tags":[],"status":"actif","path":"watch/ai-trending.md","github":"","summary":"AI Trending Type Veille IA transversale. Source NGJOO AI Trending / Open Source Heat Tracker : https://www.ngjoo.com/en/trending/ Usage Suivre les projets open source IA en tendance : agents, skills, LLM, RAG, chat, multimodal, infrastructure et devtools. Notes Risques Classements volatils. Donnees externes a reverifier avant integration produit. Ne pas transformer une tendance en decision sans cadrage.","relations":[],"raw":"# AI Trending\n\n## Type\n\nVeille IA transversale.\n\n## Source\n\nNGJOO AI Trending / Open Source Heat Tracker : `https://www.ngjoo.com/en/trending/`\n\n## Usage\n\nSuivre les projets open source IA en tendance : agents, skills, LLM, RAG, chat, multimodal, infrastructure et devtools.\n\n## Notes\n\n## Risques\n\n- Classements volatils.\n- Donnees externes a reverifier avant integration produit.\n- Ne pas transformer une tendance en decision sans cadrage.","integratedAt":"2026-05-19","theme":"agent"},{"id":"watch-autoresearchclaw-autonomous-research-md","title":"AutoResearchClaw - Autonomous Research Agent","canonical":"","type":"Veille outils IA / agent de recherche autonome.","bucket":"watch","tags":["research agent","autonomous research","papers","citations","experiments","openclaw","multi agent","scientific writing","sensitive"],"status":"sensible","path":"watch/autoresearchclaw-autonomous-research.md","github":"https://github.com/aiming-lab/AutoResearchClaw","summary":"AutoResearchClaw est un pipeline agentique qui transforme une idee de recherche en papier academique avec litterature, experiences, analyses, citations, LaTeX et revue multi agent. Le projet supporte un mode autonome et des modes human in the loop/co pilot. Le README annonce une pipeline de recherche multi etapes, recherche bibliographique via sources academiques, verification de citations, execution d'experiences en sandbox, generation de graphiques, revue multi agent et integration OpenClaw / agents CLI compatibl","relations":[],"raw":"# AutoResearchClaw - Autonomous Research Agent\n\n## Type\n\nVeille outils IA / agent de recherche autonome.\n\n## Tags\n\nresearch-agent, autonomous-research, papers, citations, experiments, openclaw, multi-agent, scientific-writing, sensitive\n\n## Sources\n\n- Repo : `https://github.com/aiming-lab/AutoResearchClaw`\n- Papier arXiv cite par le repo : `AutoResearchClaw: Self-Reinforcing Autonomous Research with Human-AI Collaboration`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `aiming-lab/AutoResearchClaw`\n- description : fully autonomous and self-evolving research from idea to paper\n- stars lus : 12498\n- forks lus : 1463\n- licence : MIT\n- archived : false\n- dernier push lu : 2026-05-22\n\n## Resume court\n\nAutoResearchClaw est un pipeline agentique qui transforme une idee de recherche en papier academique avec litterature, experiences, analyses, citations, LaTeX et revue multi-agent. Le projet supporte un mode autonome et des modes human-in-the-loop/co-pilot.\n\nLe README annonce une pipeline de recherche multi-etapes, recherche bibliographique via sources academiques, verification de citations, execution d'experiences en sandbox, generation de graphiques, revue multi-agent et integration OpenClaw / agents CLI compatibles.\n\n## Usage utile\n\n- Prototyper des workflows de recherche scientifique assistes par IA.\n- Etudier une architecture agentique longue, versionnee et human-in-the-loop.\n- Tester des mecanismes anti-hallucination : verification de citations, coherence papier/preuves, revue multi-agent.\n- Evaluer des garde-fous pour agents autonomes.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Papiers non verifies | generation de contenu academique qui peut sembler credible sans validation humaine | sensible |\n| Citation laundering | produire une bibliographie ou des claims qui donnent une fausse autorite | sensible |\n| API keys | configuration de providers LLM et couts pouvant exposer secrets ou budgets | sensible |\n| Execution d'experiences | code genere et execute en sandbox, risques de dependances ou donnees non controlees | sensible |\n| Publication automatique | diffusion de papier, resultats ou claims sans revue humaine | sensible |\n\n## Garde-fous\n\n- Toujours garder un mode human-in-the-loop pour toute sortie publique.\n- Ne jamais publier un papier, claim ou resultat sans revue humaine et verification source.\n- Ne pas stocker de cles API en clair dans config, repo, logs ou artifacts.\n- Auditer les experiences generees avant execution hors sandbox.\n- Distinguer clairement brouillon IA, resultat verifie et publication.","integratedAt":"2026-05-22","theme":"agent"},{"id":"watch-awesome-free-llm-apis-md","title":"Awesome Free LLM APIs","canonical":"","type":"Veille outils IA / ressources API LLM gratuites.","bucket":"watch","tags":["llm","api","free tier","providers","inference","openai compatible","ai tools","sensitive"],"status":"sensible","path":"watch/awesome-free-llm-apis.md","github":"https://github.com/mnfst/awesome-free-llm-apis","summary":"Liste de fournisseurs LLM avec tiers gratuits permanents ou credits gratuits. Le README indique que les endpoints sont majoritairement compatibles avec le SDK OpenAI, sauf mention contraire, et pointe vers les pages de creation de cles API. Exemples visibles au moment de la lecture : AI21 Labs Aion Labs Alibaba Cloud Model Studio Cohere DeepSeek Google Gemini Mistral AI xAI Z AI Cerebras Cloudflare Workers AI GitHub Models Groq Hugging Face Kilo Code","relations":[],"raw":"# Awesome Free LLM APIs\n\n## Type\n\nVeille outils IA / ressources API LLM gratuites.\n\n## Tags\n\nllm, api, free-tier, providers, inference, openai-compatible, ai-tools, sensitive\n\n## Sources\n\n- Repo : `https://github.com/mnfst/awesome-free-llm-apis`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `mnfst/awesome-free-llm-apis`\n- description : list of permanent free LLM API keys\n- stars lus : 4477\n- forks lus : 430\n- licence : CC0-1.0\n- archived : false\n- dernier push lu : 2026-05-22\n\n## Resume court\n\nListe de fournisseurs LLM avec tiers gratuits permanents ou credits gratuits. Le README indique que les endpoints sont majoritairement compatibles avec le SDK OpenAI, sauf mention contraire, et pointe vers les pages de creation de cles API.\n\nExemples visibles au moment de la lecture :\n\n- AI21 Labs\n- Aion Labs\n- Alibaba Cloud Model Studio\n- Cohere\n- DeepSeek\n- Google Gemini\n- Mistral AI\n- xAI\n- Z AI\n- Cerebras\n- Cloudflare Workers AI\n- GitHub Models\n- Groq\n- Hugging Face\n- Kilo Code\n\n## Usage utile\n\n- Comparer providers LLM gratuits ou trial.\n- Identifier les bases URL OpenAI-compatible.\n- Prototyper sans exposer une cle principale.\n- Alimenter un routeur LLM interne avec limites documentees.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Abuse quotas | creation de comptes ou automatisation pour contourner les limites | sensible ; #ROUGE si abus organise |\n| Donnees sensibles | envoi de secrets, prompts prives ou donnees personnelles a des providers tiers | sensible |\n| Terms mismatch | usage commercial ou production alors que le free tier l'interdit | sensible |\n| Provider volatile | limites, regions, prix et politiques data peuvent changer vite | sensible |\n| Key leakage | cles API copiees dans repo, logs ou prompts | sensible critique |\n\n## Garde-fous\n\n- Verifier chaque provider a la source officielle avant usage.\n- Ne jamais stocker de cle API en clair.\n- Documenter region, limite, cout reel, politique data et usage autorise.\n- Ne pas contourner quotas, paywalls ou conditions commerciales.\n- Preferer comptes/projets separes pour prototypes.\n- Ne pas envoyer de donnees personnelles ou confidentielles a un provider gratuit non audite.","integratedAt":"2026-05-22","theme":"source"},{"id":"watch-ccgui-mossx-vibecoding-editor-md","title":"CC-GUI / MossX - VibeCoding Editor","canonical":"","type":"Veille outils IA / editeur vibe coding multi engine.","bucket":"watch","tags":["vibe coding","ai editor","developer tools","claude code","codex","opencode","gemini","multi engine","sensitive","to verify"],"status":"a verifier","path":"watch/ccgui-mossx-vibecoding-editor.md","github":"","summary":"CC GUI / MossX est presente comme un editeur/portail vibe coding open source multi engine, proche d'une alternative Cursor. La page Vibe Shit cite Claude Code, Codex, OpenCode et Gemini, avec panels developpeur : chat canvas, terminal, gestion Git, kanban et memoire IA.","relations":[],"raw":"# CC-GUI / MossX - VibeCoding Editor\n\n## Type\n\nVeille outils IA / editeur vibe coding multi-engine.\n\n## Tags\n\nvibe-coding, ai-editor, developer-tools, claude-code, codex, opencode, gemini, multi-engine, sensitive, to-verify\n\n## Sources\n\n- Page Vibe Shit : `https://vibeshit.org/product/ccgui`\n- Site associe : `https://www.mossx.ai/`\n\nLecture : 2026-05-22\n\n## Statut verification\n\n`a verifier`\n\nLa page Vibe Shit annonce un lien GitHub et un auteur `zhukunpenglinyutong`, mais le repo visible n'a pas ete confirme via GitHub API au moment de la verification. Le site MossX est lisible et presente un portail vibe coding open source avec support Claude Code, Codex, Cursor/VSCode, AI workflows, MCP Market et Skills Market.\n\n## Resume court\n\nCC-GUI / MossX est presente comme un editeur/portail vibe coding open source multi-engine, proche d'une alternative Cursor. La page Vibe Shit cite Claude Code, Codex, OpenCode et Gemini, avec panels developpeur : chat canvas, terminal, gestion Git, kanban et memoire IA.\n\n## Usage utile\n\n- Comparer les interfaces AI coding : Cursor, Claude Code GUI, Codex, OpenCode, Gemini.\n- Surveiller les patterns UI pour agents de code : terminal, git, kanban, memoire, workflows.\n- Identifier les risques d'integration multi-provider et multi-agent dans un IDE.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Code disclosure | envoyer code prive ou prompts sensibles a des providers non verifies | sensible |\n| Key leakage | stocker cles API / tokens dans config, logs ou plugins | sensible critique |\n| Tool execution | laisser un agent modifier fichiers, git ou terminal sans validation | sensible |\n| Supply chain | installer plugins, MCP ou skills non audites | sensible |\n| False authority | UI professionnelle pouvant masquer des claims non verifies | sensible |\n\n## Garde-fous\n\n- Verifier repo, licence, permissions et modele de securite avant usage.\n- Ne pas ouvrir de repo sensible dans un editeur non audite.\n- Ne pas stocker secrets en clair dans l'outil.\n- Desactiver execution terminal/git automatique sans validation humaine.\n- Tester uniquement sur repo sandbox avant integration.\n- Auditer MCP, skills et plugins ajoutes.","integratedAt":"2026-05-22","theme":"source"},{"id":"watch-codepatrol-code-security-md","title":"CodePatrol - Code Security Watch","canonical":"","type":"Veille outils dev/security / code review et SAST.","bucket":"watch","tags":["code security","sast","code review","vulnerability scanning","appsec","devtools","sensitive","to verify"],"status":"a verifier","path":"watch/codepatrol-code-security.md","github":"","summary":"CodePatrol semble designer une famille/outillage de code security : revue automatisee, SAST, scan de vulnerabilites, alerting et consolidation de resultats. L'URL exacte fournie doit etre re verifiee avant integration technique ou recommandation.","relations":[],"raw":"# CodePatrol - Code Security Watch\n\n## Type\n\nVeille outils dev/security / code review et SAST.\n\n## Tags\n\ncode-security, sast, code-review, vulnerability-scanning, appsec, devtools, sensitive, to-verify\n\n## Sources\n\n- URL fournie : `https://codepatrol-2.polsia.app/`\n- Source secondaire trouvee : `https://sourceforge.net/software/product/CodePatrol/`\n\nLecture : 2026-05-22\n\n## Statut verification\n\n`a verifier`\n\nL'URL fournie n'a pas donne de contenu exploitable dans la lecture actuelle. Les resultats publics associent le nom CodePatrol a un outil de revue de code automatisee orientee securite, SAST, scan de vulnerabilites et agregation de resultats.\n\n## Resume court\n\nCodePatrol semble designer une famille/outillage de code security : revue automatisee, SAST, scan de vulnerabilites, alerting et consolidation de resultats. L'URL exacte fournie doit etre re-verifiee avant integration technique ou recommandation.\n\n## Usage utile\n\n- Surveiller les outils SAST et code review securite.\n- Comparer avec CodeQL, Semgrep, Checkmarx, Veracode, Codacy ou plateformes AI-native AppSec.\n- Inspirer un flux KM de verification de projets : secrets, vulnerabilites, dependances, IaC, qualite code.\n- Relier aux guardrails agents avant execution ou publication de code.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Upload code prive | envoyer un repo sensible vers un SaaS non verifie | sensible critique |\n| Secrets exposure | scan d'un repo contenant tokens, credentials ou donnees client | sensible critique |\n| False confidence | croire qu'un scan SAST remplace audit humain ou tests dynamiques | sensible |\n| Supply chain | installer un outil ou plugin non verifie dans CI/CD | sensible |\n\n## Garde-fous\n\n- Ne pas connecter de repo prive avant verification du fournisseur, des conditions et du traitement des donnees.\n- Scanner localement ou sur repo test quand possible.\n- Ne jamais uploader secrets, `.env`, dumps, logs ou donnees personnelles.\n- Verifier provenance, integrations, permissions GitHub/GitLab et politique de retention.\n- Traiter les resultats comme signal, pas comme preuve absolue.","integratedAt":"2026-05-22","theme":"security"},{"id":"watch-free-llm-api-resources-md","title":"Free LLM API Resources","canonical":"","type":"Veille outils IA / ressources API.","bucket":"watch","tags":["llm","api","free tier","inference","providers","ai tools","sensitive"],"status":"sensible","path":"watch/free-llm-api-resources.md","github":"https://github.com/cheahjs/free-llm-api-resources","summary":"Liste maintenue de fournisseurs donnant un acces gratuit ou des credits d'essai pour inference LLM via API. Le README precise : ne pas abuser des services ; les services non legitimes, par exemple reverse engineering de chatbots existants, sont explicitement exclus.","relations":[],"raw":"# Free LLM API Resources\n\n## Type\n\nVeille outils IA / ressources API.\n\n## Tags\n\nllm, api, free-tier, inference, providers, ai-tools, sensitive\n\n## Source\n\nRepo : `https://github.com/cheahjs/free-llm-api-resources`\n\nAuteur repo : `cheahjs`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `cheahjs/free-llm-api-resources`\n- description : list of free LLM inference resources accessible via API\n- stars lus : 22013\n- forks lus : 2246\n- licence : NOASSERTION\n- archived : false\n- dernier push lu : 2026-05-22\n\n## Resume court\n\nListe maintenue de fournisseurs donnant un acces gratuit ou des credits d'essai pour inference LLM via API.\n\nLe README precise :\n\n- ne pas abuser des services ;\n- les services non legitimes, par exemple reverse-engineering de chatbots existants, sont explicitement exclus.\n\n## Fournisseurs principaux cites\n\n### Free providers\n\n- OpenRouter\n- Google AI Studio\n- NVIDIA NIM\n- Mistral La Plateforme\n- Mistral Codestral\n- HuggingFace Inference Providers\n- Vercel AI Gateway\n- OpenCode Zen\n- Cerebras\n- Groq\n- Cohere\n- GitHub Models\n- Cloudflare Workers AI\n\n### Providers avec credits d'essai\n\n- Fireworks\n- Baseten\n- Nebius\n- Novita\n- AI21\n- Upstage\n- NLP Cloud\n- Alibaba Cloud Model Studio\n- Modal\n- Inference.net\n- Hyperbolic\n- SambaNova Cloud\n- Scaleway Generative APIs\n\n## Usage utile\n\n- Comparer les fournisseurs LLM gratuits ou trial.\n- Prototyper sans exposer de cle principale.\n- Identifier des alternatives temporaires pour tests.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Abuse quotas | multiplier comptes/requetes pour contourner les limites | sensible ; #ROUGE si automatisation abusive |\n| Fuite donnees | envoyer secrets, donnees privees ou prompts sensibles a des providers gratuits | sensible |\n| Terms bypass | utiliser des routes gratuites pour contourner conditions commerciales | sensible |\n| Non legitimate providers | utiliser services reverse-engineeres ou non autorises | #ROUGE |\n\n## Garde-fous\n\n- Respecter limites et conditions de chaque fournisseur.\n- Ne pas envoyer secrets, tokens, donnees personnelles ou prompts confidentiels.\n- Verifier la politique d'entrainement des donnees.\n- Ne pas automatiser de contournement de quotas.\n- Preferer fournisseurs officiels et documentes.\n- Documenter provider, modele, limites, usage et cout reel avant integration.","integratedAt":"2026-05-22","theme":"source"},{"id":"watch-inspiration-competitors-tools-watch-md","title":"Inspiration Competitors Tools Watch","canonical":"","type":"Veille inspirations / concurrents / outils.","bucket":"watch","tags":["inspiration","competitors","tools","product watch","social planning","nightintel","privacy"],"status":"sensible","path":"watch/inspiration-competitors-tools-watch.md","github":"","summary":"Centraliser les sites inspirants, concurrents, references produit et outils potentiellement utiles aux projets. Objectif : veiller sans copier. Extraire les patterns utiles, les risques, les garde fous et les opportunites d'integration.","relations":[],"raw":"# Inspiration Competitors Tools Watch\n\n## Type\n\nVeille inspirations / concurrents / outils.\n\n## Tags\n\n## Role\n\nCentraliser les sites inspirants, concurrents, references produit et outils potentiellement utiles aux projets.\n\nObjectif : veiller sans copier. Extraire les patterns utiles, les risques, les garde-fous et les opportunites d'integration.\n\n## Regles\n\n- Distinguer : inspiration, concurrent, outil utilisable, source technique.\n- Ajouter l'URL, la date de lecture, le role, les projets lies, les risques.\n- Ne pas copier l'identite visuelle ou le wording d'un concurrent.\n- Identifier l'usage abusif possible quand l'outil touche social, data, OSINT, IA, tracking ou automation.\n- Classer `#ROUGE` si l'outil peut servir a surveillance, scraping abusif, contournement, manipulation ou fuite de donnees.\n\n## Index veille\n\n| Nom | URL | Type | Projets lies | Usage utile | Risques | Statut |\n| --- | --- | --- | --- | --- | --- | --- |\n| Orbit | `https://weorbit.org/` | inspiration / concurrent social planning | NightLife, NightCrawl, Annecy Intel | coordination sorties, cercles, RSVP, nudges doux, privacy calendar | pression sociale, sur-notification, tracking relationnel | a suivre |\n\n## Fiche courte - Orbit\n\n### Resume\n\nOrbit aide des groupes d'amis a trouver des disponibilites communes via calendrier, cercles, nudges et RSVP.\n\n### Patterns utiles\n\n- Disponibilite calendrier sans partager les titres d'evenements.\n- Cercles sociaux par groupe/vibe.\n- Nudges automatiques mais limites.\n- RSVP simple.\n- Ton ludique sans culpabilisation.\n\n### Liens projets\n\n- NightLife : organiser sorties, groupes, RSVP, opt-in calendrier.\n- NightCrawl : cercles de veille / transmissions de groupe.\n- Annecy Intel : coordination locale et sorties.\n\n### Garde-fous\n\n- Geoloc/calendrier toujours opt-in.\n- Pas de score de popularite sociale.\n- Pas de penalite si refus ou absence.\n- Cadence de nudges explicite et configurable.\n- Pas de partage des titres d'evenements.\n\n### Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Tracking relationnel | mesurer qui voit qui et a quelle frequence | sensible |\n| Pression sociale | relancer trop souvent les personnes moins presentes | sensible |\n| Profilage social | inferer habitudes, groupes ou disponibilites | sensible ; #ROUGE si ciblage/stalking non consenti |\n\n## Fiche courte - Oh My Pizza!\n\n### Resume\n\nBlog personnel de Scott Yoshinaga avec archives, updates, posts culturels et notes pratiques. Source deja utile via l'article sur Twitter/X via RSS.\n\n### Patterns utiles\n\n- Curation personnelle claire.\n- Articles longs avec liens sortants.\n- Archive simple.\n- Melange culture, apps, musique et petites trouvailles web.\n- Bon modele de source de veille humaine, non algorithmique.\n\n### Liens projets\n\n- KM : source de veille et methode de curation.\n- Inspiration contenu : formats listes, favoris annuels, liens outils.\n\n### Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Surinterpretation | traiter un blog personnel comme source officielle | faible |\n| Copie de contenu | reprendre la curation ou le texte sans attribution | sensible |\n| Tracking culturel individuel | profiler les gouts d'une personne a partir de ses archives | sensible ; #ROUGE si harcelement/ciblage non consenti |\n\n### Garde-fous\n\n- Citer comme source personnelle.\n- Ne pas copier le wording ou les listes entieres.\n- Extraire des patterns et liens, pas l'identite personnelle.\n- Verifier les outils cites via sources primaires.\n\n## Prochaines actions\n\n1. Ajouter les prochaines references inspirantes dans ce fichier.\n2. Creer une fiche dediee seulement si une reference devient structurante.","integratedAt":"2026-05-22","theme":"agent"},{"id":"watch-nanoclaw-personal-agent-md","title":"NanoClaw - Personal AI Agent","canonical":"","type":"Veille outils IA / agent personnel multi canaux.","bucket":"watch","tags":["ai agent","personal agent","messaging","containers","claude agent sdk","credential vault","local first","automation","sensitive"],"status":"sensible","path":"watch/nanoclaw-personal-agent.md","github":"https://github.com/nanocoai/nanoclaw","summary":"NanoClaw est un agent IA personnel open source, leger et personnalisable. Il connecte un agent a des canaux de messagerie comme WhatsApp, Telegram, Slack, Discord, Microsoft Teams, Matrix, GitHub, Linear, email et autres. Le projet met en avant une architecture simple : un host Node, des conteneurs par groupe d'agents, deux bases SQLite par session, des skills installables a la demande et une isolation des credentials via Agent Vault.","relations":[],"raw":"# NanoClaw - Personal AI Agent\n\n## Type\n\nVeille outils IA / agent personnel multi-canaux.\n\n## Tags\n\nai-agent, personal-agent, messaging, containers, claude-agent-sdk, credential-vault, local-first, automation, sensitive\n\n## Sources\n\n- Page Vibe Shit : `https://vibeshit.org/product/nanoclaw`\n- Site : `https://nanoclaw.dev/`\n- Site FR : `https://nanoclaw.dev/fr/`\n- Repo : `https://github.com/nanocoai/nanoclaw`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `nanocoai/nanoclaw`\n- description : lightweight alternative to OpenClaw running in containers, with messaging apps, memory and scheduled jobs\n- stars lus : 29269\n- forks lus : 12855\n- licence : MIT\n- archived : false\n- dernier push lu : 2026-05-20\n\n## Resume court\n\nNanoClaw est un agent IA personnel open source, leger et personnalisable. Il connecte un agent a des canaux de messagerie comme WhatsApp, Telegram, Slack, Discord, Microsoft Teams, Matrix, GitHub, Linear, email et autres.\n\nLe projet met en avant une architecture simple : un host Node, des conteneurs par groupe d'agents, deux bases SQLite par session, des skills installables a la demande et une isolation des credentials via Agent Vault.\n\n## Usage utile\n\n- Construire un assistant personnel message-first.\n- Tester des agents par canal avec isolation forte.\n- Relier messagerie, jobs planifies, memoire et providers IA.\n- Etudier une architecture agent simple, auditable et containerisee.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Automation messaging | envoi de messages automatises non consentis ou spam multi-canaux | sensible ; #ROUGE si spam/phishing |\n| Credential routing | mauvaise configuration du vault ou exposition de providers | sensible |\n| Workspace mounts | montage de dossiers contenant secrets ou donnees personnelles | sensible |\n| Agent impersonation | bot qui parle comme une personne sans signalement clair | sensible |\n| Scheduled tasks | jobs recurrents pouvant surveiller ou contacter sans opt-in | sensible ; #ROUGE si surveillance abusive |\n\n## Garde-fous\n\n- Usage opt-in sur chaque canal de messagerie.\n- Aucun secret en clair dans repo, logs ou sessions.\n- Monter seulement les dossiers necessaires dans les conteneurs.\n- Distinguer clairement agent, humain et automatisation.\n- Desactiver tout broadcast, scraping ou contact massif non sollicite.\n- Auditer chaque skill installe avant usage.","integratedAt":"2026-05-22","theme":"source"},{"id":"watch-open-source-saas-alternatives-nicos-ai-md","title":"Open Source SaaS Alternatives - nicos_ai","canonical":"","type":"Veille outils open source.","bucket":"watch","tags":["open source","saas alternatives","ai tools","design","automation","local first","sensitive"],"status":"sensible","path":"watch/open-source-saas-alternatives-nicos-ai.md","github":"https://github.com/yt-dlp/yt-dlp","summary":"Le post liste 10 repos open source presentes comme alternatives a des outils SaaS ou services payants : video download, IA locale, image generation, design, workspace, automation, scheduling et password manager.","relations":[],"raw":"# Open Source SaaS Alternatives - nicos_ai\n\n## Type\n\nVeille outils open source.\n\n## Tags\n\nopen-source, saas-alternatives, ai-tools, design, automation, local-first, sensitive\n\n## Source\n\nPost X public fourni le 2026-05-22.\n\nURL : `https://x.com/nicos_ai/status/2057511065802469432`\n\nAuteur : `nicos_ai` / Nico\n\nDate post : 2026-05-21\n\nLecture : FxTwitter API publique, sans compte X.\n\n## Resume court\n\nLe post liste 10 repos open source presentes comme alternatives a des outils SaaS ou services payants : video download, IA locale, image generation, design, workspace, automation, scheduling et password manager.\n\n## Outils cites\n\n| Outil | URL verifiee | Statut | Classement |\n| --- | --- | --- | --- |\n| yt-dlp | `https://github.com/yt-dlp/yt-dlp` | verifie GitHub | sensible |\n| Ollama | `https://github.com/ollama/ollama` | verifie GitHub | interne |\n| Fooocus | `https://github.com/lllyasviel/Fooocus` | verifie GitHub | sensible |\n| PhotoGIMP | `https://github.com/Diolinux/PhotoGIMP` | verifie GitHub | interne |\n| Open Design | `https://github.com/nexu-io/open-design` | verifie GitHub | interne |\n| AppFlowy | `https://github.com/AppFlowy-IO/AppFlowy` | deja verifie | interne |\n| Penpot | `https://github.com/penpot/penpot` | deja verifie | interne |\n| n8n | `https://github.com/n8n-io/n8n` | deja verifie | sensible ; #ROUGE si exfiltration/spam |\n| Cal | `https://github.com/calcom/cal.diy` | deja verifie, ancien lien redirige | interne |\n| Bitwarden Server | `https://github.com/bitwarden/server` | verifie GitHub | interne critique |\n\n## Nouveaux outils ajoutes a l'inventaire\n\n- `yt-dlp`\n- `Ollama`\n- `Fooocus`\n- `PhotoGIMP`\n- `Open Design`\n- `Bitwarden Server`\n\n## Deduplication\n\nDeja presents dans KM :\n\n- `AppFlowy`\n- `Penpot`\n- `n8n`\n- `Cal.com`\n\n## Usage abusif possible\n\n| Outil | Usage utile | Usage abusif possible | Classement |\n| --- | --- | --- | --- |\n| yt-dlp | archivage legitime, recuperation de ses propres contenus, veille media | telechargement non autorise, violation copyright, contournement plateformes | sensible |\n| Ollama | IA locale privacy-first | execution de modeles non controles, fuite via prompts si mal gere | interne |\n| Fooocus | generation image locale | images trompeuses, usurpation visuelle | sensible |\n| PhotoGIMP | workflow design local | confusion marque/interface si redistribution commerciale trompeuse | interne |\n| Open Design | generation UI/design | copie de designs, confusion avec outils proprietaires | interne |\n| n8n | automation | spam, scraping, exfiltration si connecteurs sensibles | sensible ; #ROUGE si abus operationnel |\n| Bitwarden Server | gestion secrets | mauvaise configuration exposant secrets | interne critique |\n\n## Garde-fous\n\n- Ne pas promouvoir yt-dlp pour contourner droits d'auteur ou restrictions.\n- Verifier licences et conditions des plateformes avant usage media.\n- IA locale : ne pas stocker secrets dans prompts ou historiques.\n- Automation : validation humaine obligatoire avant actions externes.\n- Secrets : aucun token en clair dans repo.","integratedAt":"2026-05-22","theme":"source"},{"id":"watch-osint-tools-watch-md","title":"OSINT Tools Watch","canonical":"","type":"Veille OSINT transversale.","bucket":"watch","tags":["osint","vehicle search","vin","license plate","threat intelligence","privacy sensitive"],"status":"a verifier","path":"watch/osint-tools-watch.md","github":"https://github.com/edoardottt/awesome-hacker-search-engines","summary":"Le post reference une section \"Vehicle Search Tools\" du repo GitHub awesome hacker search engines, avec des outils de recherche de plaques, VIN et historiques de vehicules. Source citee par le post : https://github.com/edoardottt/awesome hacker search engines vehicle Verification : Repo verifie via GitHub API : https://github.com/edoardottt/awesome hacker search engines Statut : accessible. Licence GitHub : MIT. Garde fou : ne pas extraire ni stocker de donnees personnelles vehicules dans KM.","relations":[],"raw":"# OSINT Tools Watch\n\n## Type\n\nVeille OSINT transversale.\n\n## Tags\n\nosint, vehicle-search, vin, license-plate, threat-intelligence, privacy-sensitive\n\n## Source\n\nPost X public fourni le 2026-05-22.\n\nLecture effectuee via FxTwitter API publique, sans compte X.\n\n## Resume court\n\nLe post reference une section \"Vehicle Search Tools\" du repo GitHub `awesome-hacker-search-engines`, avec des outils de recherche de plaques, VIN et historiques de vehicules.\n\nSource citee par le post :\n`https://github.com/edoardottt/awesome-hacker-search-engines#vehicle`\n\nVerification :\n\n- Repo verifie via GitHub API : `https://github.com/edoardottt/awesome-hacker-search-engines`\n- Statut : accessible.\n- Licence GitHub : MIT.\n- Garde-fou : ne pas extraire ni stocker de donnees personnelles vehicules dans KM.\n\n## Sources lues\n\n| Date post | Auteur | URL | Sujet | Statut |\n| --- | --- | --- | --- | --- |\n| 2026-05-21 | `cyb_detective` | `https://x.com/cyb_detective/status/2057462395568558157` | Vehicle Search Tools : license plate search, VIN check, vehicle history records | sensible |\n\n## Arbitrage\n\n| Element | Decision | Raison |\n| --- | --- | --- |\n| Vehicle search OSINT | garder avec prudence | utile pour veille OSINT, mais donnees potentiellement personnelles |\n| Plaques / VIN / historique vehicule | a cadrer | risque privacy, stalking, doxxing, usage abusif |\n| Repo awesome-hacker-search-engines | garder comme source | index public, a verifier avant utilisation |\n\n## Garde-fous\n\n- Usage uniquement defensif, recherche legitime, audit, investigation autorisee ou apprentissage.\n- Pas de doxxing, stalking, surveillance abusive ou identification de particuliers sans base legitime.\n- Ne pas stocker plaques, VIN, noms, adresses ou resultats personnels dans KM.\n- Verifier legalite locale avant usage de tout outil lie aux vehicules.\n\n## Risques\n\n- Outils externes variables.\n- Donnees vehicules possiblement personnelles.\n- Resultats pouvant etre faux, obsoletes ou hors cadre legal selon pays.\n\n## Prochaines actions\n\n1. Verifier le repo GitHub source avant integration.\n2. Extraire uniquement les categories utiles et licites.\n3. Creer une fiche dediee si un outil devient actionnable.","integratedAt":"2026-05-22","theme":"osint"},{"id":"watch-pentestgpt-autonomous-pentest-md","title":"PentestGPT - Autonomous Penetration Testing","canonical":"","type":"Veille ROUGE / outil IA de pentest autonome.","bucket":"watch","tags":["pentest","red team","autonomous agent","exploitation","recon","privilege escalation","llm security","offensive risk"],"status":"#ROUGE","path":"watch/pentestgpt-autonomous-pentest.md","github":"https://github.com/GreyDGL/PentestGPT","summary":"PentestGPT est un framework agentique de penetration testing automatise par LLM. La page officielle met en avant une pipeline autonome de reconnaissance, analyse de vulnerabilites, exploitation, privilege escalation, session persistence et environnement Docker avec outils de securite.","relations":[],"raw":"# PentestGPT - Autonomous Penetration Testing\n\n## Type\n\nVeille `#ROUGE` / outil IA de pentest autonome.\n\n## Tags\n\n#ROUGE, pentest, red-team, autonomous-agent, exploitation, recon, privilege-escalation, llm-security, offensive-risk\n\n## Sources\n\n- Page Vibe Shit : `https://vibeshit.org/product/pentestgpt`\n- Site officiel : `https://pentestgpt.com/`\n- Repo : `https://github.com/GreyDGL/PentestGPT`\n- Papier : `PentestGPT: Evaluating and Harnessing Large Language Models for Automated Penetration Testing`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `GreyDGL/PentestGPT`\n- description : automated penetration testing agentic framework powered by large language models\n- stars lus : 13240\n- forks lus : 2274\n- licence : MIT\n- archived : false\n- dernier push lu : 2026-02-23\n\n## Resume court\n\nPentestGPT est un framework agentique de penetration testing automatise par LLM. La page officielle met en avant une pipeline autonome de reconnaissance, analyse de vulnerabilites, exploitation, privilege escalation, session persistence et environnement Docker avec outils de securite.\n\n## Classification\n\n`#ROUGE`\n\nRaison : l'outil facilite directement des actions offensives operationnelles : reconnaissance, exploitation, post-exploitation et automatisation d'attack chains. A connaitre pour defense, audit, threat intelligence et comprehension du paysage, mais pas a diffuser comme guide d'usage.\n\n## Usage defensif legitime\n\n- Laboratoire interne, CTF, HackTheBox ou environnement explicitement autorise.\n- Evaluation defensive d'agents de pentest autonomes.\n- Etude des risques d'automatisation offensive par LLM.\n- Benchmark de garde-fous, detection, journalisation et containment.\n- Formation securite uniquement dans un cadre autorise et supervise.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Recon non autorisee | scan ou enumeration de cibles tierces | #ROUGE |\n| Exploitation | selection et execution de techniques d'exploitation | #ROUGE |\n| Privilege escalation | recherche de chemins d'elevation sur systemes compromis | #ROUGE |\n| Lateral movement | chainage d'actions apres acces initial | #ROUGE |\n| Abaissement de barriere | aide a des profils non qualifies pour conduire des attaques | #ROUGE |\n\n## Garde-fous\n\n- Ne pas fournir de commandes, payloads, procedures ou chaines d'exploitation.\n- Ne pas tester sur cible externe sans autorisation ecrite.\n- Ne pas connecter a des credentials, VPN, clouds ou reseaux reels sans cadrage.\n- Executer uniquement en lab isole si test local.\n- Journaliser objectif, perimetre, autorisation, cible, duree et responsable.","integratedAt":"2026-05-22","theme":"security"},{"id":"watch-promptspy-ai-android-malware-md","title":"PromptSpy - AI Android Malware","canonical":"","type":"Veille menace mobile IA / malware Android agentique.","bucket":"watch","tags":["android security","mobile security","ai malware","malware","google gemini","threat intelligence","security alert"],"status":"#ROUGE","path":"watch/promptspy-ai-android-malware.md","github":"","summary":"PromptSpy est presente comme une menace Android utilisant de l'IA generative pendant son execution pour analyser l'ecran, appeler un modele IA et adapter son comportement. La source affirme l'usage de Google Gemini pour aider le malware a s'adapter, persister et eviter certaines defenses mobiles.","relations":[],"raw":"# PromptSpy - AI Android Malware\n\n## Type\n\nVeille menace mobile IA / malware Android agentique.\n\n## Tags\n\n#ROUGE, android-security, mobile-security, ai-malware, malware, google-gemini, threat-intelligence, security-alert\n\n## Source\n\nSource fournie : description video Technijian.\n\nMetadonnees fournies :\n\n- Vues : 84\n- Date source : 2026-02-20\n- Hashtags source : `#AndroidSecurity`, `#MobileSecurity`, `#SecurityAlert`, `#PromptSpy`, `#AIMalware`, `#Cybersecurity`, `#GoogleGemini`, `#AIThreats`, `#MobileThreats`, `#ThreatIntel`, `#CyberDefense`\n- Site : `https://technijian.com/`\n- Blog annonce : `https://technijian.com/cyber-security...`\n- Podcast annonce : `https://technijian.com/podcast/prompt...`\n- Reseaux cites : Facebook `technijian01`, Instagram `technijianinc`, LinkedIn `technijian`, TikTok `technijian`, Pinterest `technijian01`, X `technijian_`\n\nVerification KM : non verifiee au 2026-05-23. URLs blog/podcast tronquees dans la source fournie.\n\n## Resume court\n\nPromptSpy est presente comme une menace Android utilisant de l'IA generative pendant son execution pour analyser l'ecran, appeler un modele IA et adapter son comportement. La source affirme l'usage de Google Gemini pour aider le malware a s'adapter, persister et eviter certaines defenses mobiles.\n\n## Points cles annonces\n\n- Malware Android utilisant l'IA generative pendant l'execution.\n- Analyse de l'ecran de l'appareil.\n- Appels a un modele IA pour adapter le comportement.\n- Mise en avant de la persistance et de l'evasion mobile.\n- Impact potentiel pour les strategies de securite mobile en entreprise.\n- Source orientee sensibilisation pour responsables IT, entreprises et utilisateurs Android.\n\n## Usage utile\n\n- Veille threat intelligence sur les usages IA dans malware mobile.\n- Sensibilisation Android security / mobile security.\n- Alimenter une checklist defensive mobile : MDM, permissions, sources d'installation, monitoring, detection comportementale.\n- Surveiller l'evolution des malwares qui utilisent des LLM pendant l'execution.\n- Preparer une fiche de risque pour entreprises equipees Android.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Malware adaptatif | usage d'un modele IA pour adapter la logique d'attaque | #ROUGE |\n| Evasion mobile | contournement de defenses par comportement dynamique | #ROUGE |\n| Persistance | maintien non autorise sur appareil Android | #ROUGE |\n| Spyware | collecte ou observation d'ecran/appareil sans consentement | #ROUGE |\n| Phishing contextuel | adaptation de leurres selon l'ecran ou le contexte utilisateur | #ROUGE |\n\n## Garde-fous\n\n- Ne pas diffuser de procedure d'installation, execution ou contournement.\n- Ne pas chercher d'echantillon malware sans environnement isole et autorisation explicite.\n- Ne pas transformer cette fiche en tutoriel offensif.\n- Ne conserver que les metadonnees publiques et les lecons defensives.\n- Verifier la source primaire avant toute decision technique.\n\n## Mesures defensives a surveiller\n\n- MDM et inventaire des appareils Android.\n- Installation uniquement depuis sources approuvees.\n- Controle des permissions sensibles : accessibilite, overlay, lecture ecran, notifications.\n- Detection comportementale plutot que signatures statiques seules.\n- Journalisation des appels reseau inhabituels vers API IA.\n- Formation utilisateurs sur apps inconnues et demandes de permissions.","integratedAt":"2026-05-23","theme":"osint"},{"id":"watch-red-team-risk-tools-watch-md","title":"Red Team Risk Tools Watch","canonical":"","type":"Veille outils sensibles ROUGE.","bucket":"watch","tags":["dual use","offensive risk","osint","anti detection","privacy","threat intelligence"],"status":"#ROUGE","path":"watch/red-team-risk-tools-watch.md","github":"","summary":"Centraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger. ROUGE signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.","relations":[],"raw":"# Red Team Risk Tools Watch\n\n## Type\n\nVeille outils sensibles `#ROUGE`.\n\n## Tags\n\n#ROUGE, dual-use, offensive-risk, osint, anti-detection, privacy, threat-intelligence\n\n## Role\n\nCentraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger.\n\n`#ROUGE` signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.\n\n## Regles #ROUGE\n\n- Recuperer les outils offensifs au lieu de les ignorer.\n- Les classer clairement `#ROUGE`.\n- Distinguer usage legitime defensif et usage abusif.\n- Ne pas fournir de mode d'emploi offensif.\n- Ne pas fournir de payload, procedure d'exploitation, contournement, ciblage ou automatisation abusive.\n- Ne pas stocker de donnees personnelles extraites par ces outils.\n- Ne pas integrer dans un projet sans cadrage explicite.\n\n## Outils / familles classes #ROUGE\n\nCritere strict : `#ROUGE` uniquement si l'outil facilite directement un usage offensif, furtif, intrusif ou d'abus a grande echelle.\n\n| Outil / famille | Usage defensif legitime | Usage abusif possible | Diffusion |\n| --- | --- | --- | --- |\n| Camofox Browser | tester detection bot sur ses propres services | contournement anti-bot, scraping furtif, fraude plateformes | #ROUGE non public |\n| Vehicle Search Tools | investigation autorisee, verification defensive | doxxing, stalking, identification de particuliers via plaques/VIN | #ROUGE non public |\n| Image OSINT tools | verification source image, threat intel, fact-checking | geolocalisation abusive, identification non consentie | #ROUGE non public |\n| Playwright MCP | tests QA, accessibilite, verification UI | automatisation d'actions non autorisees, scraping abusif | #ROUGE si cible externe |\n| n8n | automatisation interne | spam, exfiltration, scraping automatise | #ROUGE si connecteurs sensibles |\n| FreeLLMAPI / ARGO / LibreChat | self-host, privacy, experimentation controlee | fuite secrets, contournement conditions, agent non supervise | #ROUGE si secrets/comptes tiers |\n| PentestGPT | lab autorise, CTF, evaluation defensive d'agents de pentest | reconnaissance, exploitation, post-exploitation et privilege escalation non autorisees | #ROUGE non public |\n| PromptSpy / AI Android malware | threat intelligence, sensibilisation mobile, detection defensive | malware adaptatif, spyware Android, persistance et evasion mobile | #ROUGE non public |\n\n## Sensible mais pas #ROUGE par defaut\n\n| Outil / famille | Pourquoi sensible | Classement |\n| --- | --- | --- |\n| Voicebox / Pipecat / Whisper | voix, transcription, consentement | sensible |\n| ViMax / OpenShorts / Hyperframes | generation media, risque deepfake selon contenu | sensible |\n| Agentic Inbox | email, validation humaine requise | sensible |\n| Claude Ads | manipulation publicitaire possible selon usage | sensible |\n| AutoHedge / Vibe-Trading / Fincept Terminal | risque financier | sensible finance |\n| Twitter RSS / Nitter / OpenRSS | veille publique pouvant deriver en surveillance | sensible |\n| Orbit / social planning | tracking relationnel possible si non consenti | sensible |\n\n## Garde-fous generaux\n\n- Usage uniquement autorise, defensif ou educatif.\n- Validation humaine obligatoire pour toute action externe.\n- Aucune diffusion publique de procedure offensive.\n- Aucune collecte de personnes privees.\n- Aucune execution sur cible tierce sans autorisation.\n- Journaliser les sources, pas les donnees sensibles.","integratedAt":"2026-05-22","theme":"security"},{"id":"watch-tool-project-fit-scan-md","title":"Tool Project Fit Scan","canonical":"","type":"Matrice KM outil projet.","bucket":"watch","tags":["km","tools","project fit","nightintel","demoforge","pacte ia","privacy"],"status":"sensible","path":"watch/tool-project-fit-scan.md","github":"","summary":"Scan rapide des projets locaux pour identifier quels outils du lot de veille peuvent etre utiles, sans integration automatique. Priorite : outils utiles, privacy first, peu risqués, compatibles avec les objectifs existants.","relations":[],"raw":"# Tool Project Fit Scan\n\n## Type\n\nMatrice KM outil -> projet.\n\n## Tags\n\n## Sources\n\n- `PROJECTS_INDEX.md`\n- README et index projet lus le 2026-05-22\n\n## Resume court\n\nScan rapide des projets locaux pour identifier quels outils du lot de veille peuvent etre utiles, sans integration automatique.\n\nPriorite : outils utiles, privacy-first, peu risqués, compatibles avec les objectifs existants.\n\n## Projets scannes\n\n| Projet | Chemin | Role lu | Statut |\n| --- | --- | --- | --- |\n| NightLife V5 | `CODEX/NightLifeV5` | projet principal NightLife historique | actif / a ne pas toucher sans cadrage |\n| Nocturne Intel | `CODEX/Nocturne-Intel` | dashboard intelligence nightlife, collecteur RSS JSONL | source de verite |\n| NightCrawl | `CODEX/NightCrawl` | radar culturel nightlife, bots Telegram/Discord, scans ville | archive / ressource |\n| Tracker URL Resolver | `CODEX/tracker-url-resolver` | resolver URL, nettoyage tracking, pro scan | utilitaire candidat |\n| DemoForge Clean | `Projets/Demoforge-clean` | outils HTML visuels : shader, ANSI motion, CNC studio | actif propre |\n| PACTE_IA | `PACTE_IA` | cadre ethique IA, docs, protocoles, audits | actif |\n| croKETT | `CODEX/croKETT` | clone Biscuit / share actionable approach | actif leger |\n| Annecy Intel | `Projets/Annecy-Intel`, `Projets/BANANE` | versions HTML Annecy Intel | archive / produit local |\n| KM | `KM` | knowledge management, ressources, watch, process | actif |\n\n## Recommandations prioritaires\n\n| Projet | Outils utiles | Priorite | Pourquoi | Risques / garde-fous |\n| --- | --- | --- | --- | --- |\n| Nocturne Intel | `Plausible Analytics`, `Listmonk`, `Tracker URL Resolver`, `playwright-mcp` | haute | analytics privacy-first, newsletter/veille, nettoyage liens, tests dashboard | pas de tracking caché, opt-in analytics |\n| NightLife V6/V5 | `Cal.com`, `Postiz`, `playwright-mcp`, `Whisper`, `OpenShorts` | moyenne | events/booking, diffusion sociale, tests UI, transcription d'events, shorts promotionnels | opt-in, pas de scraping privé, pas d'autopost sans validation |\n| NightCrawl | `Postiz`, `Listmonk`, `playwright-mcp`, `Pipecat` | moyenne | transmissions bot/social, newsletter radar, verification pages, possible agent vocal | bots non intrusifs, cadence explicite |\n| DemoForge Clean | `Hyperframes`, `Penpot`, `OpenScreen`, `OpenShorts`, `Voicebox` | haute | video demos, design open source, capture ecran, shorts, voix locale | voix uniquement consentie, assets propres/licences |\n| PACTE_IA | `LibreChat`, `Agentic Inbox`, `Pipecat`, `AppFlowy` | moyenne | interface multi-IA, inbox agentique, conversations vocales, workspace docs | ne pas melanger intime/public, privacy stricte |\n| croKETT | `AppFlowy`, `Spacesuit`, `Cal.com`, `Vaultwarden` | basse/moyenne | inspiration workspace/share action, scheduling, secrets | ne pas stocker secrets en clair |\n| Tracker URL Resolver | `playwright-mcp`, `Camofox Browser` | moyenne/sensible | resolution dynamique et pages JS | Camofox uniquement pour tests legitimes, pas de contournement abusif |\n| Annecy Intel | `Plausible Analytics`, `Listmonk`, `Postiz`, `OpenScreen` | moyenne | mesure privacy-first, diffusion locale, captures demo | opt-in, pas de donnees perso |\n| KM | `AppFlowy`, `LibreChat`, `Agentic Inbox`, `Vaultwarden` | moyenne | organisation docs, interface chat, tri inbox, protection secrets | exports sans chemins personnels |\n\n## Outils a ne pas integrer sans cadrage\n\n| Outil | Raison | Decision |\n| --- | --- | --- |\n| `AutoHedge` | finance/trading autonome | a cadrer, pas d'usage produit |\n| `Vibe-Trading` | finance/trading, risque de conseil financier | a cadrer, veille seulement |\n| `Fincept Terminal` | finance terminal | a cadrer, veille seulement |\n| `Camofox Browser` | anti-detection / spoofing | usage limite tests legitimes, pas de contournement abusif |\n| Vehicle Search Tools | plaques/VIN, donnees personnelles possibles | privacy-sensitive, veille seulement |\n| Claude Code redirect repo | securite/secrets/conditions d'usage | attendre identification + audit |\n\n## Quick wins\n\n1. `playwright-mcp` pour tests UI NightLife, Nocturne Intel et DemoForge.\n2. `OpenScreen` pour creer des demos courtes des interfaces.\n3. `Plausible Analytics` pour analytics privacy-first sur pages publiques.\n4. `Postiz` pour planifier des posts de demo, validation manuelle obligatoire.\n6. `Vaultwarden` pour hygiene secrets, hors repo.","integratedAt":"2026-05-22","theme":"agent"},{"id":"watch-twitter-rss-monitoring-md","title":"Twitter RSS Monitoring","canonical":"","type":"Veille process / source monitoring.","bucket":"watch","tags":["rss","twitter","x","monitoring","nitter","openrss","social watch","privacy"],"status":"sensible","path":"watch/twitter-rss-monitoring.md","github":"https://github.com/zedeus/nitter","summary":"L'article explique comment suivre quelques comptes Twitter/X via RSS afin de reduire le temps passe sur le site Twitter. Deux services sont cites : Nitter et OpenRSS. L'approche permet de generer des flux RSS publics sans acces API Twitter.","relations":[],"raw":"# Twitter RSS Monitoring\n\n## Type\n\nVeille process / source monitoring.\n\n## Tags\n\nrss, twitter, x, monitoring, nitter, openrss, social-watch, privacy\n\n## Source\n\nArticle : `Keeping Up With Twitter Via RSS Feeds`\n\nURL : `https://ohmypizza.com/2023/04/keeping-up-with-twitter-via-rss`\n\nAuteur : Scott Yoshinaga\n\nDate source : 2023-04-20\n\nLecture KM : 2026-05-22\n\n## Resume court\n\nL'article explique comment suivre quelques comptes Twitter/X via RSS afin de reduire le temps passe sur le site Twitter. Deux services sont cites : Nitter et OpenRSS. L'approche permet de generer des flux RSS publics sans acces API Twitter.\n\n## Outils cites\n\n| Outil | URL | Usage | Statut |\n| --- | --- | --- | --- |\n| Nitter | `https://nitter.net/<username>` | consulter un compte Twitter via interface alternative et recuperer un RSS | verifie partiel 2026-05-22, service/instances instables |\n| OpenRSS | `https://openrss.org/twitter.com/<username>` | generer un flux RSS depuis un compte Twitter public | verifie source officielle 2026-05-22 |\n\n## Nitter - verification officielle\n\nSources :\n\n- Instance : `https://nitter.net/`\n- Repo : `https://github.com/zedeus/nitter`\n\nVerification 2026-05-22 :\n\n- `https://nitter.net/` repond, mais la page chargee est minimale.\n- Repo GitHub verifie via GitHub API : `zedeus/nitter`.\n- Licence GitHub : AGPL-3.0.\n- Repo non archive au moment de la verification.\n- Dernier push lu via GitHub API : 2026-04-16.\n\nNotes de contexte :\n\n- Nitter est un frontend alternatif Twitter/X centre privacy/performance.\n- Le projet a connu une forte instabilite apres les changements d'acces de Twitter/X.\n- Plusieurs sources publiques indiquent que les instances et le RSS peuvent etre instables ou desactives selon les periodes.\n- A utiliser comme source de veille opportuniste, pas comme infrastructure fiable de production.\n\n## OpenRSS - verification officielle\n\nSource officielle : `https://openrss.org/`\n\nGuides / conditions lues :\n\n- `https://openrss.org/guides/how-to-use-an-open-rss-feed`\n- `https://openrss.org/terms`\n\nPoints verifies :\n\n- Page racine relue le 2026-05-22 depuis le lot fourni.\n- OpenRSS permet d'ajouter `openrss.org/` devant une URL pour obtenir un flux RSS quand la page est supportee.\n- Le service annonce des flux sans algorithmes de recommandation.\n- Le service indique retirer certains scripts, tracking links et contenus invasifs des flux.\n- OpenRSS est presente comme organisation nonprofit 501(c)(3).\n- Usage annonce : personnel, informatif, non commercial.\n- Les conditions demandent de limiter la frequence des requetes.\n- Les conditions interdisent l'usage illegal, le contournement de restrictions, l'acces a du contenu payant, l'espionnage, le harcelement et le monitoring de contenu non public.\n\n## Usage utile\n\n- Veille sobre sur comptes publics.\n- Centraliser des sources X dans un lecteur RSS.\n- Reduire l'exposition a l'interface addictive de X.\n- Surveiller les comptes source utiles pour KM sans connexion directe a X.\n- Alimenter une veille manuelle non intrusive.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Surveillance abusive | suivre systematiquement une personne sans cadre legitime | #ROUGE si cible personne privee |\n| Scraping agressif | multiplier flux et requetes au-dela d'une veille raisonnable | sensible ; #ROUGE si automatisation furtive ou massive |\n| Contournement plateforme | utiliser des services alternatifs pour contourner limites/API sans respecter conditions | sensible |\n| Profilage | croiser flux publics pour profiler une personne ou un groupe | sensible ; #ROUGE si ciblage individuel non consenti |\n\n## Garde-fous\n\n- Utiliser uniquement des comptes publics et pertinents pour la veille.\n- Ne pas suivre de personnes privees sans raison legitime.\n- Ne pas stocker donnees personnelles issues de flux.\n- Ne pas automatiser a grande echelle.\n- Respecter les limites des services tiers et les conditions applicables.\n- Preferer la veille thematique aux listes nominatives.\n- Usage OpenRSS : personnel, non commercial, frequence raisonnable.\n- Ne pas redistribuer les flux OpenRSS dans une app publique ou payante sans verifier les conditions.\n- Usage Nitter : limiter a une veille manuelle ou faible frequence ; ne pas dependra d'instances publiques pour un produit.","integratedAt":"2026-05-22","theme":"source"},{"id":"watch-vibeshit-vibe-coding-directory-md","title":"Vibe Shit - Vibe Coding Directory","canonical":"","type":"Veille outils IA / annuaire projets vibe coding.","bucket":"watch","tags":["vibe coding","ai tools","agents","llm","devtools","directory","inspiration","sensitive"],"status":"sensible","path":"watch/vibeshit-vibe-coding-directory.md","github":"","summary":"Annuaire de projets \"vibe coding\" proche d'un Product Hunt specialise IA/devtools. Le site liste des projets avec titre, description courte, tags, agents/LLM associes, votes, dates et tendances. Exemples visibles au moment de la lecture : LLMs from Scratch Claude Gateway HyperFrames GLM OCR PaddleOCR ShadowBroker Free LLM API Resources Rapid MLX Social Auto Upload LibreChat Cua Roo Code vLLM OpenSRE","relations":[],"raw":"# Vibe Shit - Vibe Coding Directory\n\n## Type\n\nVeille outils IA / annuaire projets vibe coding.\n\n## Tags\n\nvibe-coding, ai-tools, agents, llm, devtools, directory, inspiration, sensitive\n\n##
