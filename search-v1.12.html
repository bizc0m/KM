ible`\n\nRaison : le contenu est directement abusable pour etudier, reutiliser ou adapter du code malveillant. Ne pas diffuser comme ressource pratique ni extraire de code.\n\n## Usage KM\n\n- Suivre les sources publiques employees en threat intelligence.\n- Documenter les risques de reutilisation de code malware.\n- Alimenter des decisions de blocage, detection, formation defensive et hygiene securite.\n\n## Usage defensif legitime\n\n- Reverse engineering en environnement isole.\n- Recherche defensive, detection et analyse de signatures.\n- Formation securite encadree, sans redistribution de code.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Reutilisation malware | reprise ou adaptation de code malveillant | Sensible |\n| Evasion | comparaison de familles pour contourner defenses | Sensible |\n| Diffusion | redistribution de contenu dangereux hors cadre | Sensible |\n\n## Garde-fous\n\n- Ne pas copier ni stocker de code source malware dans KM.\n- Ne pas fournir de procedure de build, execution, modification ou deploiement.\n- Ne pas ouvrir sur environnement non isole.\n- Garder la fiche au niveau meta/source uniquement.","integratedAt":"2026-06-24","theme":"security","themeLabel":"Security","concepts":[{"id":"risk.offensive","label":"Offensif / #ROUGE","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.osint","label":"OSINT","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","parent":null}]},{"id":"watch-conet-privacy-depin-network-md","title":"CONET - Privacy DePIN Network","canonical":"","type":"Veille infra privacy / DePIN / reseau decentralise.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#privacy","#depin","#crypto","#wallet-address","#decentralized-network","#encrypted-routing","#vpn-alternative","#tokenomics","#sensitive", resent dans l'ecosysteme | sensible |\n\n## Usage utile\n\n- Veille sur infrastructures privacy alternatives.\n- Comparer DePIN, VPN, Tor-like routing, relay networks et wallet identity.\n- Comprendre les promesses de reseaux sans IP visible.\n- Evaluer une piste anti-censure dans un cadre legal.\n- Alimenter KM sur privacy tech, crypto infra et risques de relais.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Relay abuse | faire transiter du trafic tiers illegal ou non maitrise via un noeud | sensible ; Sensible si facilite abus externe |\n| Overclaim privacy | croire a un anonymat complet sans audit ni modele de menace | sensible |\n| Crypto speculation | achat token/mining motive par rendement non verifie | sensible finance |\n| Juridiction | responsabilite legale variable selon pays et type de trafic relaye | sensible |\n| Contournement | usage pour contourner restrictions sans cadre legitime | sensible ; Sensible si usage illegal |\n| Metadata leakage | fuite possible via endpoint, wallet, analytics, app, bridges ou erreurs de config | sensible |\n\n## Garde-fous\n\n- Ne pas traiter les claims d'anonymat comme prouves.\n- Ne pas lancer de noeud public sans analyse legale.\n- Ne pas engager d'argent sans audit tokenomics et risque finance.\n- Tester seulement en lab avec trafic controle.\n- Documenter le modele de menace : qui voit quoi, a quel niveau, avec quels logs.\n- Verifier code, clients, smart contracts, bridge, analytics et conditions d'usage.\n- Ne jamais relayer de trafic tiers non maitrise pour un projet public.\n\n## Questions d'audit\n\n1. Quel repo GitHub officiel correspond au client, aux noeuds et aux smart contracts ?\n2. Les clients sont-ils open source et reproductibles ?\n3. Qui controle les super nodes / guardians / bootstrap nodes ?\n4. Quels logs existent cote app, noeuds, analytics, wallet et infra cloud ?\n5. Que signifie exactement \"no IP\" dans le modele de menace ?\n6. Quel risque juridi  cible |\n| FreeLLMAPI, LibreChat, ARGO | routage LLM, chat self-hosted, agent local | fuite de prompts/secrets, contournement quotas/conditions, automatisation non surveillee | Sensible si secrets ou comptes tiers |\n| Playwright MCP | tests navigateur, QA | scraping abusif, actions automatisees non autorisees | Sensible si cible externe sans autorisation |\n| Vibe-Trading, AutoHedge, Fincept Terminal | recherche finance, simulation | conseil financier automatise, trading non supervise, pertes financieres | sensible finance |\n| Vaultwarden | hygiene secrets | coffre mal configure exposant secrets | interne critique |\n| Open-LLM-VTuber | avatar/compagnon IA | manipulation affective, captation de publics vulnerables | sensible |\n| Claude Ads | audit campagnes ads | manipulation publicitaire, contournement policies plateformes | sensible |\n| Agentic Inbox | tri email, brouillons | envoi non valide, fuite email, usurpation | sensible ; Sensible si envoi autonome abusif |\n| Camofox Browser | tests anti-bot legitimes | contournement detection, scraping furtif, abus plateformes | Sensible non diffusable |\n| Vehicle Search Tools | investigation autorisee | doxxing, stalking, identification de particuliers | Sensible non diffusable |\n| Image OSINT tools | verification images, threat intel | geolocalisation abusive, identification non consentie | Sensible non diffusable |\n| yt-dlp | archivage legitime, recuperation de contenus autorises | telechargement non autorise, violation copyright, contournement plateformes | sensible |\n| Ollama | IA locale privacy-first | execution non controlee, mauvaise hygiene prompts/secrets | interne |\n| Fooocus | generation image locale | images trompeuses, usurpation visuelle | sensible |\n| PhotoGIMP | design local | confusion marque/interface si redistribution trompeuse | interne |\n| Open Design | generation UI/design | copie de designs ou confusion avec outils proprietaires | interne |\n| Bitwarden Server | gestion secrets | mauvaise configuration exposant secrets | interne critique |\n\nRegle : `Sensible` = risque offensif direct, a connaitre pour defense et prevention, pas a diffuser comme tutoriel, pas d'exploitation operationnelle. `Sensible` = utile mais garde-fous forts selon contexte.\n\n## Prochaines actions\n\n1. Verifier les repos GitHub un par un.\n2. Ajouter URL repo officielle quand elle est confirmee.\n3. Transformer chaque outil utile en fiche individuelle si integration.","integratedAt":"2026-05-22","theme":"osint","themeLabel":"OSINT","concepts":[{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","parent":null},{"id":"lifecycle.inbox","label":"Inbox / veille","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.osint","label":"OSINT","parent":"domain"}]},{"id":"watch-ai-open-source-tools-watch-md","title":"AI Open Source Tools Watch","canonical":"","type":"Veille IA transversale.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#ia","#open-source","#github","#devtools","#agents","#saas","#osint","#local-first","#privacy"],"status":"a verifier","path":"watch/ai-open-source-tools-watch.md","repoUrl":"https://github.com/bizc0m/KM/blob/main/watch/ai-open-source-tools-watch.md","sourceUrl":"https://x.com/spacesuit_app/status/2042343866389442668","github":"","summary":"AI Open Source Tools Watch is a KM watch item classified as veille ia transversale.. The final source is preserved in the fiche and should be checked before product use, public reuse or operational integration.","relations":[],"raw":"# AI Open Source Tools Watch\n\n## Type\n\nVeille IA transversale.\n\n## Tags\n\n#ia, #open-source, #github, #devtools, #agents, #s ` | Redirection Claude Code vers fournisseurs gratuits | a verifier |\n\n## Deduplication\n\n- 10 liens fournis.\n- 9 liens uniques.\n- Doublon retire : `https://x.com/sweexx9/status/2057560520916414628`.\n\n## Arbitrage\n\n| Element | Decision | Raison |\n| --- | --- | --- |\n| Alternatives SaaS open source | garder | utile pour veille outils et stacks economes |\n| Agents vocaux / Pipecat | garder | directement utile aux themes IA agents |\n| ARGO local-first | garder | privacy-first, local, RAG, MCP |\n| ViMax video IA | garder | potentiel creation media, a verifier |\n| Image OSINT | garder avec prudence | utile renseignement, mais sensible |\n| Trading agents | a cadrer | risques financiers, ne pas traiter comme recommandation |\n| Redirection Claude Code gratuite | a verifier | risque legal, securite, tokens, conditions d'usage |\n\n## Risques\n\n- Posts X promotionnels ou incomplets.\n- Claims GitHub/stars/prix a reverifier avant usage.\n- Outils financiers : ne pas utiliser comme conseil financier.\n- OSINT image : usage privacy-first, pas de doxxing, pas de surveillance abusive.\n- Redirection de trafic IA : verifier securite, licences, conditions d'utilisation, exposition de prompts et secrets.\n\n## Prochaines actions\n\n1. Verifier les repos GitHub cites avant integration.\n2. Extraire seulement les outils compatibles privacy-first.\n4. Creer une sous-fiche dediee si un outil devient actionnable.","integratedAt":"2026-05-22","theme":"osint","themeLabel":"OSINT","concepts":[{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","parent":null},{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.osint","label":"OSINT","parent":"domain"},{"id":"domain.privacy","label":"Privacy","parent":"domain"}]},{"id":"watch-autoresearchclaw-autonomo per des workflows de recherche scientifique assistes par IA.\n- Etudier une architecture agentique longue, versionnee et human-in-the-loop.\n- Tester des mecanismes anti-hallucination : verification de citations, coherence papier/preuves, revue multi-agent.\n- Evaluer des garde-fous pour agents autonomes.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Papiers non verifies | generation de contenu academique qui peut sembler credible sans validation humaine | sensible |\n| Citation laundering | produire une bibliographie ou des claims qui donnent une fausse autorite | sensible |\n| API keys | configuration de providers LLM et couts pouvant exposer secrets ou budgets | sensible |\n| Execution d'experiences | code genere et execute en sandbox, risques de dependances ou donnees non controlees | sensible |\n| Publication automatique | diffusion de papier, resultats ou claims sans revue humaine | sensible |\n\n## Garde-fous\n\n- Toujours garder un mode human-in-the-loop pour toute sortie publique.\n- Ne jamais publier un papier, claim ou resultat sans revue humaine et verification source.\n- Ne pas stocker de cles API en clair dans config, repo, logs ou artifacts.\n- Auditer les experiences generees avant execution hors sandbox.\n- Distinguer clairement brouillon IA, resultat verifie et publication.","integratedAt":"2026-05-22","theme":"research","themeLabel":"Research","concepts":[{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"capability.documents","label":"Documents","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"capability.automation","label":"Automation","parent":"capability"},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-awesome-free-llm-apis-md","title":"Awesome Free LLM APIs","canonical": n| Donnees sensibles | envoi de secrets, prompts prives ou donnees personnelles a des providers tiers | sensible |\n| Terms mismatch | usage commercial ou production alors que le free tier l'interdit | sensible |\n| Provider volatile | limites, regions, prix et politiques data peuvent changer vite | sensible |\n| Key leakage | cles API copiees dans repo, logs ou prompts | sensible critique |\n\n## Garde-fous\n\n- Verifier chaque provider a la source officielle avant usage.\n- Ne jamais stocker de cle API en clair.\n- Documenter region, limite, cout reel, politique data et usage autorise.\n- Ne pas contourner quotas, paywalls ou conditions commerciales.\n- Preferer comptes/projets separes pour prototypes.\n- Ne pas envoyer de donnees personnelles ou confidentielles a un provider gratuit non audite.","integratedAt":"2026-05-22","theme":"llm","themeLabel":"LLM / API","concepts":[{"id":"domain.ai.llm","label":"LLM / Providers","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"lifecycle.inbox","label":"Inbox / veille","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-ccgui-mossx-vibecoding-editor-md","title":"CC-GUI / MossX - VibeCoding Editor","canonical":"","type":"Veille outils IA / editeur vibe coding multi-engine.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#vibe-coding","#ai-editor","#developer-tools","#claude-code","#codex","#opencode","#gemini","#multi-engine","#sensitive","#to-verify"],"status":"a verifier","path":"watch/ccgui-mossx-vibecoding-editor.md","repoUrl":"https://github.com/bizc0m/KM/blob/main/watch/ccgui-mossx-vibecoding-editor.md","sourceUrl":"https://vibeshit.org/product/ccgui","github":"","summary":"CC-GUI / MossX - VibeCoding Editor is a KM watch item classified as veille outils ia / editeur vibe coding multi-engine.. The final source is preserved in the fiche and should be checked before product use, public reuse or operational integration.","relations":[],"raw":"# CC-GUI / MossX - VibeCoding Editor\n\n## Type\n\nVeille outils IA / editeur vibe coding multi-engine.\n\n## Tags\n\n#vibe-coding, #ai-editor, #developer-tools, #claude-code, #codex, #opencode, #gemini, #multi-engine, #sensitive, #to-verify\n\n## Sources\n\n- Page Vibe Shit : `https://vibeshit.org/product/ccgui`\n- Site associe : `https://www.mossx.ai/`\n\nLecture : 2026-05-22\n\n## Statut verification\n\n`a verifier`\n\nLa page Vibe Shit annonce un lien GitHub et un auteur `zhukunpenglinyutong`, mais le repo visible n'a pas ete confirme via GitHub API au moment de la verification. Le site MossX est lisible et presente un portail vibe coding open source avec support Claude Code, Codex, Cursor/VSCode, AI workflows, MCP Market et Skills Market.\n\n## Resume court\n\nCC-GUI / MossX - VibeCoding Editor is a KM watch item classified as Veille outils IA / editeur vibe coding multi-engine. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.\n\n## Usage utile\n\n- Comparer les interfaces AI coding : Cursor, Claude Code GUI, Codex, OpenCode, Gemini.\n- Surveiller les patterns UI pour agents de code : terminal, git, kanban, memoire, workflows.\n- Identifier les risques d'integration multi-provider et multi-agent dans un IDE.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Code disclosure | envoyer code prive ou prompts sensibles a des providers non verifies | sensible |\n| Key leakage | stocker cles API / tokens dans config, logs ou plugins | sensible critique |\n| Tool execution | laisser un agent modifier fichiers, git ou terminal sans validation | sensible |\n| Supply chain | installer plugins, MCP ou skills non audites | sensible |\n| False authority | UI professionnelle pouvant masquer des claims non verifies | sensible |\n\n## Garde-fous\n\n- Verifier repo, licence, permissions et modele de securite avant usage.\n- Ne pas ouvrir de repo sensible dans un editeur non audite.\n- Ne pas stocker secrets en clair dans l'outil.\n- Desactiver execution terminal/git automatique sans validation humaine.\n- Tester uniquement sur repo sandbox avant integration.\n- Auditer MCP, skills et plugins ajoutes.","integratedAt":"2026-05-22","theme":"dev","themeLabel":"Dev tools","concepts":[{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"risk.verify","label":"A verifier","parent":"risk"}]},{"id":"watch-codepatrol-code-security-md","title":"CodePatrol - Code Security Watch","canonical":"","type":"Veille outils dev/security / code review et SAST.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#code-security","#sast","#code-review","#vulnerability-scanning","#appsec","#devtools","#sensitive","#to-verify"],"status":"a verifier","path":"watch/codepatrol-code-security.md","repoUrl":"https://github.com/bizc0m/KM/blob/main/watch/codepatrol-code-security.md","sourceUrl":"https://codepatrol-2.polsia.app/","github":"","summary":"CodePatrol - Code Security Watch is a KM watch item classified as veille outils dev/security / code review et sast.. The final source is preserved in the fiche and should be checked before product use, public reuse or operational integration.","relations":[],"raw":"# CodePatrol - Code Security Watch\n\n## Type\n\nVeille outils dev/security / code review et SAST.\n\n## Tags\n\n#code-security, #sast, #code-review, #vulnerability-scanning, #appsec, #devtools, #sensitive, #to-verify\n\n## Sources\n\n- URL fournie : `https://codepatrol-2.polsia.app/`\n- Source secondaire trouvee : `https://sourceforge.net/software/product/CodePatrol/`\n\nLecture : 2026-05-22\n\n## Statut verification\n\n`a verifier`\n\nL'URL fournie n'a pas donne de contenu exploitable dans la lecture actuelle. Les resultats publics associent le nom CodePatrol a un outil de revue de code automatisee orientee securite, SAST, scan de vulnerabilites et agregation de resultats.\n\n## Resume court\n\nCodePatrol - Code Security Watch is a KM watch item classified as Veille outils dev/security / code review et SAST. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.\n\n## Usage utile\n\n- Surveiller les outils SAST et code review securite.\n- Comparer avec CodeQL, Semgrep, Checkmarx, Veracode, Codacy ou plateformes AI-native AppSec.\n- Inspirer un flux KM de verification de projets : secrets, vulnerabilites, dependances, IaC, qualite code.\n- Relier aux guardrails agents avant execution ou publication de code.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Upload code prive | envoyer un repo sensible vers un SaaS non verifie | sensible critique |\n| Secrets exposure | scan d'un repo contenant tokens, credentials ou donnees client | sensible critique |\n| False confidence | croire qu'un scan SAST remplace audit humain ou tests dynamiques | sensible |\n| Supply chain | installer un outil ou plugin non verifie dans CI/CD | sensible |\n\n## Garde-fous\n\n- Ne pas connecter de repo prive avant verification du fournisseur, des conditions et du traitement des donnees.\n- Scanner localement ou sur repo test quand possible.\n- Ne jamais uploader secrets, `.env`, dumps, logs ou donnees personnelles.\n- Verifier provenance, integrations, permissions GitHub/GitLab et politique de retention.\n- Traiter les resultats comme signal, pas comme preuve absolue.","integratedAt":"2026-05-22","theme":"security","themeLabel":"Security","concepts":[{"id":"domain.dev","label":"Developpement","parent":"domain"},{ l | a suivre |\n\n## Fiche courte - Orbit\n\n### Resume\n\nOrbit aide des groupes d'amis a trouver des disponibilites communes via calendrier, cercles, nudges et RSVP.\n\n### Patterns utiles\n\n- Disponibilite calendrier sans partager les titres d'evenements.\n- Cercles sociaux par groupe/vibe.\n- Nudges automatiques mais limites.\n- RSVP simple.\n- Ton ludique sans culpabilisation.\n\n### Liens projets\n\n- NightLife : organiser sorties, groupes, RSVP, opt-in calendrier.\n- NightCrawl : cercles de veille / transmissions de groupe.\n- Annecy Intel : coordination locale et sorties.\n\n### Garde-fous\n\n- Geoloc/calendrier toujours opt-in.\n- Pas de score de popularite sociale.\n- Pas de penalite si refus ou absence.\n- Cadence de nudges explicite et configurable.\n- Pas de partage des titres d'evenements.\n\n### Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Tracking relationnel | mesurer qui voit qui et a quelle frequence | sensible |\n| Pression sociale | relancer trop souvent les personnes moins presentes | sensible |\n| Profilage social | inferer habitudes, groupes ou disponibilites | sensible ; Sensible si ciblage/stalking non consenti |\n\n## Fiche courte - Oh My Pizza!\n\n### Resume\n\nBlog personnel de Scott Yoshinaga avec archives, updates, posts culturels et notes pratiques. Source deja utile via l'article sur Twitter/X via RSS.\n\n### Patterns utiles\n\n- Curation personnelle claire.\n- Articles longs avec liens sortants.\n- Archive simple.\n- Melange culture, apps, musique et petites trouvailles web.\n- Bon modele de source de veille humaine, non algorithmique.\n\n### Liens projets\n\n- KM : source de veille et methode de curation.\n- Inspiration contenu : formats listes, favoris annuels, liens outils.\n\n### Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Surinterpretation | traiter un blog personnel comme source officielle | faible |\n| Copie de contenu | reprendre la curation ou le texte sans attribution | sensible |\n| Tracking culturel individuel | profiler les gouts d'une personne a partir de ses archives | sensible ; Sensible si harcelement/ciblage non consenti |\n\n### Garde-fous\n\n- Citer comme source personnelle.\n- Ne pas copier le wording ou les listes entieres.\n- Extraire des patterns et liens, pas l'identite personnelle.\n- Verifier les outils cites via sources primaires.\n\n## Prochaines actions\n\n1. Ajouter les prochaines references inspirantes dans ce fichier.\n2. Creer une fiche dediee seulement si une reference devient structurante.","integratedAt":"2026-05-22","theme":"privacy","themeLabel":"Privacy","concepts":[{"id":"lifecycle.inbox","label":"Inbox / veille","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"domain.privacy","label":"Privacy","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-nanoclaw-personal-agent-md","title":"NanoClaw - Personal AI Agent","canonical":"","type":"Veille outils IA / agent personnel multi-canaux.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#ai-agent","#personal-agent","#messaging","#containers","#claude-agent-sdk","#credential-vault","#local-first","#automation","#sensitive"],"status":"sensible","path":"watch/nanoclaw-personal-agent.md","repoUrl":"https://github.com/bizc0m/KM/blob/main/watch/nanoclaw-personal-agent.md","sourceUrl":"https://vibeshit.org/product/nanoclaw","github":"https://github.com/nanocoai/nanoclaw","summary":"NanoClaw - Personal AI Agent is a KM watch item classified as veille outils ia / agent personnel multi-canaux.. The final source is preserved in the fiche and should be checked before product use, public reuse or operational integration.","relations":[],"raw":"# NanoClaw - Personal AI Agent\n\n## Type\n\nVeille outils IA / agent perso ation GitHub API :\n\n- repo : `GreyDGL/PentestGPT`\n- description : automated penetration testing agentic framework powered by large language models\n- stars lus : 13240\n- forks lus : 2274\n- licence : MIT\n- archived : false\n- dernier push lu : 2026-02-23\n\n## Resume court\n\nPentestGPT - Autonomous Penetration Testing is a KM watch item classified as Veille `Sensible` / outil IA de pentest autonome. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.\n\n## Classification\n\n`Sensible`\n\nRaison : l'outil facilite directement des actions offensives operationnelles : reconnaissance, exploitation, post-exploitation et automatisation d'attack chains. A connaitre pour defense, audit, threat intelligence et comprehension du paysage, mais pas a diffuser comme guide d'usage.\n\n## Usage defensif legitime\n\n- Laboratoire interne, CTF, HackTheBox ou environnement explicitement autorise.\n- Evaluation defensive d'agents de pentest autonomes.\n- Etude des risques d'automatisation offensive par LLM.\n- Benchmark de garde-fous, detection, journalisation et containment.\n- Formation securite uniquement dans un cadre autorise et supervise.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Recon non autorisee | scan ou enumeration de cibles tierces | Sensible |\n| Exploitation | selection et execution de techniques d'exploitation | Sensible |\n| Privilege escalation | recherche de chemins d'elevation sur systemes compromis | Sensible |\n| Lateral movement | chainage d'actions apres acces initial | Sensible |\n| Abaissement de barriere | aide a des profils non qualifies pour conduire des attaques | Sensible |\n\n## Garde-fous\n\n- Ne pas fournir de commandes, payloads, procedures ou chaines d'exploitation.\n- Ne pas tester sur cible externe sans autorisation ecrite.\n- Ne pas connecter a des credentials, VPN, clouds ou reseaux reels sans cadrage.\n- Executer uniquement en lab isole si test local.\n- Journaliser objectif, perimetre, autorisation, cible, duree et responsable.","integratedAt":"2026-05-22","theme":"security","themeLabel":"Security","concepts":[{"id":"risk.offensive","label":"Offensif / #ROUGE","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.osint","label":"OSINT","parent":"domain"}]},{"id":"watch-red-team-risk-tools-watch-md","title":"Red Team Risk Tools Watch","canonical":"","type":"Veille outils sensibles #ROUGE.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#dual-use","#offensive-risk","#osint","#anti-detection","#privacy","#threat-intelligence"],"status":"#ROUGE","path":"watch/red-team-risk-tools-watch.md","repoUrl":"https://github.com/bizc0m/KM/blob/main/watch/red-team-risk-tools-watch.md","sourceUrl":"","github":"","summary":"Centraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger. #ROUGE signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.","relations":[],"raw":"# Red Team Risk Tools Watch\n\n## Type\n\nVeille outils sensibles `Sensible`.\n\n## Tags\n\n#rouge, #dual-use, #offensive-risk, #osint, #anti-detection, #privacy, #threat-intelligence\n\n## Role\n\nCentraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger.\n\n`Sensible` signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.\n\n## Regles Sensible\n\n- Recuperer les outils offensifs au lieu de les ignorer.\n- Les classer clairement `Sensible`.\n- Distinguer usage legitime defensif et usage abusif.\n- Ne pas fournir de mode d'emploi offensif.\n- Ne pas fournir de payload, procedure d'exploitation, contournement, ciblage ou automatisation abusive.\n- Ne pas stocker de donnees personnelles extraites par ces outils.\n- Ne pas integrer dans un projet sans cadrage explicite.\n\n## Outils / familles classes Sensible\n\nCritere strict : `Sensible` uniquement si l'outil facilite directement un usage offensif, furtif, intrusif ou d'abus a grande echelle.\n\n| Outil / famille | Usage defensif legitime | Usage abusif possible | Diffusion |\n| --- | --- | --- | --- |\n| Camofox Browser | tester detection bot sur ses propres services | contournement anti-bot, scraping furtif, fraude plateformes | Sensible non public |\n| Vehicle Search Tools | investigation autorisee, verification defensive | doxxing, stalking, identification de particuliers via plaques/VIN | Sensible non public |\n| Image OSINT tools | verification source image, threat intel, fact-checking | geolocalisation abusive, identification non consentie | Sensible non public |\n| Playwright MCP | tests QA, accessibilite, verification UI | automatisation d'actions non autorisees, scraping abusif | Sensible si cible externe |\n| n8n | automatisation interne | spam, exfiltration, scraping automatise | Sensible si connecteurs sensibles |\n| FreeLLMAPI / ARGO / LibreChat | self-host, privacy, experimentation controlee | fuite secrets, contournement conditions, agent non supervise | Sensible si secrets/comptes tiers |\n| PentestGPT | lab autorise, CTF, evaluation defensive d'agents de pentest | reconnaissance, exploitation, post-exploitation et privilege escalation non autorisees | Sensible non public |\n| PromptSpy / AI Android malware | threat intelligence, sensibilisation mobile, detection defensive | malware adaptatif, spyware Android, persistance et evasion mobile | Sensible non public |\n| CyberStrike | lab autorise, evaluation defensive d'agents de red team IA | automatisation de reconnaissance, pentest et chainage offensif | Sensible non public |\n| MalwareSourceCode | reverse engineering et detection en environnement isole | reutilisation, adaptation ou diffusion de code malware | Sensible non public |\n| GoSearch digital footprint | audit de sa propre exposition publique, sensibilisation privacy | doxxing, stalking, correlation de comptes et collecte de donnees personnelles | Sensible non public |\n| GhostTrack | audit de sa propre exposition publique, sensibilisation privacy | doxxing, stalking, correlation telephone/username/IP | Sensible non public |\n| Reverse Skill / hacker skills | threat intelligence, lab autorise, audit de skills agents | reverse non autorise, automatisation de taches offensives par agent | Sensible non public |\n| Serus dark web leak search | audit de ses propres comptes ou domaine autorise | recherche de donnees compromises, doxxing, credential abuse | Sensible non public |\n| IG-Detective Instagram OSINT | investigation autorisee et sensibilisation privacy | enumeration de contacts, geolocalisation, contournement et ciblage de profils | Sensible non public |\n| Aliens_eye AI OSINT | audit de sa propre exposition publique, veille privacy autorisee | correlation de comptes, doxxing, stalking et ciblage de personnes | Sensible non public |\n| Pentagi autonomous pentest agents | evaluation en lab isole et autorise, threat intelligence defensive | reconnaissance, exploitation et chainage de penetration testing non autorises | Sensible non public |\n\n## Sensible mais pas Sensible par defaut\n\n| Outil / famille | Pourquoi sensible | Classement |\n| --- | --- | --- |\n| Voicebox / Pipecat / Whisper | voix, transcription, consentement | sensible |\n| ViMax / OpenShorts / Hyperframes | generation media, risque deepfake selon contenu | sensible |\n| Agentic Inbox | email, validation humaine requise | sensible |\n| Claude Ads | manipulation publicitaire possible selon usage | sensible |\n| AutoHedge / Vibe-Trading / Fincept Terminal | risque financier | sensible finance |\n| Twitter RSS / Nitter / OpenRSS | veille publique pouvant deriver en surveillance | sensible |\n| Orbit / social planning | tracking relationnel possible si non consenti | sensible |\n\n## Garde-fous generaux\n\n- Usage uniquement autorise, defensif ou educatif.\n- Validation humaine obligatoire pour toute action externe.\n- Aucune diffusion publique de procedure offensive.\n- Aucune collecte de personnes privees.\n- Aucune execution sur cible tierce sans autorisation.\n- Journaliser les sources, pas les donnees sensibles.","integratedAt":"2026-05-22","theme":"security","themeLabel":"Security","concepts":[{"id":"risk.offensive","label":"Offensif / #ROUGE","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.osint","label":"OSINT","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.privacy","label":"Privacy","parent":"domain"}]},{"id":"watch-twitter-rss-monitoring-md","title":"Twitter RSS Monitoring","canonical":"","type":"Veille process / source monitoring.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#rss","#twitter","#x","#monitoring","#nitter","#openrss","#social-watch","#privacy"],"status":"sensible","path":"watch/twitter-rss-monitoring.md","repoUrl":"https://github.com/bizc0m/KM/blob/main/watch/twitter-rss-monitoring.md","sourceUrl":"https://ohmypizza.com/2023/04/keeping-up-with-twitter-via-rss","github":"https://github.com/zedeus/nitter","summary":"Twitter RSS Monitoring is a KM watch item classified as veille process / source monitoring.. The final source is preserved in the fiche and should be checked before product use, public reuse or operational integration.","relations":[],"raw":"# Twitter RSS Monitoring\n\n## Type\n\nVeille process / source monitoring.\n\n## Tags\n\n#rss, #twitter, #x, #monitoring, #nitter, #openrss, #social-watch, #privacy\n\n## Source\n\nArticle : `Keeping Up With Twitter Via RSS Feeds`\n\nURL : `https://ohmypizza.com/2023/04/keeping-up-with-twitter-via-rss`\n\nAuteur : Scott Yoshinaga\n\nDate source : 2023-04-20\n\nLecture KM : 2026-05-22\n\n## Resume court\n\nTwitter RSS Monitoring is a KM watch item classified as Veille process / source monitoring. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.\n\n## Outils cites\n\n| Outil | URL | Usage | Statut |\n| --- | --- | --- | --- |\n| Nitter | `https://nitter.net/<username>` | consulter un compte Twitter via interface alternative et recuperer un RSS | verifie partiel 2026-05-22, service/instances instables |\n| OpenRSS | `https://openrss.org/twitter.com/<username>` | generer un flux RSS depuis un compte Twitter public | verifie source officielle 2026-05-22 |\n\n## Nitter - verification officielle\n\nSources :\n\n- Instance : `https://nitter.net/`\n- Repo : `https://github.com/zedeus/nitter`\n\nVerification 2026-05-22 :\n\n- `https://nitter.net/` repond, mais la page chargee est minimale.\n- Repo GitHub verifie via GitHub API : `zedeus/nitter`.\n- Licence GitHub : AGPL-3.0.\n- Repo non archive au moment de la verification.\n- Dernier push lu via GitHub API : 2026-04-16.\n\nNotes de contexte :\n\n- Nitter est un frontend alternatif Twitter/X centre privacy/performance.\n- Le projet a connu une forte instabilite apres les changements d'acces de Twitter/X.\n- Plusieurs sources publiques indiquent que les instances et le RSS peuvent etre instables ou desactives selon les periodes.\n- A utiliser comme source de veille opportuniste, pas comme infrastructure fiable de production.\n\n## OpenRSS - verification officielle\n\nSource officielle : `https://openrss.org/`\n\nGuides / conditions lues :\n\n- `https://openrss.org/guides/how-to-use-an-open-rss-feed`\n- `https://openrss.org/terms`\n\nPoints verifies :\n\n- Page racine relue le 2026-05-22 depuis le lot fourni.\n- OpenRSS permet d'ajouter `openrss.org/` devant une URL pour obtenir un flux RSS quand la page est supportee.\n- Le service annonce des flux sans algorithmes de recommandation.\n- Le service indique retirer certains scripts, tracking links et contenus invasifs des flux.\n- OpenRSS est presente comme organisation nonprofit 501(c)(3).\n- Usage annonce : personnel, informatif, non commercial.\n- Les conditions demandent de limiter la frequence des requetes.\n- Les conditions interdisent l'usage illegal, le contournement de restrictions, l'acces a du contenu payant, l'espionnage, le harcelement et le monitoring de contenu non public.\n\n## Usage utile\n\n- Veille sobre sur comptes publics.\n- Centraliser des sources X dans un lecteur RSS.\n- Reduire l'exposition a l'interface addictive de X.\n- Surveiller les comptes source utiles pour KM sans connexion directe a X.\n- Alimenter une veille manuelle non intrusive.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Surveillance abusive | suivre systematiquement une personne sans cadre legitime | Sensible si cible personne privee |\n| Scraping agressif | multiplier flux et requetes au-dela d'une veille raisonnable | sensible ; Sensible si automatisation furtive ou massive |\n| Contournement plateforme | utiliser des services alternatifs pour contourner limites/API sans respecter conditions | sensible |\n| Profilage | croiser flux publics pour profiler une personne ou un groupe | sensible ; Sensible si ciblage individuel non consenti |\n\n## Garde-fous\n\n- Utiliser uniquement des comptes publics et pertinents pour la veille.\n- Ne pas suivre de personnes privees sans raison legitime.\n- Ne pas stocker donnees personnelles issues de flux.\n- Ne pas automatiser a grande echelle.\n- Respecter les limites des services tiers et les conditions applicables.\n- Preferer la veille thematique aux listes nominatives.\n- Usage OpenRSS : personnel, non commercial, frequence raisonnable.\n- Ne pas redistribuer les flux OpenRSS dans une app publique ou payante sans verifier les conditions.\n- Usage Nitter : limiter a une veille manuelle ou faible frequence ; ne pas dependra d'instances publiques pour un produit.","integratedAt":"2026-05-22","theme":"privacy","themeLabel":"Privacy","concepts":[{"id":"domain.privacy","label":"Privacy","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-vibeshit-vibe-coding-directory-md","title":"Vibe Shit - Vibe Coding Directory","canonical":"","type":"Veille outils IA / annuaire projets vibe coding.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#vibe-coding","#ai-tools","#agents","#llm","#devtools","#directory","#inspiration","#sensitive"],"status":"sensible","path":"watch/vibeshit-vibe-coding-directory.md","repoUrl":"https://github.com/bizc0m/KM/blob/main/watch/vibeshit-vibe-coding-directory.md","sourceUrl":"https://vibeshit.org/","github":"","summary":"Vibe Shit - Vibe Coding Directory is a KM watch item classified as veille outils ia / annuaire projets vibe coding.. The final source is preserved in the fiche and should be checked before product use, public reuse or operational integration.","relations":[],"raw":"# Vibe Shit - Vibe Coding Directory\n\n## Type\n\nVeille outils IA / annuaire projets vibe coding.\n\n## Tags\n\n#vibe-coding, #ai-tools, #agents, #llm, #devtools, #directory, #inspiration, #sensitive\n\n## Source\n\nSite : `https://vibeshit.org/`\n\nLecture : 2026-05-22\n\n## Resume court\n\nVibe Shit - Vibe Coding Directory is a KM watch item classified as Veille outils IA / annuaire projets vibe coding. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.\n\n## Usage utile\n\n- Reperer rapidement des outils IA, agents, devtools et projets open source.\n- Suivre les tendances vibe coding sans dep let activeId=KM_INDEX[0]?.id||"", topic="Tous", selected=new Set();
const byId=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function toast(msg){const t=byId("toast");t.textContent=msg;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function isSensitiveStatus(s){return s==="#ROUGE"||s==="sensible"}
function statusLabel(s){return isSensitiveStatus(s)?"Sensible":s}
function statusClass(s){return isSensitiveStatus(s)?"hot":s==="a verifier"?"warn":""}
function statusRank(v){return isSensitiveStatus(v)?0:v==="a verifier"?1:v==="actif"?2:3}
function dateRank(item){return Date.parse(item.integratedAt||"")||0}
function itemTerms(item){return norm([item.title,item.type,item.bucket,item.status,item.tags.join(" "),item.concepts.map(c=>c.label).join(" "),item.summary,item.raw].join(" "))}
function queryTerms(){return norm(byId("search").value).split(/\s+/).filter(Boolean)}
function matchesQuery(item,terms){if(!terms.length)return 1;const hay=itemTerms(item);for(const term of terms){if(!hay.includes(term))return 0}return 1}
function filteredItems(){const terms=queryTerms(), status=byId("statusFilter").value, folder=byId("folderFilter").value, theme=byId("themeFilter").value, concept=byId("conceptFilter").value, tag=norm(byId("tagFilter").value), sort=byId("sort").value;let rows=KM_INDEX.filter(item=>matchesQuery(item,terms)>0);rows=rows.filter(item=>topic==="Tous"||item.theme===topic);rows=rows.filter(item=>folder==="all"||item.folder===folder);rows=rows.filter(item=>theme==="all"||item.theme===theme);rows=rows.filter(item=>concept==="all"||item.concepts.some(c=>c.id===concept));rows=rows.filter(item=>status==="all"||(status==="sensible"&&isSensitiveStatus(item.status))||item.status===status);rows=rows.filter(item=>!tag||norm(item.tags.join(" ")).includes(tag)||norm(item.type).includes(tag)||norm(item.theme).includes(tag)||norm(item.folderLabel).includes(tag)||norm(item.concepts.map(c=>c.label).join(" ")).includes(tag));rows.sort((a,b)=>sort==="title"?a.title.localeCompare(b.title):sort==="type"?a.theme.localeCompare(b.theme)||a.title.localeCompare(b.title):sort==="status"?statusRank(a.status)-statusRank(b.status)||a.title.localeCompare(b.title):dateRank(b)-dateRank(a)||a.title.localeCompare(b.title));return rows}
function activeItem(){return KM_INDEX.find(item=>item.id===activeId)||filteredItems()[0]||KM_INDEX[0]}
function highlight(text){let safe=esc(text);for(const term of queryTerms()){if(term.length<2)continue;safe=safe.replace(new RegExp(term.replace(/[.*+?^\$\{\}()|[\]\\]/g,"\\$&"),"ig"),m=>"<mark>"+m+"</mark>")}return safe}
function themeOfTag(tag,fallback){const text=norm(tag);if(/rouge|pentest|red|offensive|security/.test(text))return"security";if(/osint|threat|image|vehicle/.test(text))return"osint";if(/source|rss|x|twitter|monitor/.test(text))return"source";if(/github|code|dev|editor|coding/.test(text))return"dev";if(/llm|api|openai|provider/.test(text))return"llm";if(/agent|automation|ia|ai/.test(text))return"agent";if(/research|paper|citation/.test(text))return"research";if(/privacy|local|session|analytics/.test(text))return"privacy";if(/finance|trading/.test(text))return"finance";if(/directory|watch|inspiration|competitor|vibe/.test(text))return"watchlist";if(/media|video|voice|design/.test(text))return"media";return fallback||"tool"}
function inlineMd(text){const tick=String.fromCharCode(96);const links=[];let safe=esc(text).replace(new RegExp("\\[([^\\]]+)\\]\\((https?:\\/\\/[^)]+)\\)","g"),(_,label,url)=>{const id="@@LINK"+links.length+"@@";links.push('<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');return id});safe=safe.replace(new RegExp("(https?:\\/\\/[^\\s<]+)","g"),'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(new RegExp(tick+"([^"+tick+"]+)"+tick,"g"),"<code>$1</code>");links.forEach((link,i)=>{safe=safe.replace("@@LINK"+i+"@@",link)});return safe}
function markdown(md){const lines=String(md||"").split("\n");let out="", inList=false, inTable=false;const close=()=>{if(inList){out+="</ul>";inList=false}if(inTable){out+="</tbody></table>";inTable=false}};for(const line of lines){if(/^\|(.+)\|$/.test(line)&&!/^\|\s*-/.test(line)){if(!inTable){close();out+="<table><tbody>";inTable=true}out+="<tr>"+line.slice(1,-1).split("|").map(c=>"<td>"+inlineMd(c.trim())+"</td>").join("")+"</tr>";continue}if(/^\|\s*-/.test(line))continue;if(inTable&&!/^\|/.test(line))close();if(/^###\s+/.test(line)){close();out+="<h3>"+inlineMd(line.replace(/^###\s+/,""))+"</h3>";continue}if(/^##\s+/.test(line)){close();out+="<h2>"+inlineMd(line.replace(/^##\s+/,""))+"</h2>";continue}if(/^#\s+/.test(line)){close();out+="<h1>"+inlineMd(line.replace(/^#\s+/,""))+"</h1>";continue}if(/^[-*]\s+/.test(line)){if(!inList){close();out+="<ul>";inList=true}out+="<li>"+inlineMd(line.replace(/^[-*]\s+/,""))+"</li>";continue}if(!line.trim()){close();continue}close();out+="<p>"+inlineMd(line)+"</p>"}close();return out}
function renderStats(){const sens=KM_INDEX.filter(i=>isSensitiveStatus(i.status)).length, ver=KM_INDEX.filter(i=>i.status==="a verifier").length, resources=KM_INDEX.filter(i=>i.folder==="resources").length;byId("statsbar").innerHTML='<div class="stat"><span>Fiches</span><b>'+KM_INDEX.length+'</b></div><div class="stat danger"><span>Sensibles</span><b>'+sens+'</b></div><div class="stat"><span>A verifier</span><b>'+ver+'</b></div><div class="stat"><span>Resources</span><b>'+resources+'</b></div>'}
function conceptDepth(c){let n=0,p=c.parent;while(p){n++;p=(KM_CONFIG.concepts.find(x=>x.id===p)||{}).parent}return n}
function renderFilters(){const folder=byId("folderFilter").value||"all", theme=byId("themeFilter").value||"all", concept=byId("conceptFilter").value||"all";byId("folderFilter").innerHTML='<option value="all">Tous dossiers</option>'+KM_CONFIG.folders.map(f=>'<option value="'+esc(f.id)+'" '+(folder===f.id?'selected':'')+'>'+esc(f.label)+'</option>').join("");byId("themeFilter").innerHTML='<option value="all">Tous themes</option>'+KM_CONFIG.themes.map(t=>'<option value="'+esc(t.id)+'" '+(theme===t.id?'selected':'')+'>'+esc(t.label)+'</option>').join("");byId("conceptFilter").innerHTML='<option value="all">Toute ontologie</option>'+KM_CONFIG.concepts.map(c=>'<option value="'+esc(c.id)+'" '+(concept===c.id?'selected':'')+'>'+esc(".".repeat(conceptDepth(c))+c.label)+'</option>').join("")}
function renderTopics(){const themes=[...new Set(KM_INDEX.map(i=>i.theme))].filter(Boolean);const topics=["Tous",...themes];byId("topics").innerHTML=topics.map(t=>'<button class="topic '+(t===topic?"active":"")+'" data-topic="'+esc(t)+'">'+esc(t==="Tous"?"Tous":(KM_CONFIG.themes.find(x=>x.id===t)?.label||t))+'</button>').join("")}
function tagButton(label,cls){return '<button type="button" class="tag tag-btn '+esc(cls||"")+'" data-action="tag" data-tag="'+esc(label)+'">'+highlight(label)+'</button>'}
function sameTagTheme(tag,theme){const a=norm(tag).replace(/^#/,"").replace(/s$/,""),b=norm(theme).replace(/s$/,"");return a===b}
function displayConcepts(item){const broad=new Set(["Domaines","IA","Capacites","Risques","Cycle de vie"]);return item.concepts.filter(c=>c.parent&&!broad.has(c.label)&&c.label!==item.themeLabel&&c.label!==statusLabel(item.status)).slice(0,4)}
function sourceLinks(item){return '<a class="tag github-link" href="'+esc(item.repoUrl)+'" target="_blank" rel="noopener noreferrer">Fiche GitHub</a>'+(item.github?'<a class="tag github-link" href="'+esc(item.github)+'" target="_blank" rel="noopener noreferrer">Repo GitHub</a>':"")+(item.sourceUrl?'<a class="tag" href="'+esc(item.sourceUrl)+'" target="_blank" rel="noopener noreferrer">Source</a>':"")}
function inlineNoteHtml(item){const concepts=displayConcepts(item).map(c=>tagButton(c.label,themeOfTag(c.label,item.theme))).join("");const tags=item.tags.filter(t=>norm(t)!=="#watch"&&norm(t)!=="watch"&&!sameTagTheme(t,item.theme)&&!(isSensitiveStatus(item.status)&&/^#?(rouge|sensible|sensitive)$/i.test(t))).slice(0,4).map(t=>tagButton(t,themeOfTag(t,item.theme))).join("");return '<div class="inline-note"><div class="inline-head">'+tagButton(statusLabel(item.status),statusClass(item.status))+'<h4 class="inline-title">'+highlight(item.title)+'</h4></div><div class="source-strip"><span>'+esc(item.integratedAt||"date n/a")+'</span>'+sourceLinks(item)+'<span>'+esc(item.path)+'</span><span>'+esc(item.themeLabel)+'</span>'+concepts+tags+'</div><p>'+esc(item.summary)+'</p><div class="inline-actions"><a class="btn dark" href="'+esc(item.repoUrl)+'" target="_blank" rel="noopener noreferrer">Fiche GitHub</a><a class="btn" href="'+esc(item.path)+'" target="_blank" rel="noopener noreferrer">Ouvrir .md</a><button class="btn" data-action="copy">Copier MD</button><button class="btn" data-action="collapse">Replier</button><button class="btn red" data-action="select">Selection</button></div></div>'}
function cardHtml(item){const active=item.id===activeId, sel=selected.has(item.id);const tags=item.tags.filter(t=>norm(t)!=="#watch"&&norm(t)!=="watch"&&!sameTagTheme(t,item.theme)&&!(isSensitiveStatus(item.status)&&/^#?(rouge|sensible|sensitive)$/i.test(t))).slice(0,3);return '<article class="news-card '+(active?"active":"")+' '+(sel?"selected":"")+'" data-id="'+esc(item.id)+'"><div class="check" data-action="select" title="Selectionner"></div><div><div class="title-row">'+tagButton(statusLabel(item.status),statusClass(item.status))+'<a class="tag github-link" href="'+esc(item.repoUrl)+'" target="_blank" rel="noopener noreferrer">Fiche GitHub</a><h3 class="news-title" data-action="open">'+highlight(item.title)+'</h3></div><div class="meta">'+tagButton("#"+item.theme,item.theme)+tags.map(t=>tagButton(t,themeOfTag(t,item.theme))).join("")+'</div></div>'+(active?inlineNoteHtml(item):"")+'</article>'}
function renderFeed(){const rows=filteredItems();if(!rows.some(i=>i.id===activeId)&&rows[0])activeId=rows[0].id;byId("feedCount").textContent=rows.length+" resultats";byId("articleStatus").innerHTML="<span>"+rows.length+" fiches visibles</span><span>"+selected.size+" selectionnees</span>";byId("feed").innerHTML=rows.map(cardHtml).join("")||'<section class="note"><strong>Aucun resultat</strong><p>Vide la recherche ou change les filtres.</p></section>'}

function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}

function currentShareUrl(){const params=new URLSearchParams();const q=byId("search").value.trim(), folder=byId("folderFilter").value, theme=byId("themeFilter").value, concept=byId("conceptFilter").value, status=byId("statusFilter").value, tag=byId("tagFilter").value.trim();if(q)params.set("q",q);if(folder&&folder!=="all")params.set("folder",folder);if(theme&&theme!=="all")params.set("theme",theme);if(concept&&concept!=="all")params.set("concept",concept);if(status&&status!=="all")params.set("status",status);if(tag)params.set("tag",tag);if(activeItem())params.set("fiche",activeItem().id);return location.href.split("#")[0]+"#"+params.toString()}

document.addEventListener("click",e=>{if(e.target.id==="toggleFiche"||e.target.id==="toggleFicheHeader"||e.target.id==="toggleFicheTop"){const collapsed=!byId("workspace").classList.contains("fiche-collapsed");setFicheCollapsed(collapsed);toast(collapsed?"Fiche repliee":"Fiche ouverte");return}if(e.target.id==="openFiche"){setFicheCollapsed(false);toast("Fiche ouverte");return}const tagBtn=e.target.closest('[data-action="tag"]');if(tagBtn){byId("tagFilter").value=tagBtn.dataset.tag||"";renderAll();toast("Tag filtre: "+(tagBtn.dataset.tag||""));return}const topicBtn=e.target.closest(".topic");if(topicBtn){topic=topicBtn.dataset.topic;renderAll();return}const card=e.target.closest(".news-card");if(card&&e.target.dataset.action==="collapse"){activeId="";history.replaceState(null,"",location.href.split("#")[0]);renderAll();toast("Note repliee");return}if(card&&e.target.dataset.action==="select"){selected.has(card.dataset.id)?selected.delete(card.dataset.id):selected.add(card.dataset.id);renderAll();return}if(card&&e.target.dataset.action==="copy"){const item=KM_INDEX.find(i=>i.id===card.dataset.id);copy(itemMarkdown(item)).then(()=>toast("Fiche copiee"));return}if(card&&(e.target.dataset.action==="open"||!e.target.closest("a,button,.check"))){activeId=card.dataset.id;setFicheCollapsed(false);history.replaceState(null,"","#fiche="+activeId);renderAll();return}if(e.target.id==="copyActive"){copy(itemMarkdown(activeItem())).then(()=>toast("Fiche active copiee"));return}if(e.target.id==="selectActive"){const id=activeItem().id;selected.has(id)?selected.delete(id):selected.add(id);renderAll();return}});
