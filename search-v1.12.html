gents IA","concepts":[{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"capability.documents","label":"Documents","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"capability.automation","label":"Automation","parent":"capability"},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-awesome-free-llm-apis-md","title":"Awesome Free LLM APIs","canonical":"","type":"Veille outils IA / ressources API LLM gratuites.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#llm","#api","#free-tier","#providers","#inference","#openai-compatible","#ai-tools","#sensitive"],"status":"sensible","path":"watch/awesome-free-llm-apis.md","github":"https://github.com/mnfst/awesome-free-llm-apis","summary":"Liste de fournisseurs LLM avec tiers gratuits permanents ou credits gratuits. Le README indique que les endpoints sont majoritairement compatibles avec le SDK OpenAI, sauf mention contraire, et pointe vers les pages de creation de cles API. Exemples visibles au moment de la lecture : - AI21 Labs - Aion Labs - Alibaba Cloud Model Studio - Cohere - DeepSeek - Google Gemini - Mistral AI - xAI - Z AI - Cerebras - Cloudflare Workers AI - GitHub Models - Groq - Hugging Face - Kilo Code","relations":[],"raw":"# Awesome Free LLM APIs\n\n## Type\n\nVeille outils IA / ressources API LLM gratuites.\n\n## Tags\n\n#llm, #api, #free-tier, #providers, #inference, #openai-compatible, #ai-tools, #sensitive\n\n## Sources\n\n- Repo : `https://github.com/mnfst/awesome-free-llm-apis`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `mnfst/awesome-free-llm-apis`\n- description : list of permanent free LLM API keys\n- stars lus : 4477\n- forks lus : 430\n- licence : CC0-1.0\n- archived : false\n- dernier push lu : 2026-05-22\n\n## Resume court\n\nListe de fournisseurs LLM avec tiers gratuits permanents ou credits gratuits. Le README indique que les endpoints sont majoritairement compatibles avec le SDK OpenAI, sauf mention contraire, et pointe vers les pages de creation de cles API.\n\nExemples visibles au moment de la lecture :\n\n- AI21 Labs\n- Aion Labs\n- Alibaba Cloud Model Studio\n- Cohere\n- DeepSeek\n- Google Gemini\n- Mistral AI\n- xAI\n- Z AI\n- Cerebras\n- Cloudflare Workers AI\n- GitHub Models\n- Groq\n- Hugging Face\n- Kilo Code\n\n## Usage utile\n\n- Comparer providers LLM gratuits ou trial.\n- Identifier les bases URL OpenAI-compatible.\n- Prototyper sans exposer une cle principale.\n- Alimenter un routeur LLM interne avec limites documentees.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Abuse quotas | creation de comptes ou automatisation pour contourner les limites | sensible ; #ROUGE si abus organise |\n| Donnees sensibles | envoi de secrets, prompts prives ou donnees personnelles a des providers tiers | sensible |\n| Terms mismatch | usage commercial ou production alors que le free tier l'interdit | sensible |\n| Provider volatile | limites, regions, prix et politiques data peuvent changer vite | sensible |\n| Key leakage | cles API copiees dans repo, logs ou prompts | sensible critique |\n\n## Garde-fous\n\n- Verifier chaque provider a la source officielle avant usage.\n- Ne jamais stocker de cle API en clair.\n- Documenter region, limite, cout reel, politique data et usage autorise.\n- Ne pas contourner quotas, paywalls ou conditions commerciales.\n- Preferer comptes/projets separes pour prototypes.\n- Ne pas envoyer de donnees personnelles ou confidentielles a un provider gratuit non audite.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.ai.llm","label":"LLM / Providers","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"lifecycle.inbox","label":"Inbox / veille","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"}]},{"id":"watch-ccgui-mossx-vibecoding-editor-md","title":"CC-GUI / MossX - VibeCoding Editor","canonical":"","type":"Veille outils IA / editeur vibe coding multi-engine.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#vibe-coding","#ai-editor","#developer-tools","#claude-code","#codex","#opencode","#gemini","#multi-engine","#sensitive","#to-verify"],"status":"a verifier","path":"watch/ccgui-mossx-vibecoding-editor.md","github":"","summary":"CC-GUI / MossX est presente comme un editeur/portail vibe coding open source multi-engine, proche d'une alternative Cursor. La page Vibe Shit cite Claude Code, Codex, OpenCode et Gemini, avec panels developpeur : chat canvas, terminal, gestion Git, kanban et memoire IA.","relations":[],"raw":"# CC-GUI / MossX - VibeCoding Editor\n\n## Type\n\nVeille outils IA / editeur vibe coding multi-engine.\n\n## Tags\n\n#vibe-coding, #ai-editor, #developer-tools, #claude-code, #codex, #opencode, #gemini, #multi-engine, #sensitive, #to-verify\n\n## Sources\n\n- Page Vibe Shit : `https://vibeshit.org/product/ccgui`\n- Site associe : `https://www.mossx.ai/`\n\nLecture : 2026-05-22\n\n## Statut verification\n\n`a verifier`\n\nLa page Vibe Shit annonce un lien GitHub et un auteur `zhukunpenglinyutong`, mais le repo visible n'a pas ete confirme via GitHub API au moment de la verification. Le site MossX est lisible et presente un portail vibe coding open source avec support Claude Code, Codex, Cursor/VSCode, AI workflows, MCP Market et Skills Market.\n\n## Resume court\n\nCC-GUI / MossX est presente comme un editeur/portail vibe coding open source multi-engine, proche d'une alternative Cursor. La page Vibe Shit cite Claude Code, Codex, OpenCode et Gemini, avec panels developpeur : chat canvas, terminal, gestion Git, kanban et memoire IA.\n\n## Usage utile\n\n- Comparer les interfaces AI coding : Cursor, Claude Code GUI, Codex, OpenCode, Gemini.\n- Surveiller les patterns UI pour agents de code : terminal, git, kanban, memoire, workflows.\n- Identifier les risques d'integration multi-provider et multi-agent dans un IDE.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Code disclosure | envoyer code prive ou prompts sensibles a des providers non verifies | sensible |\n| Key leakage | stocker cles API / tokens dans config, logs ou plugins | sensible critique |\n| Tool execution | laisser un agent modifier fichiers, git ou terminal sans validation | sensible |\n| Supply chain | installer plugins, MCP ou skills non audites | sensible |\n| False authority | UI professionnelle pouvant masquer des claims non verifies | sensible |\n\n## Garde-fous\n\n- Verifier repo, licence, permissions et modele de securite avant usage.\n- Ne pas ouvrir de repo sensible dans un editeur non audite.\n- Ne pas stocker secrets en clair dans l'outil.\n- Desactiver execution terminal/git automatique sans validation humaine.\n- Tester uniquement sur repo sandbox avant integration.\n- Auditer MCP, skills et plugins ajoutes.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"risk.verify","label":"A verifier","parent":"risk"},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"}]},{"id":"watch-codepatrol-code-security-md","title":"CodePatrol - Code Security Watch","canonical":"","type":"Veille outils dev/security / code review et SAST.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#code-security","#sast","#code-review","#vulnerability-scanning","#appsec","#devtools","#sensitive","#to-verify"],"status":"a verifier","path":"watch/codepatrol-code-security.md","github":"","summary":"CodePatrol semble designer une famille/outillage de code security : revue automatisee, SAST, scan de vulnerabilites, alerting et consolidation de resultats. L'URL exacte fournie doit etre re-verifiee avant integration technique ou recommandation.","relations":[],"raw":"# CodePatrol - Code Security Watch\n\n## Type\n\nVeille outils dev/security / code review et SAST.\n\n## Tags\n\n#code-security, #sast, #code-review, #vulnerability-scanning, #appsec, #devtools, #sensitive, #to-verify\n\n## Sources\n\n- URL fournie : `https://codepatrol-2.polsia.app/`\n- Source secondaire trouvee : `https://sourceforge.net/software/product/CodePatrol/`\n\nLecture : 2026-05-22\n\n## Statut verification\n\n`a verifier`\n\nL'URL fournie n'a pas donne de contenu exploitable dans la lecture actuelle. Les resultats publics associent le nom CodePatrol a un outil de revue de code automatisee orientee securite, SAST, scan de vulnerabilites et agregation de resultats.\n\n## Resume court\n\nCodePatrol semble designer une famille/outillage de code security : revue automatisee, SAST, scan de vulnerabilites, alerting et consolidation de resultats. L'URL exacte fournie doit etre re-verifiee avant integration technique ou recommandation.\n\n## Usage utile\n\n- Surveiller les outils SAST et code review securite.\n- Comparer avec CodeQL, Semgrep, Checkmarx, Veracode, Codacy ou plateformes AI-native AppSec.\n- Inspirer un flux KM de verification de projets : secrets, vulnerabilites, dependances, IaC, qualite code.\n- Relier aux guardrails agents avant execution ou publication de code.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Upload code prive | envoyer un repo sensible vers un SaaS non verifie | sensible critique |\n| Secrets exposure | scan d'un repo contenant tokens, credentials ou donnees client | sensible critique |\n| False confidence | croire qu'un scan SAST remplace audit humain ou tests dynamiques | sensible |\n| Supply chain | installer un outil ou plugin non verifie dans CI/CD | sensible |\n\n## Garde-fous\n\n- Ne pas connecter de repo prive avant verification du fournisseur, des conditions et du traitement des donnees.\n- Scanner localement ou sur repo test quand possible.\n- Ne jamais uploader secrets, `.env`, dumps, logs ou donnees personnelles.\n- Verifier provenance, integrations, permissions GitHub/GitLab et politique de retention.\n- Traiter les resultats comme signal, pas comme preuve absolue.","integratedAt":"2026-05-22","theme":"dev","themeLabel":"Dev tools","concepts":[{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"risk.verify","label":"A verifier","parent":"risk"}]},{"id":"watch-free-llm-api-resources-md","title":"Free LLM API Resources","canonical":"","type":"Veille outils IA / ressources API.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#llm","#api","#free-tier","#inference","#providers","#ai-tools","#sensitive"],"status":"sensible","path":"watch/free-llm-api-resources.md","github":"https://github.com/cheahjs/free-llm-api-resources","summary":"Liste maintenue de fournisseurs donnant un acces gratuit ou des credits d'essai pour inference LLM via API. Le README precise : - ne pas abuser des services ; - les services non legitimes, par exemple reverse-engineering de chatbots existants, sont explicitement exclus.","relations":[],"raw":"# Free LLM API Resources\n\n## Type\n\nVeille outils IA / ressources API.\n\n## Tags\n\n#llm, #api, #free-tier, #inference, #providers, #ai-tools, #sensitive\n\n## Source\n\nRepo : `https://github.com/cheahjs/free-llm-api-resources`\n\nAuteur repo : `cheahjs`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `cheahjs/free-llm-api-resources`\n- description : list of free LLM inference resources accessible via API\n- stars lus : 22013\n- forks lus : 2246\n- licence : NOASSERTION\n- archived : false\n- dernier push lu : 2026-05-22\n\n## Resume court\n\nListe maintenue de fournisseurs donnant un acces gratuit ou des credits d'essai pour inference LLM via API.\n\nLe README precise :\n\n- ne pas abuser des services ;\n- les services non legitimes, par exemple reverse-engineering de chatbots existants, sont explicitement exclus.\n\n## Fournisseurs principaux cites\n\n### Free providers\n\n- OpenRouter\n- Google AI Studio\n- NVIDIA NIM\n- Mistral La Plateforme\n- Mistral Codestral\n- HuggingFace Inference Providers\n- Vercel AI Gateway\n- OpenCode Zen\n- Cerebras\n- Groq\n- Cohere\n- GitHub Models\n- Cloudflare Workers AI\n\n### Providers avec credits d'essai\n\n- Fireworks\n- Baseten\n- Nebius\n- Novita\n- AI21\n- Upstage\n- NLP Cloud\n- Alibaba Cloud Model Studio\n- Modal\n- Inference.net\n- Hyperbolic\n- SambaNova Cloud\n- Scaleway Generative APIs\n\n## Usage utile\n\n- Comparer les fournisseurs LLM gratuits ou trial.\n- Prototyper sans exposer de cle principale.\n- Identifier des alternatives temporaires pour tests.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Abuse quotas | multiplier comptes/requetes pour contourner les limites | sensible ; #ROUGE si automatisation abusive |\n| Fuite donnees | envoyer secrets, donnees privees ou prompts sensibles a des providers gratuits | sensible |\n| Terms bypass | utiliser des routes gratuites pour contourner conditions commerciales | sensible |\n| Non legitimate providers | utiliser services reverse-engineeres ou non autorises | #ROUGE |\n\n## Garde-fous\n\n- Respecter limites et conditions de chaque fournisseur.\n- Ne pas envoyer secrets, tokens, donnees personnelles ou prompts confidentiels.\n- Verifier la politique d'entrainement des donnees.\n- Ne pas automatiser de contournement de quotas.\n- Preferer fournisseurs officiels et documentes.\n- Documenter provider, modele, limites, usage et cout reel avant integration.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.ai.llm","label":"LLM / Providers","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"lifecycle.inbox","label":"Inbox / veille","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"}]},{"id":"watch-inspiration-competitors-tools-watch-md","title":"Inspiration Competitors Tools Watch","canonical":"","type":"Veille inspirations / concurrents / outils.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#inspiration","#competitors","#tools","#product-watch","#social-planning","#nightintel","#privacy"],"status":"sensible","path":"watch/inspiration-competitors-tools-watch.md","github":"","summary":"Centraliser les sites inspirants, concurrents, references produit et outils potentiellement utiles aux projets. Objectif : veiller sans copier. Extraire les patterns utiles, les risques, les garde-fous et les opportunites d'integration.","relations":[],"raw":"# Inspiration Competitors Tools Watch\n\n## Type\n\nVeille inspirations / concurrents / outils.\n\n## Tags\n\n## Role\n\nCentraliser les sites inspirants, concurrents, references produit et outils potentiellement utiles aux projets.\n\nObjectif : veiller sans copier. Extraire les patterns utiles, les risques, les garde-fous et les opportunites d'integration.\n\n## Regles\n\n- Distinguer : inspiration, concurrent, outil utilisable, source technique.\n- Ajouter l'URL, la date de lecture, le role, les projets lies, les risques.\n- Ne pas copier l'identite visuelle ou le wording d'un concurrent.\n- Identifier l'usage abusif possible quand l'outil touche social, data, OSINT, IA, tracking ou automation.\n- Classer `#ROUGE` si l'outil peut servir a surveillance, scraping abusif, contournement, manipulation ou fuite de donnees.\n\n## Index veille\n\n| Nom | URL | Type | Projets lies | Usage utile | Risques | Statut |\n| --- | --- | --- | --- | --- | --- | --- |\n| Orbit | `https://weorbit.org/` | inspiration / concurrent social planning | NightLife, NightCrawl, Annecy Intel | coordination sorties, cercles, RSVP, nudges doux, privacy calendar | pression sociale, sur-notification, tracking relationnel | a suivre |\n\n## Fiche courte - Orbit\n\n### Resume\n\nOrbit aide des groupes d'amis a trouver des disponibilites communes via calendrier, cercles, nudges et RSVP.\n\n### Patterns utiles\n\n- Disponibilite calendrier sans partager les titres d'evenements.\n- Cercles sociaux par groupe/vibe.\n- Nudges automatiques mais limites.\n- RSVP simple.\n- Ton ludique sans culpabilisation.\n\n### Liens projets\n\n- NightLife : organiser sorties, groupes, RSVP, opt-in calendrier.\n- NightCrawl : cercles de veille / transmissions de groupe.\n- Annecy Intel : coordination locale et sorties.\n\n### Garde-fous\n\n- Geoloc/calendrier toujours opt-in.\n- Pas de score de popularite sociale.\n- Pas de penalite si refus ou absence.\n- Cadence de nudges explicite et configurable.\n- Pas de partage des titres d'evenements.\n\n### Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Tracking relationnel | mesurer qui voit qui et a quelle frequence | sensible |\n| Pression sociale | relancer trop souvent les personnes moins presentes | sensible |\n| Profilage social | inferer habitudes, groupes ou disponibilites | sensible ; #ROUGE si ciblage/stalking non consenti |\n\n## Fiche courte - Oh My Pizza!\n\n### Resume\n\nBlog personnel de Scott Yoshinaga avec archives, updates, posts culturels et notes pratiques. Source deja utile via l'article sur Twitter/X via RSS.\n\n### Patterns utiles\n\n- Curation personnelle claire.\n- Articles longs avec liens sortants.\n- Archive simple.\n- Melange culture, apps, musique et petites trouvailles web.\n- Bon modele de source de veille humaine, non algorithmique.\n\n### Liens projets\n\n- KM : source de veille et methode de curation.\n- Inspiration contenu : formats listes, favoris annuels, liens outils.\n\n### Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Surinterpretation | traiter un blog personnel comme source officielle | faible |\n| Copie de contenu | reprendre la curation ou le texte sans attribution | sensible |\n| Tracking culturel individuel | profiler les gouts d'une personne a partir de ses archives | sensible ; #ROUGE si harcelement/ciblage non consenti |\n\n### Garde-fous\n\n- Citer comme source personnelle.\n- Ne pas copier le wording ou les listes entieres.\n- Extraire des patterns et liens, pas l'identite personnelle.\n- Verifier les outils cites via sources primaires.\n\n## Prochaines actions\n\n1. Ajouter les prochaines references inspirantes dans ce fichier.\n2. Creer une fiche dediee seulement si une reference devient structurante.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"lifecycle.inbox","label":"Inbox / veille","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"domain.privacy","label":"Privacy","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"}]},{"id":"watch-nanoclaw-personal-agent-md","title":"NanoClaw - Personal AI Agent","canonical":"","type":"Veille outils IA / agent personnel multi-canaux.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#ai-agent","#personal-agent","#messaging","#containers","#claude-agent-sdk","#credential-vault","#local-first","#automation","#sensitive"],"status":"sensible","path":"watch/nanoclaw-personal-agent.md","github":"https://github.com/nanocoai/nanoclaw","summary":"NanoClaw est un agent IA personnel open source, leger et personnalisable. Il connecte un agent a des canaux de messagerie comme WhatsApp, Telegram, Slack, Discord, Microsoft Teams, Matrix, GitHub, Linear, email et autres. Le projet met en avant une architecture simple : un host Node, des conteneurs par groupe d'agents, deux bases SQLite par session, des skills installables a la demande et une isolation des credentials via Agent Vault.","relations":[],"raw":"# NanoClaw - Personal AI Agent\n\n## Type\n\nVeille outils IA / agent personnel multi-canaux.\n\n## Tags\n\n#ai-agent, #personal-agent, #messaging, #containers, #claude-agent-sdk, #credential-vault, #local-first, #automation, #sensitive\n\n## Sources\n\n- Page Vibe Shit : `https://vibeshit.org/product/nanoclaw`\n- Site : `https://nanoclaw.dev/`\n- Site FR : `https://nanoclaw.dev/fr/`\n- Repo : `https://github.com/nanocoai/nanoclaw`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `nanocoai/nanoclaw`\n- description : lightweight alternative to OpenClaw running in containers, with messaging apps, memory and scheduled jobs\n- stars lus : 29269\n- forks lus : 12855\n- licence : MIT\n- archived : false\n- dernier push lu : 2026-05-20\n\n## Resume court\n\nNanoClaw est un agent IA personnel open source, leger et personnalisable. Il connecte un agent a des canaux de messagerie comme WhatsApp, Telegram, Slack, Discord, Microsoft Teams, Matrix, GitHub, Linear, email et autres.\n\nLe projet met en avant une architecture simple : un host Node, des conteneurs par groupe d'agents, deux bases SQLite par session, des skills installables a la demande et une isolation des credentials via Agent Vault.\n\n## Usage utile\n\n- Construire un assistant personnel message-first.\n- Tester des agents par canal avec isolation forte.\n- Relier messagerie, jobs planifies, memoire et providers IA.\n- Etudier une architecture agent simple, auditable et containerisee.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Automation messaging | envoi de messages automatises non consentis ou spam multi-canaux | sensible ; #ROUGE si spam/phishing |\n| Credential routing | mauvaise configuration du vault ou exposition de providers | sensible |\n| Workspace mounts | montage de dossiers contenant secrets ou donnees personnelles | sensible |\n| Agent impersonation | bot qui parle comme une personne sans signalement clair | sensible |\n| Scheduled tasks | jobs recurrents pouvant surveiller ou contacter sans opt-in | sensible ; #ROUGE si surveillance abusive |\n\n## Garde-fous\n\n- Usage opt-in sur chaque canal de messagerie.\n- Aucun secret en clair dans repo, logs ou sessions.\n- Monter seulement les dossiers necessaires dans les conteneurs.\n- Distinguer clairement agent, humain et automatisation.\n- Desactiver tout broadcast, scraping ou contact massif non sollicite.\n- Auditer chaque skill installe avant usage.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.privacy","label":"Privacy","parent":"domain"},{"id":"capability.automation","label":"Automation","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-open-source-saas-alternatives-nicos-ai-md","title":"Open Source SaaS Alternatives - nicos_ai","canonical":"","type":"Veille outils open source.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#open-source","#saas-alternatives","#ai-tools","#design","#automation","#local-first","#sensitive"],"status":"sensible","path":"watch/open-source-saas-alternatives-nicos-ai.md","github":"https://github.com/yt-dlp/yt-dlp","summary":"Le post liste 10 repos open source presentes comme alternatives a des outils SaaS ou services payants : video download, IA locale, image generation, design, workspace, automation, scheduling et password manager.","relations":[],"raw":"# Open Source SaaS Alternatives - nicos_ai\n\n## Type\n\nVeille outils open source.\n\n## Tags\n\n#open-source, #saas-alternatives, #ai-tools, #design, #automation, #local-first, #sensitive\n\n## Source\n\nPost X public fourni le 2026-05-22.\n\nURL : `https://x.com/nicos_ai/status/2057511065802469432`\n\nAuteur : `nicos_ai` / Nico\n\nDate post : 2026-05-21\n\nLecture : FxTwitter API publique, sans compte X.\n\n## Resume court\n\nLe post liste 10 repos open source presentes comme alternatives a des outils SaaS ou services payants : video download, IA locale, image generation, design, workspace, automation, scheduling et password manager.\n\n## Outils cites\n\n| Outil | URL verifiee | Statut | Classement |\n| --- | --- | --- | --- |\n| yt-dlp | `https://github.com/yt-dlp/yt-dlp` | verifie GitHub | sensible |\n| Ollama | `https://github.com/ollama/ollama` | verifie GitHub | interne |\n| Fooocus | `https://github.com/lllyasviel/Fooocus` | verifie GitHub | sensible |\n| PhotoGIMP | `https://github.com/Diolinux/PhotoGIMP` | verifie GitHub | interne |\n| Open Design | `https://github.com/nexu-io/open-design` | verifie GitHub | interne |\n| AppFlowy | `https://github.com/AppFlowy-IO/AppFlowy` | deja verifie | interne |\n| Penpot | `https://github.com/penpot/penpot` | deja verifie | interne |\n| n8n | `https://github.com/n8n-io/n8n` | deja verifie | sensible ; #ROUGE si exfiltration/spam |\n| Cal | `https://github.com/calcom/cal.diy` | deja verifie, ancien lien redirige | interne |\n| Bitwarden Server | `https://github.com/bitwarden/server` | verifie GitHub | interne critique |\n\n## Nouveaux outils ajoutes a l'inventaire\n\n- `yt-dlp`\n- `Ollama`\n- `Fooocus`\n- `PhotoGIMP`\n- `Open Design`\n- `Bitwarden Server`\n\n## Deduplication\n\nDeja presents dans KM :\n\n- `AppFlowy`\n- `Penpot`\n- `n8n`\n- `Cal.com`\n\n## Usage abusif possible\n\n| Outil | Usage utile | Usage abusif possible | Classement |\n| --- | --- | --- | --- |\n| yt-dlp | archivage legitime, recuperation de ses propres contenus, veille media | telechargement non autorise, violation copyright, contournement plateformes | sensible |\n| Ollama | IA locale privacy-first | execution de modeles non controles, fuite via prompts si mal gere | interne |\n| Fooocus | generation image locale | images trompeuses, usurpation visuelle | sensible |\n| PhotoGIMP | workflow design local | confusion marque/interface si redistribution commerciale trompeuse | interne |\n| Open Design | generation UI/design | copie de designs, confusion avec outils proprietaires | interne |\n| n8n | automation | spam, scraping, exfiltration si connecteurs sensibles | sensible ; #ROUGE si abus operationnel |\n| Bitwarden Server | gestion secrets | mauvaise configuration exposant secrets | interne critique |\n\n## Garde-fous\n\n- Ne pas promouvoir yt-dlp pour contourner droits d'auteur ou restrictions.\n- Verifier licences et conditions des plateformes avant usage media.\n- IA locale : ne pas stocker secrets dans prompts ou historiques.\n- Automation : validation humaine obligatoire avant actions externes.\n- Secrets : aucun token en clair dans repo.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","parent":null},{"id":"lifecycle.inbox","label":"Inbox / veille","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"domain.media","label":"Media / Design","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"capability.automation","label":"Automation","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"domain.privacy","label":"Privacy","parent":"domain"},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"}]},{"id":"watch-osint-tools-watch-md","title":"OSINT Tools Watch","canonical":"","type":"Veille OSINT transversale.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#osint","#vehicle-search","#vin","#license-plate","#threat-intelligence","#privacy-sensitive"],"status":"a verifier","path":"watch/osint-tools-watch.md","github":"https://github.com/edoardottt/awesome-hacker-search-engines","summary":"Le post reference une section \"Vehicle Search Tools\" du repo GitHub awesome-hacker-search-engines, avec des outils de recherche de plaques, VIN et historiques de vehicules. Source citee par le post : https://github.com/edoardottt/awesome-hacker-search-engines#vehicle Verification : - Repo verifie via GitHub API : https://github.com/edoardottt/awesome-hacker-search-engines - Statut : accessible. - Licence GitHub : MIT. - Garde-fou : ne pas extraire ni stocker de donnees personnelles vehicules dans KM.","relations":[],"raw":"# OSINT Tools Watch\n\n## Type\n\nVeille OSINT transversale.\n\n## Tags\n\n#osint, #vehicle-search, #vin, #license-plate, #threat-intelligence, #privacy-sensitive\n\n## Source\n\nPost X public fourni le 2026-05-22.\n\nLecture effectuee via FxTwitter API publique, sans compte X.\n\n## Resume court\n\nLe post reference une section \"Vehicle Search Tools\" du repo GitHub `awesome-hacker-search-engines`, avec des outils de recherche de plaques, VIN et historiques de vehicules.\n\nSource citee par le post :\n`https://github.com/edoardottt/awesome-hacker-search-engines#vehicle`\n\nVerification :\n\n- Repo verifie via GitHub API : `https://github.com/edoardottt/awesome-hacker-search-engines`\n- Statut : accessible.\n- Licence GitHub : MIT.\n- Garde-fou : ne pas extraire ni stocker de donnees personnelles vehicules dans KM.\n\n## Sources lues\n\n| Date post | Auteur | URL | Sujet | Statut |\n| --- | --- | --- | --- | --- |\n| 2026-05-21 | `cyb_detective` | `https://x.com/cyb_detective/status/2057462395568558157` | Vehicle Search Tools : license plate search, VIN check, vehicle history records | sensible |\n\n## Arbitrage\n\n| Element | Decision | Raison |\n| --- | --- | --- |\n| Vehicle search OSINT | garder avec prudence | utile pour veille OSINT, mais donnees potentiellement personnelles |\n| Plaques / VIN / historique vehicule | a cadrer | risque privacy, stalking, doxxing, usage abusif |\n| Repo awesome-hacker-search-engines | garder comme source | index public, a verifier avant utilisation |\n\n## Garde-fous\n\n- Usage uniquement defensif, recherche legitime, audit, investigation autorisee ou apprentissage.\n- Pas de doxxing, stalking, surveillance abusive ou identification de particuliers sans base legitime.\n- Ne pas stocker plaques, VIN, noms, adresses ou resultats personnels dans KM.\n- Verifier legalite locale avant usage de tout outil lie aux vehicules.\n\n## Risques\n\n- Outils externes variables.\n- Donnees vehicules possiblement personnelles.\n- Resultats pouvant etre faux, obsoletes ou hors cadre legal selon pays.\n\n## Prochaines actions\n\n1. Verifier le repo GitHub source avant integration.\n2. Extraire uniquement les categories utiles et licites.\n3. Creer une fiche dediee si un outil devient actionnable.","integratedAt":"2026-05-22","theme":"osint","themeLabel":"OSINT","concepts":[{"id":"domain.osint","label":"OSINT","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-pentestgpt-autonomous-pentest-md","title":"PentestGPT - Autonomous Penetration Testing","canonical":"","type":"Veille #ROUGE / outil IA de pentest autonome.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#pentest","#red-team","#autonomous-agent","#exploitation","#recon","#privilege-escalation","#llm-security","#offensive-risk"],"status":"#ROUGE","path":"watch/pentestgpt-autonomous-pentest.md","github":"https://github.com/GreyDGL/PentestGPT","summary":"PentestGPT est un framework agentique de penetration testing automatise par LLM. La page officielle met en avant une pipeline autonome de reconnaissance, analyse de vulnerabilites, exploitation, privilege escalation, session persistence et environnement Docker avec outils de securite.","relations":[],"raw":"# PentestGPT - Autonomous Penetration Testing\n\n## Type\n\nVeille `#ROUGE` / outil IA de pentest autonome.\n\n## Tags\n\n#rouge, #pentest, #red-team, #autonomous-agent, #exploitation, #recon, #privilege-escalation, #llm-security, #offensive-risk\n\n## Sources\n\n- Page Vibe Shit : `https://vibeshit.org/product/pentestgpt`\n- Site officiel : `https://pentestgpt.com/`\n- Repo : `https://github.com/GreyDGL/PentestGPT`\n- Papier : `PentestGPT: Evaluating and Harnessing Large Language Models for Automated Penetration Testing`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `GreyDGL/PentestGPT`\n- description : automated penetration testing agentic framework powered by large language models\n- stars lus : 13240\n- forks lus : 2274\n- licence : MIT\n- archived : false\n- dernier push lu : 2026-02-23\n\n## Resume court\n\nPentestGPT est un framework agentique de penetration testing automatise par LLM. La page officielle met en avant une pipeline autonome de reconnaissance, analyse de vulnerabilites, exploitation, privilege escalation, session persistence et environnement Docker avec outils de securite.\n\n## Classification\n\n`#ROUGE`\n\nRaison : l'outil facilite directement des actions offensives operationnelles : reconnaissance, exploitation, post-exploitation et automatisation d'attack chains. A connaitre pour defense, audit, threat intelligence et comprehension du paysage, mais pas a diffuser comme guide d'usage.\n\n## Usage defensif legitime\n\n- Laboratoire interne, CTF, HackTheBox ou environnement explicitement autorise.\n- Evaluation defensive d'agents de pentest autonomes.\n- Etude des risques d'automatisation offensive par LLM.\n- Benchmark de garde-fous, detection, journalisation et containment.\n- Formation securite uniquement dans un cadre autorise et supervise.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Recon non autorisee | scan ou enumeration de cibles tierces | #ROUGE |\n| Exploitation | selection et execution de techniques d'exploitation | #ROUGE |\n| Privilege escalation | recherche de chemins d'elevation sur systemes compromis | #ROUGE |\n| Lateral movement | chainage d'actions apres acces initial | #ROUGE |\n| Abaissement de barriere | aide a des profils non qualifies pour conduire des attaques | #ROUGE |\n\n## Garde-fous\n\n- Ne pas fournir de commandes, payloads, procedures ou chaines d'exploitation.\n- Ne pas tester sur cible externe sans autorisation ecrite.\n- Ne pas connecter a des credentials, VPN, clouds ou reseaux reels sans cadrage.\n- Executer uniquement en lab isole si test local.\n- Journaliser objectif, perimetre, autorisation, cible, duree et responsable.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"risk.offensive","label":"Offensif / #ROUGE","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.osint","label":"OSINT","parent":"domain"}]},{"id":"watch-red-team-risk-tools-watch-md","title":"Red Team Risk Tools Watch","canonical":"","type":"Veille outils sensibles #ROUGE.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#dual-use","#offensive-risk","#osint","#anti-detection","#privacy","#threat-intelligence"],"status":"#ROUGE","path":"watch/red-team-risk-tools-watch.md","github":"","summary":"Centraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger. #ROUGE signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.","relations":[],"raw":"# Red Team Risk Tools Watch\n\n## Type\n\nVeille outils sensibles `#ROUGE`.\n\n## Tags\n\n#rouge, #dual-use, #offensive-risk, #osint, #anti-detection, #privacy, #threat-intelligence\n\n## Role\n\nCentraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger.\n\n`#ROUGE` signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.\n\n## Regles #ROUGE\n\n- Recuperer les outils offensifs au lieu de les ignorer.\n- Les classer clairement `#ROUGE`.\n- Distinguer usage legitime defensif et usage abusif.\n- Ne pas fournir de mode d'emploi offensif.\n- Ne pas fournir de payload, procedure d'exploitation, contournement, ciblage ou automatisation abusive.\n- Ne pas stocker de donnees personnelles extraites par ces outils.\n- Ne pas integrer dans un projet sans cadrage explicite.\n\n## Outils / familles classes #ROUGE\n\nCritere strict : `#ROUGE` uniquement si l'outil facilite directement un usage offensif, furtif, intrusif ou d'abus a grande echelle.\n\n| Outil / famille | Usage defensif legitime | Usage abusif possible | Diffusion |\n| --- | --- | --- | --- |\n| Camofox Browser | tester detection bot sur ses propres services | contournement anti-bot, scraping furtif, fraude plateformes | #ROUGE non public |\n| Vehicle Search Tools | investigation autorisee, verification defensive | doxxing, stalking, identification de particuliers via plaques/VIN | #ROUGE non public |\n| Image OSINT tools | verification source image, threat intel, fact-checking | geolocalisation abusive, identification non consentie | #ROUGE non public |\n| Playwright MCP | tests QA, accessibilite, verification UI | automatisation d'actions non autorisees, scraping abusif | #ROUGE si cible externe |\n| n8n | automatisation interne | spam, exfiltration, scraping automatise | #ROUGE si connecteurs sensibles |\n| FreeLLMAPI / ARGO / LibreChat | self-host, privacy, experimentation controlee | fuite secrets, contournement conditions, agent non supervise | #ROUGE si secrets/comptes tiers |\n| PentestGPT | lab autorise, CTF, evaluation defensive d'agents de pentest | reconnaissance, exploitation, post-exploitation et privilege escalation non autorisees | #ROUGE non public |\n| PromptSpy / AI Android malware | threat intelligence, sensibilisation mobile, detection defensive | malware adaptatif, spyware Android, persistance et evasion mobile | #ROUGE non public |\n| CyberStrike | lab autorise, evaluation defensive d'agents de red team IA | automatisation de reconnaissance, pentest et chainage offensif | #ROUGE non public |\n| MalwareSourceCode | reverse engineering et detection en environnement isole | reutilisation, adaptation ou diffusion de code malware | #ROUGE non public |\n| GoSearch digital footprint | audit de sa propre exposition publique, sensibilisation privacy | doxxing, stalking, correlation de comptes et collecte de donnees personnelles | #ROUGE non public |\n| GhostTrack | audit de sa propre exposition publique, sensibilisation privacy | doxxing, stalking, correlation telephone/username/IP | #ROUGE non public |\n| Reverse Skill / hacker skills | threat intelligence, lab autorise, audit de skills agents | reverse non autorise, automatisation de taches offensives par agent | #ROUGE non public |\n| Serus dark web leak search | audit de ses propres comptes ou domaine autorise | recherche de donnees compromises, doxxing, credential abuse | #ROUGE non public |\n| IG-Detective Instagram OSINT | investigation autorisee et sensibilisation privacy | enumeration de contacts, geolocalisation, contournement et ciblage de profils | #ROUGE non public |\n| Aliens_eye AI OSINT | audit de sa propre exposition publique, veille privacy autorisee | correlation de comptes, doxxing, stalking et ciblage de personnes | #ROUGE non public |\n| Pentagi autonomous pentest agents | evaluation en lab isole et autorise, threat intelligence defensive | reconnaissance, exploitation et chainage de penetration testing non autorises | #ROUGE non public |\n\n## Sensible mais pas #ROUGE par defaut\n\n| Outil / famille | Pourquoi sensible | Classement |\n| --- | --- | --- |\n| Voicebox / Pipecat / Whisper | voix, transcription, consentement | sensible |\n| ViMax / OpenShorts / Hyperframes | generation media, risque deepfake selon contenu | sensible |\n| Agentic Inbox | email, validation humaine requise | sensible |\n| Claude Ads | manipulation publicitaire possible selon usage | sensible |\n| AutoHedge / Vibe-Trading / Fincept Terminal | risque financier | sensible finance |\n| Twitter RSS / Nitter / OpenRSS | veille publique pouvant deriver en surveillance | sensible |\n| Orbit / social planning | tracking relationnel possible si non consenti | sensible |\n\n## Garde-fous generaux\n\n- Usage uniquement autorise, defensif ou educatif.\n- Validation humaine obligatoire pour toute action externe.\n- Aucune diffusion publique de procedure offensive.\n- Aucune collecte de personnes privees.\n- Aucune execution sur cible tierce sans autorisation.\n- Journaliser les sources, pas les donnees sensibles.","integratedAt":"2026-05-22","theme":"osint","themeLabel":"OSINT","concepts":[{"id":"risk.offensive","label":"Offensif / #ROUGE","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.osint","label":"OSINT","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.privacy","label":"Privacy","parent":"domain"}]},{"id":"watch-twitter-rss-monitoring-md","title":"Twitter RSS Monitoring","canonical":"","type":"Veille process / source monitoring.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#rss","#twitter","#x","#monitoring","#nitter","#openrss","#social-watch","#privacy"],"status":"sensible","path":"watch/twitter-rss-monitoring.md","github":"https://github.com/zedeus/nitter","summary":"L'article explique comment suivre quelques comptes Twitter/X via RSS afin de reduire le temps passe sur le site Twitter. Deux services sont cites : Nitter et OpenRSS. L'approche permet de generer des flux RSS publics sans acces API Twitter.","relations":[],"raw":"# Twitter RSS Monitoring\n\n## Type\n\nVeille process / source monitoring.\n\n## Tags\n\n#rss, #twitter, #x, #monitoring, #nitter, #openrss, #social-watch, #privacy\n\n## Source\n\nArticle : `Keeping Up With Twitter Via RSS Feeds`\n\nURL : `https://ohmypizza.com/2023/04/keeping-up-with-twitter-via-rss`\n\nAuteur : Scott Yoshinaga\n\nDate source : 2023-04-20\n\nLecture KM : 2026-05-22\n\n## Resume court\n\nL'article explique comment suivre quelques comptes Twitter/X via RSS afin de reduire le temps passe sur le site Twitter. Deux services sont cites : Nitter et OpenRSS. L'approche permet de generer des flux RSS publics sans acces API Twitter.\n\n## Outils cites\n\n| Outil | URL | Usage | Statut |\n| --- | --- | --- | --- |\n| Nitter | `https://nitter.net/<username>` | consulter un compte Twitter via interface alternative et recuperer un RSS | verifie partiel 2026-05-22, service/instances instables |\n| OpenRSS | `https://openrss.org/twitter.com/<username>` | generer un flux RSS depuis un compte Twitter public | verifie source officielle 2026-05-22 |\n\n## Nitter - verification officielle\n\nSources :\n\n- Instance : `https://nitter.net/`\n- Repo : `https://github.com/zedeus/nitter`\n\nVerification 2026-05-22 :\n\n- `https://nitter.net/` repond, mais la page chargee est minimale.\n- Repo GitHub verifie via GitHub API : `zedeus/nitter`.\n- Licence GitHub : AGPL-3.0.\n- Repo non archive au moment de la verification.\n- Dernier push lu via GitHub API : 2026-04-16.\n\nNotes de contexte :\n\n- Nitter est un frontend alternatif Twitter/X centre privacy/performance.\n- Le projet a connu une forte instabilite apres les changements d'acces de Twitter/X.\n- Plusieurs sources publiques indiquent que les instances et le RSS peuvent etre instables ou desactives selon les periodes.\n- A utiliser comme source de veille opportuniste, pas comme infrastructure fiable de production.\n\n## OpenRSS - verification officielle\n\nSource officielle : `https://openrss.org/`\n\nGuides / conditions lues :\n\n- `https://openrss.org/guides/how-to-use-an-open-rss-feed`\n- `https://openrss.org/terms`\n\nPoints verifies :\n\n- Page racine relue le 2026-05-22 depuis le lot fourni.\n- OpenRSS permet d'ajouter `openrss.org/` devant une URL pour obtenir un flux RSS quand la page est supportee.\n- Le service annonce des flux sans algorithmes de recommandation.\n- Le service indique retirer certains scripts, tracking links et contenus invasifs des flux.\n- OpenRSS est presente comme organisation nonprofit 501(c)(3).\n- Usage annonce : personnel, informatif, non commercial.\n- Les conditions demandent de limiter la frequence des requetes.\n- Les conditions interdisent l'usage illegal, le contournement de restrictions, l'acces a du contenu payant, l'espionnage, le harcelement et le monitoring de contenu non public.\n\n## Usage utile\n\n- Veille sobre sur comptes publics.\n- Centraliser des sources X dans un lecteur RSS.\n- Reduire l'exposition a l'interface addictive de X.\n- Surveiller les comptes source utiles pour KM sans connexion directe a X.\n- Alimenter une veille manuelle non intrusive.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Surveillance abusive | suivre systematiquement une personne sans cadre legitime | #ROUGE si cible personne privee |\n| Scraping agressif | multiplier flux et requetes au-dela d'une veille raisonnable | sensible ; #ROUGE si automatisation furtive ou massive |\n| Contournement plateforme | utiliser des services alternatifs pour contourner limites/API sans respecter conditions | sensible |\n| Profilage | croiser flux publics pour profiler une personne ou un groupe | sensible ; #ROUGE si ciblage individuel non consenti |\n\n## Garde-fous\n\n- Utiliser uniquement des comptes publics et pertinents pour la veille.\n- Ne pas suivre de personnes privees sans raison legitime.\n- Ne pas stocker donnees personnelles issues de flux.\n- Ne pas automatiser a grande echelle.\n- Respecter les limites des services tiers et les conditions applicables.\n- Preferer la veille thematique aux listes nominatives.\n- Usage OpenRSS : personnel, non commercial, frequence raisonnable.\n- Ne pas redistribuer les flux OpenRSS dans une app publique ou payante sans verifier les conditions.\n- Usage Nitter : limiter a une veille manuelle ou faible frequence ; ne pas dependra d'instances publiques pour un produit.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.privacy","label":"Privacy","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"}]},{"id":"watch-vibeshit-vibe-coding-directory-md","title":"Vibe Shit - Vibe Coding Directory","ca function filteredItems(){const terms=queryTerms(), status=byId("statusFilter").value, folder=byId("folderFilter").value, theme=byId("themeFilter").value, concept=byId("conceptFilter").value, tag=norm(byId("tagFilter").value), sort=byId("sort").value;let rows=KM_INDEX.filter(item=>matchesQuery(item,terms)>0);rows=rows.filter(item=>topic==="Tous"||item.theme===topic);rows=rows.filter(item=>folder==="all"||item.folder===folder);rows=rows.filter(item=>theme==="all"||item.theme===theme);rows=rows.filter(item=>concept==="all"||item.concepts.some(c=>c.id===concept));rows=rows.filter(item=>status==="all"||item.status===status);rows=rows.filter(item=>!tag||norm(item.tags.join(" ")).includes(tag)||norm(item.type).includes(tag)||norm(item.theme).includes(tag)||norm(item.folderLabel).includes(tag)||norm(item.concepts.map(c=>c.label).join(" ")).includes(tag));rows.sort((a,b)=>sort==="title"?a.title.localeCompare(b.title):sort==="type"?a.theme.localeCompare(b.theme)||a.title.localeCompare(b.title):sort==="status"?statusRank(a.status)-statusRank(b.status)||a.title.localeCompare(b.title):dateRank(b)-dateRank(a)||a.title.localeCompare(b.title));return rows}

function markdown(md){const lines=String(md||"").split("\n");let out="", inList=false, inTable=false;const close=()=>{if(inList){out+="</ul>";inList=false}if(inTable){out+="</tbody></table>";inTable=false}};for(const line of lines){if(/^\|(.+)\|$/.test(line)&&!/^\|\s*-/.test(line)){if(!inTable){close();out+="<table><tbody>";inTable=true}out+="<tr>"+line.slice(1,-1).split("|").map(c=>"<td>"+inlineMd(c.trim())+"</td>").join("")+"</tr>";continue}if(/^\|\s*-/.test(line))continue;if(inTable&&!/^\|/.test(line))close();if(/^###\s+/.test(line)){close();out+="<h3>"+inlineMd(line.replace(/^###\s+/,""))+"</h3>";continue}if(/^##\s+/.test(line)){close();out+="<h2>"+inlineMd(line.replace(/^##\s+/,""))+"</h2>";continue}if(/^#\s+/.test(line)){close();out+="<h1>"+inlineMd(line.replace(/^#\s+/,""))+"</h1>";continue}if(/^[-*]\s+/.test(line)){if(!inList){close();out+="<ul>";inList=true}out+="<li>"+inlineMd(line.replace(/^[-*]\s+/,""))+"</li>";continue}if(!line.trim()){close();continue}close();out+="<p>"+inlineMd(line)+"</p>"}close();return out}

function cardHtml(item){const active=item.id===activeId, sel=selected.has(item.id);const tags=item.tags.filter(t=>norm(t)!=="#watch"&&norm(t)!=="watch"&&!sameTagTheme(t,item.theme)).slice(0,3);return '<article class="news-card '+(active?"active":"")+' '+(sel?"selected":"")+'" data-id="'+esc(item.id)+'"><div class="check" data-action="select" title="Selectionner"></div><div><div class="title-row"><h3 class="news-title" data-action="open">'+highlight(item.title)+'</h3></div><div class="meta">'+tagButton(item.status,statusClass(item.status))+tagButton(item.folderLabel,"tool")+tagButton("#"+item.theme,item.theme)+tags.map(t=>tagButton(t,themeOfTag(t,item.theme))).join("")+'</div></div></article>'}
function renderFeed(){const rows=filteredItems();if(!rows.some(i=>i.id===activeId)&&rows[0])activeId=rows[0].id;byId("feedCount").textContent=rows.length+" resultats";byId("articleStatus").innerHTML="<span>"+rows.length+" fiches visibles</span><span>"+selected.size+" selectionnees</span>";byId("feed").innerHTML=rows.map(cardHtml).join("")||'<section class="note"><strong>Aucun resultat</strong><p>Vide la recherche ou change les filtres.</p></section>'}
function renderDetail(){const item=activeItem();if(!item)return;const gh=item.github?'<a href="'+esc(item.github)+'" target="_blank" rel="noopener noreferrer">GitHub</a>':"";const concepts=item.concepts.filter(c=>c.parent).slice(0,8).map(c=>'<span>'+esc(c.label)+'</span>').join("");byId("detail").innerHTML='<section class="detail-title"><div class="titleline"><h1>'+esc(item.title)+'</h1><div class="statusbox"><b>'+esc(item.status)+'</b><span>statut</span></div></div><div class="source-strip"><span>'+esc(item.integratedAt||"date n/a")+'</span><span>'+esc(item.path)+'</span><span>'+esc(item.folderLabel)+'</span><span>'+esc(item.themeLabel)+'</span>'+gh+concepts+'</div><p>'+esc(item.summary)+'</p><div class="detail-actions"><a class="btn dark" href="'+esc(item.path)+'" target="_blank" rel="noopener noreferrer">Ouvrir .md</a><button class="btn" id="copyActive">Copier MD</button><button class="btn" id="toggleFiche">Replier</button><button class="btn red" id="selectActive">Selection</button></div></section><section class="detail-body">'+markdown(item.raw||"")+'</section>'}
function itemMarkdown(item){return "## "+item.title+"\n\n- Statut: "+item.status+"\n- Type: "+item.type+"\n\n"+(item.raw||item.summary)+"\n"}
function exportMarkdown(items){const rows=items.length?items:[activeItem()];const chapter=rows.map(item=>"- "+item.title+" : "+(item.summary||"").replace(/\s+/g," ").trim()).join("\n");return "# KM Search v1.12 selection\n\n## Chapitrage\n\n"+chapter+"\n\n## Fiches\n\n"+rows.map(itemMarkdown).join("\n")}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function copy(text){await navigator.clipboard.writeText(text)}
function currentShareUrl(){const params=new URLSearchParams();const q=byId("search").value.trim(), folder=byId("folderFilter").value, theme=byId("themeFilter").value, concept=byId("conceptFilter").value, status=byId("statusFilter").value, tag=byId("tagFilter").value.trim();if(q)params.set("q",q);if(folder&&folder!=="all")params.set("folder",folder);if(theme&&theme!=="all")params.set("theme",theme);if(concept&&concept!=="all")params.set("concept",concept);if(status&&status!=="all")params.set("status",status);if(tag)params.set("tag",tag);if(activeItem())params.set("fiche",activeItem().id);return location.href.split("#")[0]+"#"+params.toString()}
function renderAll(){renderStats();renderFilters();renderTopics();renderFeed();renderDetail()}
document.addEventListener("click",e=>{if(e.target.id==="toggleFiche"){byId("workspace").classList.add("fiche-collapsed");byId("openFiche").classList.add("on");toast("Fiche repliee");return}if(e.target.id==="openFiche"){byId("workspace").classList.remove("fiche-collapsed");byId("openFiche").classList.remove("on");toast("Fiche ouverte");return}const tagBtn=e.target.closest('[data-action="tag"]');if(tagBtn){byId("tagFilter").value=tagBtn.dataset.tag||"";renderAll();toast("Tag filtre: "+(tagBtn.dataset.tag||""));return}const topicBtn=e.target.closest(".topic");if(topicBtn){topic=topicBtn.dataset.topic;renderAll();return}const card=e.target.closest(".news-card");if(card&&e.target.dataset.action==="select"){selected.has(card.dataset.id)?selected.delete(card.dataset.id):selected.add(card.dataset.id);renderAll();return}if(card&&e.target.dataset.action==="copy"){const item=KM_INDEX.find(i=>i.id===card.dataset.id);copy(itemMarkdown(item)).then(()=>toast("Fiche copiee"));return}if(card&&(e.target.dataset.action==="open"||!e.target.closest("a,button,.check"))){activeId=card.dataset.id;byId("workspace").classList.remove("fiche-collapsed");byId("openFiche").classList.remove("on");history.replaceState(null,"","#fiche="+activeId);renderAll();return}if(e.target.id==="copyActive"){copy(itemMarkdown(activeItem())).then(()=>toast("Fiche active copiee"));return}if(e.target.id==="selectActive"){const id=activeItem().id;selected.has(id)?selected.delete(id):selected.add(id);renderAll();return}});
["search","sort","statusFilter","folderFilter","themeFilter","conceptFilter","tagFilter"].forEach(id=>["input","change","search","keyup"].forEach(evt=>byId(id).addEventListener(evt,renderAll)));
byId("clearSearch").onclick=()=>{byId("search").value="";byId("tagFilter").value="";renderAll();byId("search").focus()};
byId("copySelection").onclick=()=>{const items=KM_INDEX.filter(i=>selected.has(i.id));copy(exportMarkdown(items)).then(()=>toast("Selection copiee"))};
byId("exportSelection").onclick=()=>{const items=KM_INDEX.filter(i=>selected.has(i.id));download("km-search-v1.12-selection.md",exportMarkdown(items))};
byId("exportJson").onclick=()=>download("km-search-v1.12-index.json",JSON.stringify(KM_INDEX,null,2));
byId("copyShare").onclick=()=>copy(currentShareUrl()).then(()=>toast("Lien de vue copie"));
const hash=new URLSearchParams(location.hash.replace(/^#/,""));if(hash.get("q"))byId("search").value=hash.get("q");if(hash.get("status"))byId("statusFilter").value=hash.get("status");if(hash.get("tag"))byId("tagFilter").value=hash.get("tag");renderFilters();if(hash.get("folder"))byId("folderFilter").value=hash.get("folder");if(hash.get("theme"))byId("themeFilter").value=hash.get("theme");if(hash.get("concept"))byId("conceptFilter").value=hash.get("concept");if(hash.get("fiche")&&KM_INDEX.some(i=>i.id===hash.get("fiche")))activeId=hash.get("fiche");renderAll();
</script>
</body>
</html>
