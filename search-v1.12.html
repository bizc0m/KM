ntre sur la production d'interfaces plus specifiques, mieux structurees et moins generiques.","relations":[],"raw":"# Taste Skill\n\n## Type\n\nVeille Raindrop KM Monitor / kit frontend pour agents IA.\n\n## Tags\n\n#frontend, #design-system, #ai-agents, #prompt-engineering, #sensible\n\n## Sources\n- Source finale : `https://www.tasteskill.dev/`\n\nLecture KM : 2026-08-05\n\nSource Raindrop :\n\n- titre : `Taste Skill`\n- date : 2026-08-05T12:09:43.474Z\n- domaine : `tasteskill.dev`\n- tags detectes : aucun tag Raindrop\n- note Raindrop : aucune\n\n## Resume court\n\nTaste Skill est un kit de consignes et de pratiques frontend pour agents IA, centre sur la production d'interfaces plus specifiques, mieux structurees et moins generiques.\n\n## Classification\n\n`sensible`\n\nRaison : outil de pilotage d'agents IA et de generation frontend ; pas de capacite offensive directe identifiee, mais risque de publication, copie visuelle, fuite de contexte ou usage sans verification humaine.\n\n## Usage KM\n\n- Evaluer comme reference de prompt/design pour ameliorer les productions frontend agentiques.\n- Comparer avec les skills/design-guidelines deja utilises dans les projets web locaux.\n- Tester uniquement sur projets sandbox avant reutilisation dans un produit client ou public.\n\n## Risque d'abus possible\n\nRisque de generer rapidement des interfaces imitant des produits existants, d'integrer des assets non autorises ou d'exposer dans les prompts des briefs clients, chemins locaux, captures ou donnees internes.\n\n## Points a controler\n\n- Verifier licence, conditions d'usage et droit de reutilisation des consignes.\n- Tester la valeur reelle sur un composant existant plutot que l'adopter comme regle globale.\n- Eviter tout prompt contenant secrets, donnees personnelles ou contexte client non nettoye.","integratedAt":"2026-08-05","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques si les prompts ou projets sont reutilises pour entrainement ou analytics.\n- Eviter toute capture contenant client, secret, email ou chemin local.","integratedAt":"2026-08-04","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.media","label":"Media / Design","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"lifecycle.active","label":"Actif","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"}]},{"id":"watch-lovable-build-for-the-web-20x-faster-md","title":"Lovable Build For The Web 20x Faster","canonical":"","type":"Veille Raindrop KM Monitor / generateur web IA.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#ai-web-builder","#vibe-coding","#app-generation","#deployment","#sensible"],"status":"sensible","path":"watch/lovable-build-for-the-web-20x-faster.md","github":"","summary":"Plateforme de generation d'applications web par IA, centree sur la creation rapide depuis prompt et l'iteration produit.","relations":[],"raw":"# Lovable Build For The Web 20x Faster\n\n## Type\n\nVeille Raindrop KM Monitor / generateur web IA.\n\n## Tags\n\n#ai-web-builder, #vibe-coding, #app-generation, #deployment, #sensible\n\n## Sources\n- Source finale : `https://lovable.dev/dashboard`\n\nLecture KM : 2026-08-04\n\nSource Raindrop :\n\n- titre : `Lovable - Build for the web 20x faster`\n- date : 2026-08-04T05:33:39.490Z\n- domaine : `lovable.dev`\n- tags detectes : aucun tag Raindrop\n- note Raindrop : aucune\n\n## Resume court\n\nPlateforme de generation d'applications web par IA, centree sur la creation rapide depuis prompt et l'iteration produit.\n\n## Classification\n\n`sensible`\n\nRaison : outil de generation/deploiement web pouvant manipuler code, comptes, secrets, contenus tiers et donnees produit. Pas de capacite offensive directe identifiee.\n\n## Usage KM\n\n- Suivre comme outil de prototypage web et benchmark vibe-coding.\n- Comparer avec Open Lovable, Firecrawl, v0, Replit et autres builders IA.\n- Evaluer seulement sur projet sandbox sans secrets ni donnees client.\n\n## Risque d'abus possible\n\nRisque de publier par erreur un prototype expose, cloner une interface tierce, inclure des secrets dans prompts ou connecter des integrations sans perimetre clair.\n\n## Points a controler\n\n- Verifier politique de retention des prompts, donnees projet et credentials.\n- Tester export code, limites de verrouillage fournisseur et controle de publication.\n- Cadrer droits de contenu si l'outil reproduit une page ou un produit existant.","integratedAt":"2026-08-04","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null}]},{"id":"watch-ui-design-made-easy-powered-by-ai-uizard-md","title":"UI Design Made Easy Powered By AI Uizard","canonical":"","type":"Veille Raindrop KM Monitor / outil design IA.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#ui-design","#prototype","#wireframe","#product-design","#actif"],"status":"actif","path":"watch/ui-design-made-easy-powered-by-ai-uizard.md","github":"","summary":"Outil de design UI assiste par IA pour creer rapidement maquettes, prototypes et interfaces a partir d'un flux accessible type slides.","relations":[],"raw":"# UI Design Made Easy Powered By AI Uizard\n\n## Type\n\nVeille Raindrop KM Monitor / outil design IA.\n\n## Tags\n\n#ui-design, #prototype, #wireframe, #product-design, #actif\n\n## Sources\n- Source finale : `https://uizard.io/`\n\nLecture KM : 2026-08-04\n\nSource Raindrop :\n\n- titre : `UI Design Made Easy, Powered By AI | Uizard`\n- date : 2026-08-04T05:33:27.533Z\n- domaine : `uizard.io`\n- tags detectes : aucun tag Raindrop\n- note Raindrop : aucune\n\n## Resume court\n\nOutil de design UI assiste par IA pour creer rapidement maquettes, prototypes et interfaces a partir d'un flux accessible type slides.\n\n## Classification\n\n`actif`\n\nRaison : outil design/prototypage sans capacite offensive directe identifiee.\n\n## Usage KM\n\n- Evaluer pour wireframes rapides de produits web, desktop et mobile.\n- Comparer ergonomie, exports et collaboration avec Banani et outils Figma-like.\n- Utiliser comme source d'inspiration process, pas comme stockage de maquettes confidentielles.\n\n## Risque d'abus possible\n\nRisque de fuite de contexte produit dans prompts, imitation visuelle de produits existants ou reutilisation de maquettes contenant donnees client.\n\n## Points a controler\n\n- Verifier conditions d'usage, retention et droits des exports.\n- Tester qualite export et limites de collaboration avant adoption.\n- Ne pas stocker de captures, comptes ou donnees personnelles dans la fiche KM.","integratedAt":"2026-08-04","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.media","label":"Media / Design","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"lifecycle.active","label":"Actif","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"}]},{"id":"watch-axorcist-macos-accessibility-md","title":"AXorcist macOS Accessibility","canonical":"","type":"Veille Raindrop KM Monitor / bibliotheque Swift pour macOS Accessibility.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#macos","#accessibility","#swift","#ui-automation","#agents","#sensible"],"status":"sensible","path":"watch/axorcist-macos-accessibility.md","github":"https://github.com/openclaw/AXorcist","summary":"Wrapper Swift pour interroger, lire, cliquer et inspecter des interfaces macOS via Accessibility. Signal important pour agents desktop, automatisation UI et tests d'apps natives.","relations":[],"raw":"# AXorcist macOS Accessibility\n\n## Type\n\nVeille Raindrop KM Monitor / bibliotheque Swift pour macOS Accessibility.\n\n## Tags\n\n#macos, #accessibility, #swift, #ui-automation, #agents, #sensible\n\n## Sources\n- Source finale : `https://github.com/openclaw/AXorcist`\n\nLecture KM : 2026-08-03\n\nSource Raindrop :\n\n- titre : `AXorcist - Swift wrapper for macOS Accessibility-chainable, fuzzy-matched queries that read, click, and inspect any UI. The power of Swift compels your UI to obey!`\n- date : 2026-08-03T09:33:21.787Z\n- domaine : `github.com`\n- auteur/source : `openclaw`\n- tags detectes : aucun tag Raindrop\n\n## Resume court\n\nWrapper Swift pour interroger, lire, cliquer et inspecter des interfaces macOS via Accessibility. Signal important pour agents desktop, automatisation UI et tests d'apps natives.\n\n## Classification\n\n`sensible`\n\nRaison : l'API Accessibility peut agir sur des applications locales et lire des contenus UI. Elle n'est pas offensive par nature, mais exige un cadrage strict des permissions.\n\n## Usage KM\n\n- Suivre les briques techniques pour agents macOS et controles UI.\n- Evaluer l'ergonomie de requetes Accessibility chainables et fuzzy-matched.\n- Comparer aux approches Computer Use, AXSelectedText et automatisation native.\n\n## Risque d'abus possible\n\nLecture de donnees visibles dans des apps, clics non voulus, automatisation d'interfaces sensibles et confusion entre test UI autorise et controle d'applications reelles.\n\n## Points a controler\n\n- Tester uniquement dans un environnement local controle.\n- Verifier les permissions Accessibility accordees a l'app hote.\n- Eviter toute capture ou stockage de donnees UI privees.","integratedAt":"2026-08-03","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"capability.automation","label":"Automation","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-macos26-agent-desktop-harness-md","title":"MacOS26 Agent Desktop Harness","canonical":"","type":"Veille Raindrop KM Monitor / agent desktop macOS et harness agentique.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#macos","#desktop-agent","#computer-use","#coding","#automation","#sensible"],"status":"sensible","path":"watch/macos26-agent-desktop-harness.md","github":"https://github.com/macos26/agent","summary":"Harness agentique pour Mac Desktop couvrant computer use, automatisation, scripting, coding et plusieurs fournisseurs LLM locaux ou cloud.","relations":[],"raw":"# MacOS26 Agent Desktop Harness\n\n## Type\n\nVeille Raindrop KM Monitor / agent desktop macOS et harness agentique.\n\n## Tags\n\n#macos, #desktop-agent, #computer-use, #coding, #automation, #sensible\n\n## Sources\n- Source finale : `https://github.com/macos26/agent`\n\nLecture KM : 2026-08-03\n\nSource Raindrop :\n\n- titre : `Agent: Mac Agent for macOS 26: the agentic AI harness for your Mac Desktop. Computer use, automation, scripting, coding, and more. Powered by 18+ providers across local and cloud LLMs.`\n- date : 2026-08-03T09:28:41.548Z\n- domaine : `github.com`\n- auteur/source : `macos26`\n- tags detectes : aucun tag Raindrop\n\n## Resume court\n\nHarness agentique pour Mac Desktop couvrant computer use, automatisation, scripting, coding et plusieurs fournisseurs LLM locaux ou cloud.\n\n## Classification\n\n`sensible`\n\nRaison : agent desktop avec controle potentiel d'apps locales, scripts et code. Usage acceptable en veille technique, mais a isoler avant execution.\n\n## Usage KM\n\n- Comparer les agents desktop macOS et leurs modeles de permissions.\n- Identifier les integrations LLM locales/cloud et les risques de routage de donnees.\n- Suivre les cas d'usage automation, scripting et coding sur poste local.\n\n## Risque d'abus possible\n\nExecution de scripts non valides, clics ou actions UI non desirees, fuite de donnees vers fournisseurs LLM et modification de code sans revue.\n\n## Points a controler\n\n- Verifier les providers actives et la gestion des secrets.\n- Tester sur machine ou compte de test.\n- Imposer confirmation humaine avant actions destructives, reseau ou fichiers personnels.","integratedAt":"2026-08-03","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"capability.automation","label":"Automation","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"}]},{"id":"watch-macusb-bootable-usb-creator-macos-md","title":"macUSB Bootable USB Creator macOS","canonical":"","type":"Veille Raindrop KM Monitor / outil macOS.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#macos","#usb","#bootable-media","#recovery","#actif"],"status":"actif","path":"watch/macusb-bootable-usb-creator-macos.md","github":"","summary":"Application macOS qui propose un flux guide pour creer des supports USB bootables, notamment pour installation, recovery ou scenarios de maintenance.","relations":[],"raw":"# macUSB Bootable USB Creator macOS\n\n## Type\n\nVeille Raindrop KM Monitor / outil macOS.\n\n## Tags\n\n#macos, #usb, #bootable-media, #recovery, #actif\n\n## Sources\n- Source finale : `https://www.macusb.app/`\n\nLecture KM : 2026-08-03\n\nSource Raindrop :\n\n- titre : `macUSB - The all-in-one USB creator for Mac`\n- date : 2026-08-03T18:00:55.785Z\n- domaine : `macusb.app`\n- tags detectes : aucun tag Raindrop\n- note Raindrop : aucune\n\n## Resume court\n\nApplication macOS qui propose un flux guide pour creer des supports USB bootables, notamment pour installation, recovery ou scenarios de maintenance.\n\n## Classification\n\n`actif`\n\nRaison : outil utilitaire macOS sans capacite offensive directe identifiee. Le risque vient surtout de la manipulation de supports bootables et de disques.\n\n## Usage KM\n\n- Suivre comme outil macOS potentiel pour creation de media USB bootables et workflows de recovery.\n- Comparer l'ergonomie avec les outils natifs ou CLI pour installation et depannage.\n- Verifier signature, distribution et modele de confiance avant usage sur poste principal.\n\n## Risque d'abus possible\n\nCreation de media bootables pouvant effacer un volume par erreur, installer une image non fiable ou servir de vecteur de persistence/boot externe si l'image source est malveillante.\n\n## Points a controler\n\n- Verifier la provenance de l'application et des images ISO/DMG utilisees.\n- Tester sur support USB dedie avant usage production.\n- Confirmer les permissions macOS, la signature de l'app et la politique de mise a jour.\n\n## Garde-fous\n\n- Ne pas stocker d'images disque, captures contenant volumes personnels, chemins locaux ou medias bootables dans le KM.\n- Ne pas utiliser avec des images systeme non verifiees.","integratedAt":"2026-08-03","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"lifecycle.active","label":"Actif","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null}]},{"id":"watch-noteplan-mcp-server-md","title":"NotePlan MCP Server", amais stocker de notes, evenements prives ou chemins personnels dans cette fiche.","integratedAt":"2026-08-03","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-openfelix-local-ai-agent-macos-md","title":"Open Felix - Local AI Agent for macOS","canonical":"","type":"Veille Raindrop KM Monitor / agent IA local pour macOS.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#macos","#local-ai","#agent","#privacy","#automation","#sensible"],"status":"sensible","path":"watch/openfelix-local-ai-agent-macos.md","github":"","summary":"Agent IA local pour macOS presente comme compagnon executant sur l'appareil. Signal pertinent pour suivre la tendance agents desktop locaux et privacy-first.","relations":[],"raw":"# Open Felix - Local AI Agent for macOS\n\n## Type\n\nVeille Raindrop KM Monitor / agent IA local pour macOS.\n\n## Tags\n\n#macos, #local-ai, #agent, #privacy, #automation, #sensible\n\n## Sources\n- Source finale : `https://openfelix.com/`\n\nLecture KM : 2026-08-03\n\nSource Raindrop :\n\n- titre : `Open Felix - Local AI Agent for macOS`\n- date : 2026-08-03T09:27:55.077Z\n- domaine : `openfelix.com`\n- tags detectes : aucun tag Raindrop\n\n## Resume court\n\nAgent IA local pour macOS presente comme compagnon executant sur l'appareil. Signal pertinent pour suivre la tendance agents desktop locaux et privacy-first.\n\n## Classification\n\n`sensible`\n\nRaison : agent local susceptible d'interagir avec fichiers, apps et contexte utilisateur. Le caractere local reduit certains risques reseau mais ne supprime pas les risques de permissions et d'actions non desirees.\n\n## Usage KM\n\n- Surveiller les agents IA macOS local-first.\n- E e":"Brandfetch","canonical":"","type":"Veille Raindrop KM Monitor / ressource de marque et assets publics.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#brand-assets","#logos","#design","#api","#actif"],"status":"actif","path":"watch/brandfetch.md","github":"","summary":"Service de recherche et recuperation d'identites de marque, logos et assets publics. Signal utile pour design produit, enrichissement CRM, pages commerciales et normalisation de visuels de marques dans des workflows KM.","relations":[],"raw":"# Brandfetch\n\n## Type\n\nVeille Raindrop KM Monitor / ressource de marque et assets publics.\n\n## Tags\n\n#brand-assets, #logos, #design, #api, #actif\n\n## Sources\n- Source finale : `https://brandfetch.com/`\n\nLecture KM : 2026-08-02\n\nSource Raindrop :\n\n- titre : `Brandfetch`\n- date : 2026-08-02T13:46:13.538Z\n- domaine : `brandfetch.com`\n- tags detectes : aucun tag Raindrop\n- note Raindrop : `Tout les logos de marque`\n\n## Resume court\n\nService de recherche et recuperation d'identites de marque, logos et assets publics. Signal utile pour design produit, enrichissement CRM, pages commerciales et normalisation de visuels de marques dans des workflows KM.\n\n## Classification\n\n`actif`\n\nRaison : ressource publique de logos et donnees de marque sans capacite offensive directe identifiee. Le principal risque est l'usage incorrect d'assets, pas une exploitation technique.\n\n## Usage KM\n\n- Retrouver rapidement un logo ou une identite visuelle publique pour fiches, dashboards, CRM et pages produit.\n- Evaluer les contraintes d'usage d'assets de marque avant publication.\n- Identifier si une API ou un workflow d'enrichissement peut automatiser la recuperation de logos.\n\n## Risque d'abus possible\n\nRisque de confusion de marque, usage non autorise de logos, impersonation visuelle dans des pages commerciales ou emails, et dependance a des metadonnees externes non auditees.\n\n## Points a controler\n\n- Verifier les conditions d'utilisation et droits de marque avant usage public.\n- Tester la page avec un navigateur si la resolution automatique reste bloquee par Cloudflare.\n- Eviter de stocker des logos bruts ou assets copyright dans le KM ; conserver uniquement la fiche et le lien source.","integratedAt":"2026-08-02","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.media","label":"Media / Design","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.ai.llm","label":"LLM / Providers","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"lifecycle.active","label":"Actif","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"}]},{"id":"watch-tailscale-secure-connectivity-for-ai-iot-multi-cloud-md","title":"Tailscale Secure Connectivity For AI IoT Multi Cloud","canonical":"","type":"Veille Raindrop KM Monitor / connectivite Zero Trust et reseau prive.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#tailscale","#zero-trust","#vpn","#network-security","#infrastructure","#sensible"],"status":"sensible","path":"watch/tailscale-secure-connectivity-for-ai-iot-multi-cloud.md","github":"","summary":"Plateforme de connectivite securisee pour relier utilisateurs, appareils, ressources cloud, environnements IoT et workflows IA via un modele Zero Trust base sur l'identite. Signal utile pour la veille infrastructure, acces prive, agents deployes et securisation de ressources multi-cloud.","relations":[],"raw":"# Tailscale Secure Connectivity For AI IoT Multi Cloud\n\n## Type\n\nVeille Raindrop KM Monitor / connectivite Zero Trust et reseau prive.\n\n## Tags\n\n#tailscale, #zero-trust, #vpn, #network-security, #infrastructure, #sensible\n\n## Sources\n- Source finale : `https://tailscale.com`\n\nLecture KM : 2026-07-31\n\nSource Raindrop :\n\n- titre : `Tailscale | Secure Connectivity for AI, IoT & Multi-Cloud`\n- date : 2026-07-31T08:30:39.196Z\n- domaine : `tailscale.com`\n- tags detectes : aucun tag Raindrop\n\n## Resume court\n\nPlateforme de connectivite securisee pour relier utilisateurs, appareils, ressources cloud, environnements IoT et workflows IA via un modele Zero Trust base sur l'identite. Signal utile pour la veille infrastructure, acces prive, agents deployes et securisation de ressources multi-cloud.\n\n## Classification\n\n`sensible`\n\nRaison : solution d'acces reseau et d'infrastructure pouvant exposer des environnements internes si mal configuree. Aucune capacite offensive directe n'est identifiee dans la source, donc la fiche reste en niveau sensible.\n\n## Usage KM\n\n- Suivre les patterns d'acces Zero Trust pour agents IA, serveurs, dashboards internes et ressources multi-cloud.\n- Comparer Tailscale aux options VPN, mesh networking, identity-aware proxy et acces prive pour environnements Codex/automation.\n- Alimenter les decisions d'architecture sur segmentation, permissions par identite et exposition minimale des services.\n\n## Risque d'abus possible\n\nRisque de mauvaise configuration : partage involontaire de services internes, droits trop larges, acces persistant a des machines sensibles, confusion entre reseau prive et controle applicatif, journalisation insuffisante et exposition de ressources d'agents ou de dashboards.\n\n## Points a controler\n\n- Verifier les ACL, groupes, tags machines, expirations de cles et posture device avant tout usage production.\n- Auditer les partages externes, exit nodes, subnet routers et permissions admin.\n- Eviter de documenter des noms de machines, chemins internes, emails, tokens ou topologies privees dans les fiches publiques.\n\n## Garde-fous\n\n- Ne pas stocker de secrets, emails prives, noms de machines internes ou topologies personnelles.\n- Ne pas traiter Tailscale comme frontiere de securite unique sans controle applicatif.","integratedAt":"2026-07-31","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null}]},{"id":"watch-auto-company-autonomous-ai-company-md","title":"Auto Company Autonomous AI Company","canonical":"","type":"Veille Raindrop KM Monitor / orchestration multi-agents autonome.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#agents","#autonomous-company","#codex-cli","#claude-code","#daemon","#sensible"],"status":"sensible","path":"watch/auto-company-autonomous-ai-company.md","github":"https://github.com/MaxMiksa/Auto-Company","summary":"Depot open source qui orchestre une equipe d'agents IA via Claude Code ou Codex CLI pour fonctionner en boucle continue sur macOS, Windows/WSL ou Linux, avec memoire de consensus, logs, dashboard local et workflows produit/code/deploiement/marketing.","relations":[],"raw":"# Auto Company Autonomous AI Company\n\n## Type\n\nVeille Raindrop KM Monitor / orchestration multi-agents autonome.\n\n## Tags\n\n#agents, #autonomous-company, #codex-cli, #claude-code, #daemon, #sensible\n\n## Sources\n- Source finale : `https://github.com/MaxMiksa/Auto-Company`\n- Metadata GitHub API : `https://api.github.com/repos/MaxMiksa/Auto-Company`\n\nLecture KM : 2026-07-22\n\nSource Raindrop :\n\n- titre : `MaxMiksa/Auto-Company: An auto-company works for 24/7 on your own PC - Windows/Linux/macOS.`\n- date : 2026-07-22T13:24:04.972Z\n- domaine : `github.com`\n- tags detectes : `LLM`, `Company`, `Auto`\n\n## Resume court\n\nDepot open source qui orchestre une equipe d'agents IA via Claude Code ou Codex CLI pour fonctionner en boucle continue sur macOS, Windows/WSL ou Linux, avec memoire de consensus, logs, dashboard local et workflows produit/code/deploiement/marketing.\n\n## Classification\n\n`sensible`\n\nRaison : l'outil peut executer des agents en continu sur une machine locale, manipuler des depots, lancer des commandes et consommer des quotas LLM. Aucune capacite offensive directe n'a ete identifiee dans la fiche source, donc le classement reste sensible.\n\n## Usage KM\n\n- Suivre les patterns d'orchestration d'agents longue duree et de memoire consensus en fichier Markdown.\n- Comparer les garde-fous de boucles autonomes avec les pratiques Codex/Claude locales.\n- Alimenter la veille sur les \"AI companies\" locales, les daemons agentiques et les dashboards d'observabilite.\n\n## Risque d'abus possible\n\nRisque eleve de derive operationnelle si lance sans cadrage : commandes locales non surveillees, propagation d'erreurs en boucle, consommation de credits, modification de code, automatisation marketing non validee et exposition potentielle de secrets presents dans l'environnement.\n\n## Points a controler\n\n- Auditer les scripts de daemon, les droits shell, les appels CLI et les garde-fous avant execution locale.\n- Verifier le modele de permission Codex/Claude utilise par defaut et les chemins lus/ecrits.\n- Tester dans un depot sandbox avant toute connexion a des comptes, tokens, projets clients ou workflows de publication.\n\n## Garde-fous\n\n- Ne pas lancer avec des tokens de production ni dans un repertoire contenant des donnees privees.\n- Ne pas utiliser pour publication, vente ou prospection automatisee sans validation humaine.","integratedAt":"2026-07-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-assistants-ia-revolut-md","title":"Assistants IA Revolut"  bloque l'audit automatisable.\n- Identifier les donnees traitees par les assistants IA Revolut et les limites annoncees.\n- Verifier si les conditions different selon pays, langue ou statut client.\n\n## Garde-fous\n\n- Ne pas stocker de donnees client, captures de compte, emails ou contenu complet soumis a copyright.\n- Ne pas reutiliser la notice comme conseil juridique sans validation humaine.","integratedAt":"2026-07-17","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null}]},{"id":"watch-neodisk-macos-disk-visualizer-md","title":"Neodisk macOS Disk Visualizer","canonical":"","type":"Veille Raindrop KM Monitor / outil macOS open source.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#macos","#disk-analyzer","#swift","#open-source"],"status":"actif","path":"watch/neodisk-macos-disk-visualizer.md","github":"https://github.com/tkslucas/Neodisk","summary":"Application macOS open source en Swift pour visualiser l'espace disque en treemap et sunburst, avec positionnement read-only.","relations":[],"raw":"# Neodisk macOS Disk Visualizer\n\n## Type\n\nVeille Raindrop KM Monitor / outil macOS open source.\n\n## Tags\n\n#macos, #disk-analyzer, #swift, #open-source\n\n## Sources\n- Source finale : `https://github.com/tkslucas/Neodisk`\n- Site projet : `https://neodisk.app`\n\nLecture KM : 2026-07-17\n\nSource Raindrop :\n\n- titre : `GitHub - tkslucas/Neodisk: Read-only treemap and sunburst macOS disk space visualizer`\n- date : 2026-07-17T07:53:34.165Z\n- domaine : `github.com`\n- auteur/source : `tkslucas`\n- tags detectes : aucun tag Raindrop\n\nSource GitHub :\n\n- depot : `tkslucas/Neodisk`\n- langage : Swift\n- licence : GPL-3.0\n- description : R ournaliser les actions d'agents et limiter les permissions par role.\n- Verifier les flux de memoire avant adoption.","integratedAt":"2026-07-11","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"capability.automation","label":"Automation","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"capability.memory","label":"Memoire / Contexte","parent":"capability"},{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-pentagi-autonomous-pentest-agents-md","title":"Pentagi - Autonomous Pentest Agents","canonical":"","type":"Veille #ROUGE / agents IA autonomes de penetration testing.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#pentest","#offensive-security","#autonomous-agents","#security-automation","#github"],"status":"#ROUGE","path":"watch/pentagi-autonomous-pentest-agents.md","github":"https://github.com/vxcontrol/pentagi","summary":"Systeme d'agents IA autonomes presente comme capable d'executer des taches complexes de penetration testing. Le projet entre dans la veille defensive stricte sur l'automatisation offensive par agents.","relations":[],"raw":"# Pentagi - Autonomous Pentest Agents\n\n## Type\n\nVeille `#ROUGE` / agents IA autonomes de penetration testing.\n\n## Tags\n\n#rouge, #pentest, #offensive-security, #autonomous-agents, #security-automation, #github\n\n## Sources\n- Repo GitHub : `https://github.com/vxcontrol/pentagi`\n\nLecture KM : 2026-07-11\n\nSource Raindrop :\n\n- titre : `vxcontrol/pentagi: Fully autonomous AI Agents system capable of performing complex penetration testing tasks`\n- date : 2026-07-11T08:49:37.140Z\n- domaine : `github.com`\n- tags detectes : aucun tag Raindrop\n\nSource GitHub publique :\n\n- depot : `vxcontrol/pentagi`\n- licence : MIT\n- etoiles relevees : 19833\n- topics releves : offensive-security, penetration-testing, penetration-testing-tools, security-automation, security-tools, autonomous-agents\n- derniere activite relevee : 2026-07-11T11:25:46Z\n\n## Resume court\n\nSysteme d'agents IA autonomes presente comme capable d'executer des taches complexes de penetration testing. Le projet entre dans la veille defensive stricte sur l'automatisation offensive par agents.\n\n## Classification\n\n`#ROUGE`\n\nRaison : l'outil annonce directement des capacites de penetration testing autonome. Il doit rester une source interne de threat intelligence, sans procedure operationnelle, commandes ni guide d'exploitation.\n\n## Usage KM\n\n- Suivre l'evolution des agents de pentest autonomes.\n- Comparer les capacites annoncees avec CyberStrike, PentestGPT et autres agents offensifs.\n- Alimenter les garde-fous de detection, containment et evaluation defensive en laboratoire autorise.\n\n## Usage defensif legitime\n\n- Evaluation en lab isole, CTF ou environnement explicitement autorise.\n- Threat intelligence sur l'automatisation offensive par agents.\n- Preparation de controles defensifs, journalisation et limites d'execution.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Recon non autorisee | automatisation de collecte et analyse contre cibles tierces | #ROUGE |\n| Exploitation | chainage de taches de penetration testing hors cadre autorise | #ROUGE |\n| Abaissement de barriere | usage par profils non qualifies contre systemes reels | #ROUGE |\n\n## Garde-fous\n\n- Ne pas fournir de commandes, payloads, procedures ou chaines d'exploitation.\n- Ne pas executer ni tester sur cible externe sans autorisation ecrite.\n- Ne pas connecter a comptes, secrets, VPN ou reseaux reels hors lab.\n- Ne pas integrer dans un produit public.","integratedAt":"2026-07-11","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"risk.offensive","label":"Offensif / #ROUGE","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null}]},{"id":"watch-scrapling-web-scraping-modern-web-md","title":"Scrapling - Web Scraping Modern Web","canonical":"","type":"Veille Raindrop KM Monitor / framework de scraping web.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#scraping","#web-extraction","#python","#documentation","#sensible"],"status":"a verifier","path":"watch/scrapling-web-scraping-modern-web.md","github":"","summary":"Documentation Scrapling, outil oriente extraction web moderne. Le signal est pertinent pour la veille scraping, ingestion de pages publiques et robustesse de collecte, avec attention aux conditions d'usage et au risque anti-bot.","relations":[],"raw":"# Scrapling - Web Scraping Modern Web\n\n## Type\n\nVeille Raindrop KM Monitor / framework de scraping web.\n\n## Tags\n\n#scraping, #web-extraction, #python, #documentation, #sensible\n\n## Sources\n- Documentation : `https://scrapling.readthedocs.io/`\n\nLecture KM : 2026-07-11\n\nSource Raindrop :\n\n- titre : `Index - Scrapling`\n- date : 2026-07-11T09:09:42.532Z\n- domaine : `scrapling.readthedocs.io`\n- tags detectes : aucun tag Raindrop\n\nSource publique :\n\n- titre HTML : `Index - Scrapling`\n- description : `Scrapling - Effortless Web Scraping for the Modern Web!`\n\n## Resume court\n\nDocumentation Scrapling, outil oriente extraction web moderne. Le signal est pertinent pour la veille scraping, ingestion de pages publiques et robustesse de collecte, avec attention aux conditions d'usage et au risque anti- rchived : non\n- topics : `codebase-analysis`, `knowledge-graph`, `codex`, `claude-code`, `vibe-coding`\n\n## Resume court\n\nUnderstand Anything transforme une base de code en graphe de connaissance interactif, exploratoire et interrogeable. L'interet KM est de suivre les outils de comprehension de code et de cartographie projet pour agents IA.\n\n## Classification\n\n`sensible`\n\nRaison : outil d'analyse de code pouvant traiter des depots prives, de la logique metier, des secrets accidentels ou de la propriete intellectuelle. Pas de capacite offensive directe identifiee, donc classement rouge non retenu.\n\n## Usage KM\n\n- Evaluer les outils de cartographie de codebase.\n- Comparer les workflows Codex, Claude Code, Cursor, Copilot et Gemini CLI.\n- Identifier les risques de fuite de contexte projet lors d'une analyse agentique.\n\n## Risque d'abus possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Exposition de code prive | indexation ou visualisation de logique metier non publique | sensible |\n| Secrets accidentels | graphe construit sur fichiers contenant tokens ou configs | sensible |\n| Surconfiance agentique | interpretations de code non verifiees dans un workflow automatisable | sensible |\n\n## Garde-fous\n\n- Tester sur depot public ou sandbox sans secrets.\n- Exclure `.env`, credentials, dumps, logs et donnees client avant indexation.\n- Verifier le mode de stockage du graphe avant usage sur code prive.","integratedAt":"2026-06-24","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"capability.memory","label":"Memoire / Contexte","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","pa s de blocage, detection, formation defensive et hygiene securite.\n\n## Usage defensif legitime\n\n- Reverse engineering en environnement isole.\n- Recherche defensive, detection et analyse de signatures.\n- Formation securite encadree, sans redistribution de code.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Reutilisation malware | reprise ou adaptation de code malveillant | #ROUGE |\n| Evasion | comparaison de familles pour contourner defenses | #ROUGE |\n| Diffusion | redistribution de contenu dangereux hors cadre | #ROUGE |\n\n## Garde-fous\n\n- Ne pas copier ni stocker de code source malware dans KM.\n- Ne pas fournir de procedure de build, execution, modification ou deploiement.\n- Ne pas ouvrir sur environnement non isole.\n- Garder la fiche au niveau meta/source uniquement.","integratedAt":"2026-06-24","theme":"dev","themeLabel":"Dev tools","concepts":[{"id":"risk.offensive","label":"Offensif / #ROUGE","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.osint","label":"OSINT","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","parent":null}]},{"id":"watch-conet-privacy-depin-network-md","title":"CONET - Privacy DePIN Network","canonical":"","type":"Veille infra privacy / DePIN / reseau decentralise.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#privacy","#depin","#crypto","#wallet-address","#decentralized-network","#encrypted-routing","#vpn-alternative","#tokenomics","#sensitive","#to-verify"],"status":"a verifier","path":"watch/conet-privacy-depin-network.md","github":"","summary":"CONET se presente comme une infrastructure DePIN orientee privacy. Le projet affirme remplacer les adresses IP par des adresses wallet chiffrees comme identifiants reseau, faire transiter des messages chiffrés via des noeuds, et recompenser des noeuds/miners pour le relais de paquets. Ces promesses doivent rester classees comme claims projet tant qu'il n'y a pas d'audit technique independant, de verification code/source, de test reseau et de cadre legal clair pour l'exploitation de noeuds.","relations":[],"raw":"# CONET - Privacy DePIN Network\n\n## Type\n\nVeille infra privacy / DePIN / reseau decentralise.\n\n## Tags\n\n#privacy, #depin, #crypto, #wallet-address, #decentralized-network, #encrypted-routing, #vpn-alternative, #tokenomics, #sensitive, #to-verify\n\n## Sources\n\n- Site officiel : `https://conet.network/`\n- Documentation officielle : `https://doceng.conet.network/`\n- Introduction docs : `https://doceng.conet.network/welcome-to-conet/introduction`\n- Fonctionnement docs : `https://doceng.conet.network/core-technology/how-conet-works-decentralized-private-and-secure`\n- Silent Pass : `https://conet.network/silent-pass/`\n- Privacy policy : `https://conet.network/privacy-cookies/`\n\nLecture KM : 2026-05-25\n\n## Resume court\n\nCONET se presente comme une infrastructure DePIN orientee privacy. Le projet affirme remplacer les adresses IP par des adresses wallet chiffrees comme identifiants reseau, faire transiter des messages chiffrés via des noeuds, et recompenser des noeuds/miners pour le relais de paquets.\n\nCes promesses doivent rester classees comme claims projet tant qu'il n'y a pas d'audit technique independant, de verification code/source, de test reseau et de cadre legal clair pour l'exploitation de noeuds.\n\n## Verification source\n\n| Point | Observation | Statut |\n| --- | --- | --- |\n| Site officiel | `conet.network` accessible et coherent avec docs | verifie source officielle |\n| Docs | `doceng.conet.network` decrit DePIN, wallet address et relay encrypted data | verifie source officielle |\n| Privacy policy | annonce peu ou pas de donnees personnelles, Google Analytics avec IP anonymisee | a auditer |\n| GitHub | lien officiel non confirme dans cette passe | a verifier |\n| Tokenomics | modele crypto/mining present dans l'ecosysteme | sensible |\n\n## Usage utile\n\n- Veille sur infrastructures privacy alternatives.\n- Comparer DePIN, VPN, Tor-like routing, relay networks et wallet identity.\n- Comprendre les promesses de reseaux sans IP visible.\n- Evaluer une piste anti-censure dans un cadre legal.\n- Alimenter KM sur privacy tech, crypto infra et risques de relais.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Relay abuse | faire transiter du trafic tiers illegal ou non maitrise via un noeud | sensible ; #ROUGE si facilite abus externe |\n| Overclaim privacy | croire a un anonymat complet sans audit ni modele de menace | sensible |\n| Crypto speculation | achat token/mining motive par rendement non verifie | sensible finance |\n| Juridiction | responsabilite legale variable selon pays et type de trafic relaye | sensible |\n| Contournement | usage pour contourner restrictions sans cadre legitime | sensible ; #ROUGE si usage illegal |\n| Metadata leakage | fuite possible via endpoint, wallet, analytics, app, bridges ou erreurs de config | sensible |\n\n## Garde-fous\n\n- Ne pas traiter les claims d'anonymat comme prouves.\n- Ne pas lancer de noeud public sans analyse legale.\n- Ne pas engager d'argent sans audit tokenomics et risque finance.\n- Tester seulement en lab avec trafic controle.\n- Documenter le modele de menace : qui voit quoi, a quel niveau, avec quels logs.\n- Verifier code, clients, smart contracts, bridge, analytics et conditions d'usage.\n- Ne jamais relayer de trafic tiers non maitrise pour un projet public.\n\n## Questions d'audit\n\n1. Quel repo GitHub officiel correspond au client, aux noeuds et aux smart contracts ?\n2. Les clients sont-ils open source et reproductibles ?\n3. Qui controle les super nodes / guardians / bootstrap nodes ?\n4. Quels logs existent cote app, noeuds, analytics, wallet et infra cloud ?\n5. Que signifie exactement \"no IP\" dans le modele de menace ?\n6. Quel risque juridique pour l'operateur d'un noeud ?\n7. Le token est-il necessaire a l'usage ou seulement a l'incitation ?","integratedAt":"2026-05-25","theme":"privacy","themeLabel":"Privacy","concepts":[{"id":"domain.privacy","label":"Privacy","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"risk.verify","label":"A verifier","parent":"risk"}]},{"id":"watch-moneyprinterturbo-ai-short-video-md","title":"MoneyPrinterTurbo - AI Short Video Generator","canonical":"","type":"Veille outils IA / generation automatique de shorts video.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#ai-video","#shortvideo","#tiktok","#automation","#llm","#moviepy","#python","#content-generation","#social-media","#sensitive"],"status":"sensible","path":"watch/moneyprinterturbo-ai-short-video.md","github":"https://github.com/harry0703/MoneyPrinterTurbo","summary":"MoneyPrinterTurbo est un outil open source de generation automatique de videos courtes avec IA. Le projet vise des workflows de type script, assets, montage et export video, avec un positionnement fort sur les formats courts et TikTok.","relations":[],"raw":"# MoneyPrinterTurbo - AI Short Video Generator\n\n## Type\n\nVeille outils IA / generation automatique de shorts video.\n\n## Tags\n\n#ai-video, #shortvideo, #tiktok, #automation, #llm, #moviepy, #python, #content-generation, #social-media, #sensitive\n\n## Sources\n\n- Repo : `https://github.com/harry0703/MoneyPrinterTurbo`\n- Source X secondaire : `https://x.com/xamto_ai/status/2070335993421722010`\n\nLecture : 2026-05-25\n\nVerification GitHub API :\n\n- repo : `harry0703/MoneyPrinterTurbo`\n- description : utilise les LLM IA pour generer des videos courtes en un clic\n- stars lus : 58078\n- forks lus : 8407\n- langage principal : Python\n- licence : MIT\n- archived : false\n- issues ouvertes lues : 2\n- creation lue : 2024-03-11\n- dernier push lu : 2026-05-25\n- topics lus : ai, automation, chatgpt, moviepy, python, shortvideo, tiktok\n\nSignal Raindrop secondaire :\n\n- titre : post X en chinois sur un outil automatisant la production de videos courtes\n- date : 2026-06-27T11:18:32.213Z\n- domaine : `x.com`\n- auteur/source : `xamto_ai`\n- resolution : `https://t.co/5RCmytlCvM` -> `https://github.com/harry0703/MoneyPrinterTurbo/`\n\n## Resume court\n\nMoneyPrinterTurbo est un outil open source de generation automatique de videos courtes avec IA. Le projet vise des workflows de type script, assets, montage et export video, avec un positionnement fort sur les formats courts et TikTok.\n\n## Usage utile\n\n- Prototyper une chaine de production de shorts IA.\n- Tester un pipeline contenu RS avec validation humaine.\n- Etudier une architecture Python/MoviePy pour montage automatise.\n- Produire des demos internes ou variations de formats courts.\n- Alimenter le futur framework RS comme brique de generation, pas comme publication automatique.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Spam video | production massive de contenus bas qualite ou dupliques | sensible ; #ROUGE si manipulation coordonnee |\n| Desinformation | generation de videos trompeuses, sorties de contexte ou non signalees | sensible ; #ROUGE si campagne malveillante |\n| Impersonation | imitation d'une personne, marque ou voix sans consentement | #ROUGE |\n| Copyright | reutilisation d'assets, musiques, images ou scripts non autorises | sensible |\n| Platform abuse | contournement de limites ou conditions des plateformes sociales | sensible ; #ROUGE si automatisation abusive |\n\n## Garde-fous\n\n- Validation humaine avant toute publication.\n- Pas d'usurpation d'identite, voix, image ou marque.\n- Sources, assets et musiques avec droits clairs.\n- Signalement du contenu genere par IA quand requis.\n- Pas de publication massive non sollicitee.\n- Pas de donnees personnelles dans prompts, assets, logs ou exports.","integratedAt":"2026-05-25","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.media","label":"Media / Design","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"capability.automation","label":"Automation","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"domain.ai.llm","label":"LLM / Providers","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"}]},{"id":"watch-promptspy-ai-android-malware-md","title":"PromptSpy - AI Android Malware","canonical":"","type":"Veille menace mobile IA / malware Android agentique.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#android-security","#mobile-security","#ai-malware","#malware","#google-gemini","#threat-intelligence","#security-alert"],"status":"#ROUGE","path":"watch/promptspy-ai-android-malware.md","github":"","summary":"PromptSpy est presente comme une menace Android utilisant de l'IA generative pendant son execution pour analyser l'ecran, appeler un modele IA et adapter son comportement. La source affirme l'usage de Google Gemini pour aider le malware a s'adapter, persister et eviter certaines defenses mobiles.","relations":[],"raw":"# PromptSpy - AI Android Malware\n\n## Type\n\nVeille menace mobile IA / malware Android agentique.\n\n## Tags\n\n#rouge, #android-security, #mobile-security, #ai-malware, #malware, #google-gemini, #threat-intelligence, #security-alert\n\n## Source\n\nSource fournie : description video Technijian.\n\nMetadonnees fournies :\n\n- Vues : 84\n- Date source : 2026-02-20\n- Hashtags source : `#AndroidSecurity`, `#MobileSecurity`, `#SecurityAlert`, `#PromptSpy`, `#AIMalware`, `#Cybersecurity`, `#GoogleGemini`, `#AIThreats`, `#MobileThreats`, `#ThreatIntel`, `#CyberDefense`\n- Site : `https://technijian.com/`\n- Blog annonce : `https://technijian.com/cyber-security...`\n- Podcast annonce : `https://technijian.com/podcast/prompt...`\n- Reseaux cites : Facebook `technijian01`, Instagram `technijianinc`, LinkedIn `technijian`, TikTok `technijian`, Pinterest `technijian01`, X `technijian_`\n\nVerification KM : non verifiee au 2026-05-23. URLs blog/podcast tronquees dans la source fournie.\n\n## Resume court\n\nPromptSpy est presente comme une menace Android utilisant de l'IA generative pendant son execution pour analyser l'ecran, appeler un modele IA et adapter son comportement. La source affirme l'usage de Google Gemini pour aider le malware a s'adapter, persister et eviter certaines defenses mobiles.\n\n## Points cles annonces\n\n- Malware Android utilisant l'IA generative pendant l'execution.\n- Analyse de l'ecran de l'appareil.\n- Appels a un modele IA pour adapter le comportement.\n- Mise en avant de la persistance et de l'evasion mobile.\n- Impact potentiel pour les strategies de securite mobile en entreprise.\n- Source orientee sensibilisation pour responsables IT, entreprises et utilisateurs Android.\n\n## Usage utile\n\n- Veille threat intelligence sur les usages IA dans malware mobile.\n- Sensibilisation Android security / mobile security.\n- Alimenter une checklist defensive mobile : MDM, permissions, sources d'installation, monitoring, detection comportementale.\n- Surveiller l'evolution des malwares qui utilisent des LLM pendant l'execution.\n- Preparer une fiche de risque pour entreprises equipees Android.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Malware adaptatif | usage d'un modele IA pour adapter la logique d'attaque | #ROUGE |\n| Evasion mobile | contournement de defenses par comportement dynamique | #ROUGE |\n| Persistance | maintien non autorise sur appareil Android | #ROUGE |\n| Spyware | collecte ou observation d'ecran/appareil sans consentement | #ROUGE |\n| Phishing contextuel | adaptation de leurres selon l'ecran ou le contexte utilisateur | #ROUGE |\n\n## Garde-fous\n\n- Ne pas diffuser de procedure d'installation, execution ou contournement.\n- Ne pas chercher d'echantillon malware sans environnement isole et autorisation explicite.\n- Ne pas transformer cette fiche en tutoriel offensif.\n- Ne conserver que les metadonnees publiques et les lecons defensives.\n- Verifier la source primaire avant toute decision technique.\n\n## Mesures defensives a surveiller\n\n- MDM et inventaire des appareils Android.\n- Installation uniquement depuis sources approuvees.\n- Controle des permissions sensibles : accessibilite, overlay, lecture ecran, notifications.\n- Detection comportementale plutot que signatures statiques seules.\n- Journalisation des appels reseau inhabituels vers API IA.\n- Formation utilisateurs sur apps inconnues et demandes de permissions.","integratedAt":"2026-05-23","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"risk.offensive","label":"Offensif / #ROUGE","parent":"risk"},{"id":"risk","label":"Risques","parent":null},{"id":"domain.osint","label":"OSINT","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"}]},{"id":"watch-agentsview-session-intelligence-md","title":"AgentsView - Session Intelligence","canonical":"","type":"Veille outils IA / intelligence de sessions agents.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#agents","#coding-agents","#session-intelligence","#local-first","#search","#analytics","#token-costs","#devtools","#sensitive"],"status":"sensible","path":"watch/agentsview-session-intelligence.md","github":"https://github.com/kenn-io/agentsview","summary":"AgentsView est une app desktop/web local-first pour parcourir, chercher et analyser les sessions d'agents IA de code. Elle indexe les fichiers de sessions locaux dans SQLite, fournit une recherche full-text, des tableaux de bord, des statistiques d'usage et des rapports de couts/tokens. Agents cites comme supportes ou visibles dans la documentation : Claude Code, Codex, Gemini, Copilot, Cursor, OpenCode, OpenHands, Amp, VS Code Copilot, Kiro, Warp et autres.","relations":[],"raw":"# AgentsView - Session Intelligence\n\n## Type\n\nVeille outils IA / intelligence de sessions agents.\n\n## Tags\n\n#agents, #coding-agents, #session-intelligence, #local-first, #search, #analytics, #token-costs, #devtools, #sensitive\n\n## Sources\n\n- Site : `https://www.agentsview.io/`\n- Repo : `https://github.com/kenn-io/agentsview`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `kenn-io/agentsview`\n- description : local-first session intelligence and analytics for coding agents\n- stars lus : 1087\n- forks lus : 139\n- licence : MIT\n- archived : false\n- dernier push lu : 2026-05-22\n\n## Resume court\n\nAgentsView est une app desktop/web local-first pour parcourir, chercher et analyser les sessions d'agents IA de code. Elle indexe les fichiers de sessions locaux dans SQLite, fournit une recherche full-text, des tableaux de bord, des statistiques d'usage et des rapports de couts/tokens.\n\nAgents cites comme supportes ou visibles dans la documentation : Claude Code, Codex, Gemini, Copilot, Cursor, OpenCode, OpenHands, Amp, VS Code Copilot, Kiro, Warp et autres.\n\n## Usage utile\n\n- Rechercher dans les anciennes sessions Codex/Claude/Cursor.\n- Retrouver une decision, une erreur ou un prompt sans relire manuellement les chats.\n- Mesurer couts/tokens et usage par agent/projet.\n- Alimenter KM avec des resumes de sessions, apres nettoyage privacy.\n- Comparer l'activite agents par projet.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Exposition de prompts | les sessions peuvent contenir secrets, chemins locaux, donnees personnelles ou contexte client | sensible |\n| Sync distante | PostgreSQL sync peut sortir les historiques du poste local | sensible |\n| Partage d'archives | import/export de chats peut diffuser images, prompts ou tool calls sensibles | sensible |\n| Monitoring humain | usage en equipe pouvant surveiller les pratiques individuelles sans consentement clair | sensible |\n\n## Garde-fous\n\n- Garder l'usage local-first par defaut.\n- Ne pas pousser la base SQLite, exports ou historiques bruts dans Git.\n- Nettoyer secrets, chemins personnels, noms et donnees sensibles avant toute fiche KM.\n- Activer la sync distante seulement avec consentement, auth et perimetre clair.\n- Ne jamais exposer l'interface au reseau sans authentification.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"domain.privacy","label":"Privacy","parent":"domain"},{"id":"capability.scraping","label":"Extraction web","parent":"capability"},{"id":"capability","label":"Capacites","parent":null},{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"risk.sensitive","label":"Sensible","parent":"risk"},{"id":"risk","label":"Risques","parent":null}]},{"id":"watch-ai-open-source-tools-inventory-md","title":"AI Open Source Tools Inventory","canonical":"","type":"Inventaire outils issu de veille X et sources web verifiees.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#ia","#open-source","#github","#tools","#devtools","#agents","#saas","#osint","#inventory"],"status":"a verifier","path":"watch/ai-open-source-tools-inventory.md","github":"https://github.com/calcom/cal.diy","summary":"# AI Open Source Tools Inventory ## Type Inventaire outils issu de veille X et sources web verifiees. ## Tags #ia, #open-source, #github, #tools, #devtools, #agents, #saas, #osint, #inventory ## Source Inventaire detaille extrait de : ## Resume Les posts X fournis ont bien ete indexes comme sources. Le chiffre precedent comptait les posts uniques, pas les outils cites dans ces posts. Bilan actuel : - 11 liens X fournis aujourd'hui. - 10 liens X uniques apres deduplication. - 44 outils nommes uniques extraits. - 2 d","relations":[],"raw":"# AI Open Source Tools Inventory\n\n## Type\n\nInventaire outils issu de veille X et sources web verifiees.\n\n## Tags\n\n#ia, #open-source, #github, #tools, #devtools, #agents, #saas, #osint, #inventory\n\n## Source\n\nInventaire detaille extrait de :\n\n## Resume\n\nLes posts X fournis ont bien ete indexes comme sources. Le chiffre precedent comptait les posts uniques, pas les outils cites dans ces posts.\n\nBilan actuel :\n\n- 11 liens X fournis aujourd'hui.\n- 10 liens X uniques apres deduplication.\n- 44 outils nommes uniques extraits.\n- 2 doublons outils identifies : `Cal.com`, `Vibe-Trading`.\n- 3 elements non detailles a verifier : liste Image OSINT 26 outils, repo Claude Code redirect non nomme, section vehicle search.\n\n## Outils nommes uniques\n\n| # | Outil | URL | Categorie | Source | Statut |\n| --- | --- | --- | --- | --- | --- |\n| 1 | Spacesuit | `https://spacesuit.lightmode.io/` | canvas / workspace | `spacesuit_app` | verifie HTTP 200 |\n| 2 | Cal.com | `https://github.com/calcom/cal.diy` | scheduling open source | `xiaoying_eth`, `exploraX_` | verifie GitHub, ancien `calcom/cal.com` redirige |\n| 3 | Plausible Analytics | `https://github.com/plausible/analytics` | analytics privacy-first | `xiaoying_eth` | verifie GitHub |\n| 4 | Ghost | `https://github.com/TryGhost/Ghost` | publication / newsletter | `xiaoying_eth` | verifie GitHub |\n| 5 | n8n | `https://github.com/n8n-io/n8n` | automation / workflows | `xiaoying_eth` | verifie GitHub |\n| 6 | Supabase | `https://github.com/supabase/supabase` | backend / database | `xiaoying_eth` | verifie GitHub |\n| 7 | Medusa | `https://github.com/medusajs/medusa` | ecommerce open source | `xiaoying_eth` | verifie GitHub |\n| 8 | AppFlowy | `https://github.com/AppFlowy-IO/AppFlowy` | workspace / Notion-like | `xiaoying_eth` | verifie GitHub |\n| 9 | Coolify | `https://github.com/coollabsio/coolify` | deployment / PaaS | `xiaoying_eth` | verifie GitHub |\n| 10 | Listmonk | `https://github.com/knadh/listmonk` | email / newsletter | `xiaoying_eth` | verifie GitHub |\n| 11 | Penpot | `https://github.com/penpot/penpot` | design / Figma-like | `xiaoying_eth` | verifie GitHub |\n| 12 | ViMax | `https://github.com/HKUDS/ViMax` | video IA / short film | `KanikaBK` | verifie GitHub via recherche web |\n| 13 | Pipecat | `https://github.com/pipecat-ai/pipecat` | real-time voice agents | `Sumanth_077` | verifie GitHub |\n| 14 | openscreen | `https://github.com/siddharthvaddem/openscreen` | screen recorder | `exploraX_` | verifie GitHub via recherche web |\n| 15 | voicebox | `https://github.com/jamiepine/voicebox` | local-first voice studio | `exploraX_` | verifie GitHub via recherche web |\n| 16 | openshorts | `https://github.com/mutonby/openshorts` | AI shorts / subtitles | `exploraX_` | verifie GitHub via recherche web |\n| 17 | freellmapi | `https://github.com/tashfeenahmed/freellmapi` | multi-provider LLM API | `exploraX_` | verifie GitHub via recherche web |\n| 18 | playwright-mcp | `https://github.com/microsoft/playwright-mcp` | browser automation MCP | `exploraX_` | verifie GitHub |\n| 19 | vibe-trading | `https://github.com/HKUDS/Vibe-Trading` | finance agent / trading | `exploraX_`, `DeepTechTR` | verifie GitHub, doublon fusionne, sensible |\n| 20 | whisper | `https://github.com/openai/whisper` | speech-to-text | `exploraX_` | verifie GitHub |\n| 21 | postiz | `https://github.com/gitroomhq/postiz-app` | social scheduler | `exploraX_` | verifie GitHub |\n| 22 | vaultwarden | `https://github.com/dani-garcia/vaultwarden` | password manager server | `exploraX_` | verifie GitHub |\n| 23 | ARGO | `https://github.com/xark-argo/argo` | local agent / RAG / MCP | `Fluyeporlaweb` | verifie GitHub via recherche web |\n| 24 | AutoHedge | `https://github.com/The-Swarm-Corporation/AutoHedge` | finance agent / trading | `DeepTechTR` | verifie GitHub, sensible |\n| 25 | Fincept Terminal | `https://github.com/Fincept-Corporation/FinceptTerminal` | finance terminal | `DeepTechTR` | verifie GitHub, sensible |\n| 26 | LibreChat | `https://github.com/danny-avila/LibreChat` | self-hosted chat UI | `DeepTechTR` | verifie GitHub, site `https://librechat.ai` redirige |\n| 27 | Open Higgsfield AI / Open Generative AI | `https://github.com/Anil-matcha/Open-Generative-AI` | local AI cinema studio | `DeepTechTR` | verifie GitHub |\n| 28 | Open-LLM-VTuber | `https://github.com/Open-LLM-VTuber/Open-LLM-VTuber` | AI companion / Live2D | `DeepTechTR` | verifie GitHub |\n| 29 | Claude Ads | `https://github.com/AgriciDaniel/claude-ads` | ads optimization skill | `DeepTechTR` | verifie GitHub |\n| 30 | Agentic Inbox | `https://github.com/cloudflare/agentic-inbox` | AI email client | `DeepTechTR` | verifie GitHub |\n| 31 | Camofox Browser | `https://github.com/jo-inc/camofox-browser` | headless browser / anti-detection | `DeepTechTR` | verifie GitHub, sensible |\n| 32 | Hyperframes | `https://github.com/heygen-com/hyperframes` | video rendering framework | `DeepTechTR` | verifie GitHub |\n| 33 | yt-dlp | `https://github.com/yt-dlp/yt-dlp` | media download / archiving | `nicos_ai` | verifie GitHub, sensible |\n| 34 | Ollama | `https://github.com/ollama/ollama` | local LLM runtime | `nicos_ai` | verifie GitHub |\n| 35 | Fooocus | `https://github.com/lllyasviel/Fooocus` | local image generation | `nicos_ai` | verifie GitHub, sensible |\n| 36 | PhotoGIMP | `https://github.com/Diolinux/PhotoGIMP` | GIMP Photoshop-like workflow | `nicos_ai` | verifie GitHub |\n| 37 | Open Design | `https://github.com/nexu-io/open-design` | AI/UI design workflow | `nicos_ai` | verifie GitHub |\n| 38 | Bitwarden Server | `https://github.com/bitwarden/server` | password manager server | `nicos_ai` | verifie GitHub, interne critique |\n| 39 | AgentsView | `https://github.com/kenn-io/agentsview` | session intelligence / analytics agents | `agentsview.io` | verifie GitHub, sensible |\n| 40 | NanoClaw | `https://github.com/nanocoai/nanoclaw` | personal AI agent / messaging / containers | `nanoclaw.dev` | verifie GitHub, sensible |\n| 41 | AutoResearchClaw | `https://github.com/aiming-lab/AutoResearchClaw` | autonomous research / papers / experiments | GitHub | verifie GitHub, sensible |\n| 42 | Awesome Free LLM APIs | `https://github.com/mnfst/awesome-free-llm-apis` | free LLM API providers / OpenAI-compatible endpoints | GitHub | verifie GitHub, sensible |\n| 43 | PentestGPT | `https://github.com/GreyDGL/PentestGPT` | autonomous penetration testing agent | Vibe Shit / pentestgpt.com | verifie GitHub, #ROUGE |\n| 44 | CC-GUI / MossX | `https://vibeshit.org/product/ccgui` | vibe coding editor / multi-engine AI dev panels | Vibe Shit / mossx.ai | a verifier, sensible |\n\n## Verification liens\n\nVerification effectuee le 2026-05-22.\n\n| Statut | Nombre | Note |\n| --- | --- | --- |\n| Verifies GitHub/API | 30 | Repos existants et accessibles via GitHub API |\n| Verifies HTTP/site | 2 | `Spacesuit`, `Voicebox` site officiel HTTP 200 ; Voicebox repo aussi verifie |\n| Corriges depuis recherche web | 6 | `ViMax`, `openscreen`, `voicebox`, `openshorts`, `freellmapi`, `ARGO` |\n| Sensibles | 5 | finance/trading, vehicle/OSINT, anti-detection |\n\nCorrections importantes :\n\n- `Cal.com` : le lien tweet `github.com/calcom/cal.com` resout via GitHub vers `github.com/calcom/cal.diy`.\n- `FreeLLMAPI` : deux repos trouves ; `tashfeenahmed/freellmapi` correspond au claim de popularite, `platoba/freellmapi` existe mais a 0 star au moment de la verification.\n- `LibreChat` : le tweet cite `librechat.ai`, le repo verifie est `danny-avila/LibreChat`.\n- `ARGO` : repo verifie `xark-argo/argo`.\n\n## Elements non indexes individuellement\n\n| Element | Pourquoi | Action |\n| --- | --- | --- |\n| 26 Image OSINT tools | le post lu annonce une liste mais ne donne pas les noms dans le texte extrait | ouvrir/media/source a verifier avant inventaire |\n| Claude Code redirect repo | le post lu ne donne pas le nom ni l'URL du repo dans le texte extrait | chercher le repo ou lire commentaires si disponible |\n| Vehicle Search Tools | le post pointe vers une section GitHub, pas une liste detaillee dans le tweet | verifier le repo source avant extraction |\n\n## Doublons fusionnes\n\n- `Cal.com` / `CalCom`.\n- `Vibe-Trading`.\n- Lien `sweexx9` fourni deux fois, compte une seule source.\n\n## Garde-fous\n\n- Les outils finance/trading ne sont pas des conseils financiers.\n- Les outils OSINT et vehicle search restent privacy-sensitive.\n- Les outils de redirection IA doivent etre audites avant usage : secrets, licences, conditions d'utilisation, exposition des prompts.\n- Les outils anti-detection doivent etre cadrés legalement et ethniquement avant tout usage.\n\n## Classification abus possible\n\n| Outil / famille | Usage utile | Usage abusif possible | Classement |\n| --- | --- | --- | --- |\n| Spacesuit, AppFlowy, Penpot | organisation, design, documentation | fuite de donnees si documents sensibles mal partages | interne |\n| Cal.com | scheduling, events, rendez-vous | collecte abusive de contacts, spam d'invitations | interne |\n| Plausible Analytics | analytics privacy-first | tracking sans consentement si mal configure | interne |\n| Ghost, Listmonk, Postiz | publication, newsletter, social scheduling | spam, manipulation sociale, diffusion non validee | interne |\n| n8n | automatisation workflows | automatisation de spam, scraping, exfiltration si connecteurs mal controles | #ROUGE si connecte a donnees sensibles |\n| Supabase, Medusa, Coolify | backend, ecommerce, deploy | fuite de donnees, mauvaise config auth/secrets | interne |\n| ViMax, OpenShorts, Hyperframes | creation video, demos | deepfake, usurpation, contenu trompeur | sensible ; #ROUGE seulement si usurpation/deepfake cible |\n| Pipecat, Voicebox, Whisper | agents vocaux, TTS/STT, transcription | clonage vocal non consenti, usurpation, enregistrement non consenti | sensible ; #ROUGE seulement si usurpation cible |\n| FreeLLMAPI, LibreChat, ARGO | routage LLM, chat self-hosted, agent local | fuite de prompts/secrets, contournement quotas/conditions, automatisation non surveillee | #ROUGE si secrets ou comptes tiers |\n| Playwright MCP | tests navigateur, QA | scraping abusif, actions automatisees non autorisees | #ROUGE si cible externe sans autorisation |\n| Vibe-Trading, AutoHedge, Fincept Terminal | recherche finance, simulation | conseil financier automatise, trading non supervise, pertes financieres | sensible finance |\n| Vaultwarden | hygiene secrets | coffre mal configure exposant secrets | interne critique |\n| Open-LLM-VTuber | avatar/compagnon IA | manipulation affective, captation de publics vulnerables | sensible |\n| Claude Ads | audit campagnes ads | manipulation publicitaire, contournement policies plateformes | sensible |\n| Agentic Inbox | tri email, brouillons | envoi non valide, fuite email, usurpation | sensible ; #ROUGE si envoi autonome abusif |\n| Camofox Browser | tests anti-bot legitimes | contournement detection, scraping furtif, abus plateformes | #ROUGE non diffusable |\n| Vehicle Search Tools | investigation autorisee | doxxing, stalking, identification de particuliers | #ROUGE non diffusable |\n| Image OSINT tools | verification images, threat intel | geolocalisation abusive, identification non consentie | #ROUGE non diffusable |\n| yt-dlp | archivage legitime, recuperation de contenus autorises | telechargement non autorise, violation copyright, contournement plateformes | sensible |\n| Ollama | IA locale privacy-first | execution non controlee, mauvaise hygiene prompts/secrets | interne |\n| Fooocus | generation image locale | images trompeuses, usurpation visuelle | sensible |\n| PhotoGIMP | design local | confusion marque/interface si redistribution trompeuse | interne |\n| Open Design | generation UI/design | copie de designs ou confusion avec outils proprietaires | interne |\n| Bitwarden Server | gestion secrets | mauvaise configuration exposant secrets | interne critique |\n\nRegle : `#ROUGE` = risque offensif direct, a connaitre pour defense et prevention, pas a diffuser comme tutoriel, pas d'exploitation operationnelle. `Sensible` = utile mais garde-fous forts selon contexte.\n\n## Prochaines actions\n\n1. Verifier les repos GitHub un par un.\n2. Ajouter URL repo officielle quand elle est confirmee.\n3. Transformer chaque outil utile en fiche individuelle si integration.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","parent":null},{"id":"lifecycle.inbox","label":"Inbox / veille","parent":"lifecycle"},{"id":"lifecycle","label":"Cycle de vie","parent":null},{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.osint","label":"OSINT","parent":"domain"}]},{"id":"watch-ai-open-source-tools-watch-md","title":"AI Open Source Tools Watch","canonical":"","type":"Veille IA transversale.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#ia","#open-source","#github","#devtools","#agents","#saas","#osint","#local-first","#privacy"],"status":"a verifier","path":"watch/ai-open-source-tools-watch.md","github":"","summary":"Lot de veille sur des outils IA et open source utiles pour remplacer des SaaS, construire des agents, travailler localement, faire de l'OSINT image, generer de la video ou documenter des alternatives privacy-first.","relations":[],"raw":"# AI Open Source Tools Watch\n\n## Type\n\nVeille IA transversale.\n\n## Tags\n\n#ia, #open-source, #github, #devtools, #agents, #saas, #osint, #local-first, #privacy\n\n## Source\n\nLot de posts X publics fourni le 2026-05-22.\n\nLecture effectuee via FxTwitter API publique, sans compte X.\n\n## Resume court\n\nLot de veille sur des outils IA et open source utiles pour remplacer des SaaS, construire des agents, travailler localement, faire de l'OSINT image, generer de la video ou documenter des alternatives privacy-first.\n\n## Sources lues\n\n| Date post | Auteur | URL | Sujet | Statut |\n| --- | --- | --- | --- | --- |\n| 2026-04-09 | `spacesuit_app` | `https://x.com/spacesuit_app/status/2042343866389442668` | Spacesuit, canvas/adaptive workspace multiplateforme | a verifier |\n| 2026-05-21 | `xiaoying_eth` | `https://x.com/xiaoying_eth/status/2057388194711368074` | Repos open source monetisables : Cal.com, Plausible, Ghost, n8n, Supabase, Medusa, AppFlowy, Coolify, Listmonk | a verifier |\n| 2026-05-21 | `KanikaBK` | `https://x.com/KanikaBK/status/2057446142150066607` | ViMax, outil open source pour transformer une idee en court film | a verifier |\n| 2026-05-21 | `Sumanth_077` | `https://x.com/Sumanth_077/status/2057458115323539734` | Pipecat, framework Python pour agents vocaux temps reel | a verifier |\n| 2026-05-21 | `exploraX_` | `https://x.com/exploraX_/status/2057460324349915497` | Repos gratuits remplacant des SaaS : screen recording, voice, shorts, LLM API, browser automation, scheduling, transcription, social scheduling, password vault | a verifier |\n| 2026-05-21 | `Fluyeporlaweb` | `https://x.com/Fluyeporlaweb/status/2057461670977372344` | ARGO, alternative locale/open source a Manus avec RAG, Ollama et MCP | a verifier |\n| 2026-05-21 | `DeepTechTR` | `https://x.com/DeepTechTR/status/2057512199912923177` | Repos IA GitHub puissants, surtout trading/agents financiers | a cadrer |\n| 2026-05-21 | `DailyDarkWeb` | `https://x.com/DailyDarkWeb/status/2057534159313096859` | Liste d'outils Image OSINT | sensible |\n| 2026-05-21 | `sweexx9` | `https://x.com/sweexx9/status/2057560520916414628` | Redirection Claude Code vers fournisseurs gratuits | a verifier |\n\n## Deduplication\n\n- 10 liens fournis.\n- 9 liens uniques.\n- Doublon retire : `https://x.com/sweexx9/status/2057560520916414628`.\n\n## Arbitrage\n\n| Element | Decision | Raison |\n| --- | --- | --- |\n| Alternatives SaaS open source | garder | utile pour veille outils et stacks economes |\n| Agents vocaux / Pipecat | garder | directement utile aux themes IA agents |\n| ARGO local-first | garder | privacy-first, local, RAG, MCP |\n| ViMax video IA | garder | potentiel creation media, a verifier |\n| Image OSINT | garder avec prudence | utile renseignement, mais sensible |\n| Trading agents | a cadrer | risques financiers, ne pas traiter comme recommandation |\n| Redirection Claude Code gratuite | a verifier | risque legal, securite, tokens, conditions d'usage |\n\n## Risques\n\n- Posts X promotionnels ou incomplets.\n- Claims GitHub/stars/prix a reverifier avant usage.\n- Outils financiers : ne pas utiliser comme conseil financier.\n- OSINT image : usage privacy-first, pas de doxxing, pas de surveillance abusive.\n- Redirection de trafic IA : verifier securite, licences, conditions d'utilisation, exposition de prompts et secrets.\n\n## Prochaines actions\n\n1. Verifier les repos GitHub cites avant integration.\n2. Extraire seulement les outils compatibles privacy-first.\n4. Creer une sous-fiche dediee si un outil devient actionnable.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"Agents IA","concepts":[{"id":"domain.ai","label":"IA","parent":"domain"},{"id":"domain","label":"Domaines","parent":null},{"id":"source.github","label":"GitHub","parent":"source"},{"id":"source","label":"Sources","parent":null},{"id":"domain.dev","label":"Developpement","parent":"domain"},{"id":"domain.ai.agents","label":"Agents IA","parent":"domain.ai"},{"id":"domain.osint","label":"OSINT","parent":"domain"},{"id":"domain.privacy","label":"Privacy","parent":"domain"}]},{"id":"watch-autoresearchclaw-autonomous-research-md","title":"AutoResearchClaw - Autonomous Research Agent","canonical":"","type":"Veille outils IA / agent de recherche autonome.","bucket":"watch","folder":"watch","folderLabel":"Watch","publishable":true,"shareable":true,"tags":["#research-agent","#autonomous-research","#papers","#citations","#experiments","#openclaw","#multi-agent","#scientific-writing","#sensitive"],"status":"sensible","path":"watch/autoresearchclaw-autonomous-research.md","github":"https://github.com/aiming-lab/AutoResearchClaw","summary":"AutoResearchClaw est un pipeline agentique qui transforme une idee de recherche en papier academique avec litterature, experiences, analyses, citations, LaTeX et revue multi-agent. Le projet supporte un mode autonome et des modes human-in-the-loop/co-pilot. Le README annonce une pipeline de recherche multi-etapes, recherche bibliographique via sources academiques, verification de citations, execution d'experiences en sandbox, generation de graphiques, revue multi-agent et integration OpenClaw / agents CLI compatibl","relations":[],"raw":"# AutoResearchClaw - Autonomous Research Agent\n\n## Type\n\nVeille outils IA / agent de recherche autonome.\n\n## Tags\n\n#research-agent, #autonomous-research, #papers, #citations, #experiments, #openclaw, #multi-agent, #scientific-writing, #sensitive\n\n## Sources\n\n- Repo : `https://github.com/aiming-lab/AutoResearchClaw`\n- Papier arXiv cite par le repo : `AutoResearchClaw: Self-Reinforcing Autonomous Research with Human-AI Collaboration`\n\nLecture : 2026-05-22\n\nVerification GitHub API :\n\n- repo : `aiming-lab/AutoResearchClaw`\n- description : fully autonomous and self-evolving research from idea to paper\n- stars lus : 12498\n- forks lus : 1463\n- licence : MIT\n- archived : false\n- dernier push lu : 2026-05-22\n\n## Resume court\n\nAutoResearchClaw est un pipeline agentique qui transforme une idee de recherche en papier academique avec litterature, experiences, analyses, citations, LaTeX et revue multi-agent. Le projet supporte un mode autonome et des modes human-in-the-loop/co-pilot.\n\nLe README annonce une pipeline de recherche multi-etapes, recherche bibliographique via sources academiques, verification de citations, execution d'experiences en sandbox, generation de graphiques, revue multi-agent et integration OpenClaw / agents CLI compatibles.\n\n## Usage utile\n\n- Prototyper des workflows de recherche scientifique assistes par IA.\n- Etudier une architecture agentique longue, versionnee et human-in-the-loop.\n- Tester des mecanismes anti-hallucination : verification de citations, coherence papier/preuves, revue multi-agent.\n- Evaluer des garde-fous pour agents autonomes.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Papiers non verifies | generation de contenu academique qui peut sembler credible sans validation humaine | sensible |\n| Citation laundering | produire une bibliographie ou des claims qui donnent une fausse autorite | sensible |\n| API keys | configuration de providers LLM et couts pouvant exposer secrets ou budgets | sensible |\n| Execution d'experiences | code genere et execute en sandbox, risques de dependances ou donnees non controlees | sensible |\n| Publication automatique | diffusion de papier, resultats ou claims sans revue humaine | sensible |\n\n## Garde-fous\n\n- Toujours garder un mode human-in-the-loop pour toute sortie publique.\n- Ne jamais publier un papier, claim ou resultat sans revue humaine et verification source.\n- Ne pas stocker de cles API en clair dans config, repo, logs ou artifacts.\n- Auditer les experiences generees avant execution hors sandbox.\n- Distinguer clairement brouillon IA, resultat verifie et publication.","integratedAt":"2026-05-22","theme":"agent","themeLabel":"A
