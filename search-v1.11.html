const KM_INDEX=[{"id":"watch-chat2pdf-convertissez-les-conversations-chatgpt-en-pdf-md","title":"Chat2PDF","canonical":"","type":"Veille Raindrop KM Monitor / export conversationnel ChatGPT vers PDF.","bucket":"watch","tags":["#chatgpt","#export","#pdf","#knowledge-management","#privacy-sensitive","#sensible"],"status":"sensible","path":"watch/chat2pdf-convertissez-les-conversations-chatgpt-en-pdf.md","github":"","summary":"Chat2PDF est un outil de conversion de conversations ChatGPT en PDF avec options de formatage et d'export. Le signal est utile pour archiver ou transmettre des conversations IA, mais implique une vigilance forte sur les donnees envoyees.","relations":[],"raw":"# Chat2PDF\n\n## Type\n\nVeille Raindrop KM Monitor / export conversationnel ChatGPT vers PDF.\n\n## Tags\n\n#chatgpt, #export, #pdf, #knowledge-management, #privacy-sensitive, #sensible\n\n## Sources\n\n- Source finale : `https://www.chat2pdf.org/fr`\n\nLecture KM : 2026-08-20\n\nSource Raindrop :\n\n- titre : `Chat2PDF - Convertissez les Conversations ChatGPT en PDF`\n- date : 2026-08-20T07:02:26.671Z\n- domaine : `chat2pdf.org`\n- auteur/source : `source-raindrop-anonymisee`\n- tags detectes : aucun tag Raindrop\n- note Raindrop : `Outil professionnel de conversion ChatGPT vers PDF. Convertissez vos conversations ChatGPT en PDF avec formatage personnalise et options d'export.`\n\n## Resume court\n\nChat2PDF est un outil de conversion de conversations ChatGPT en PDF avec options de formatage et d'export. Le signal est utile pour archiver ou transmettre des conversations IA, mais implique une vigilance forte sur les donnees envoyees.\n\n## Classification\n\n`sensible`\n\nRaison : l'outil traite potentiellement des conversations contenant prompts, donnees client, chemins locaux, secrets ou elements personnels. Pas de capacite offensive directe identifiee ; classement retenu : `sensible`.\n\n## Usage KM\n\n- Evaluer comme solution d'export lisible pour conversations IA a faible sensibilite.\n- Comparer avec exports locaux Markdown/PDF avant d'envoyer du contenu a un service tiers.\n- Utiliser seulement avec conversations nettoyees et sans secrets.\n\n## Risque d'abus possible\n\nExfiltration involontaire de prompts prives, donnees personnelles, instructions internes, historiques clients ou informations techniques sensibles dans un service externe.\n\n## Points a controler\n\n- Politique de retention et traitement des documents importes.\n- Mode d'import : fichier local, copier-coller, connexion compte ou extension.\n- Qualite de l'export, liens, metadonnees et suppression effective apres usage.","integratedAt":"2026-08-20","theme":"agent"},{"id":"watch-chatgpt-exporter-extract-chat-convos-easily-md","title":"ChatGPT Exporter","canonical":"","type":"Veille Raindrop KM Monitor / export conversations ChatGPT multi-format.","bucket":"watch","tags":["#chatgpt","#export","#pdf","#markdown","#json","#privacy-sensitive","#sensible"],"status":"sensible","path":"watch/chatgpt-exporter-extract-chat-convos-easily.md","github":"","summary":"ChatGPT Exporter propose d'extraire et sauvegarder des conversations ChatGPT en PDF, Markdown, texte, CSV, JSON ou image. Le signal est interessant pour archivage KM et migration de conversations, mais doit etre audite avant usage sur des donnees sensibles.","relations":[],"raw":"# ChatGPT Exporter\n\n## Type\n\nVeille Raindrop KM Monitor / export conversations ChatGPT multi-format.\n\n## Tags\n\n#chatgpt, #export, #pdf, #markdown, #json, #privacy-sensitive, #sensible\n\n## Sources\n\n- Source finale : `https://www.chatgptexporter.com/en`\n\nLecture KM : 2026-08-20\n\nSource Raindrop :\n\n- titre : `ChatGPT Exporter - Extract chat convos easily`\n- date : 2026-08-20T07:02:00.852Z\n- domaine : `chatgptexporter.com`\n- auteur/source : `source-raindrop-anonymisee`\n- tags detectes : aucun tag Raindrop\n- note Raindrop : `Extract and save ChatGPT conversations as PDF, Markdown, Text, CSV, JSON and Image for FREE. Download Chat GPT results to PDF. Easily convert ChatGPT to beautiful PDF.`\n\n## Resume court\n\nChatGPT Exporter propose d'extraire et sauvegarder des conversations ChatGPT en PDF, Markdown, texte, CSV, JSON ou image. Le signal est interessant pour archivage KM et migration de conversations, mais doit etre audite avant usage sur des donnees sensibles.\n\n## Classification\n\n`sensible`\n\nRaison : l'export multi-format peut contenir des donnees personnelles, prompts, contexte projet, secrets ou contenu proprietaire. Pas de capacite offensive directe identifiee ; classement retenu : `sensible`.\n\n## Usage KM\n\n- Tester comme piste d'export conversationnel pour archives KM nettoyees.\n- Privilegier un export local ou manuel si les conversations contiennent des informations sensibles.\n- Verifier les formats Markdown/JSON pour une eventuelle ingestion KM controlee.\n\n## Risque d'abus possible\n\nCopie massive d'historiques ChatGPT, fuite de conversations privees, conservation de donnees personnelles dans des exports partageables ou reutilisation non controlee de contenu tiers.\n\n## Points a controler\n\n- Fonctionnement exact : site web, extension, upload ou traitement local.\n- Conditions d'usage, retention, suppression et eventuelles limites gratuites.\n- Nettoyage automatique des secrets, emails, chemins et identifiants avant export.","integratedAt":"2026-08-20","theme":"agent"},{"id":"watch-geneva-ai-summit-2027-strategic-direction-md","title":"Geneva AI Summit 2027 Strategic Direction","canonical":"","type":"Strategic AI governance watch / public policy signal.","bucket":"watch","tags":["#ai-governance","#switzerland","#geneva","#ai-summit","#public-policy","#innovation","#trust"],"status":"sensible","path":"watch/geneva-ai-summit-2027-strategic-direction.md","github":"","summary":"Geneva AI Summit 2027 Strategic Direction is a KM watch item classified as Strategic AI governance watch / public policy signal. The final source is preserved in the fiche and must be verified befor ssions agents. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.\n\n## Usage utile\n\n- Rechercher dans les anciennes sessions Codex/Claude/Cursor.\n- Retrouver une decision, une erreur ou un prompt sans relire manuellement les chats.\n- Mesurer couts/tokens et usage par agent/projet.\n- Alimenter KM avec des resumes de sessions, apres nettoyage privacy.\n- Comparer l'activite agents par projet.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Exposition de prompts | les sessions peuvent contenir secrets, chemins locaux, donnees personnelles ou contexte client | sensible |\n| Sync distante | PostgreSQL sync peut sortir les historiques du poste local | sensible |\n| Partage d'archives | import/export de chats peut diffuser images, prompts ou tool calls sensibles | sensible |\n| Monitoring humain | usage en equipe pouvant surveiller les pratiques individuelles sans consentement clair | sensible |\n\n## Garde-fous\n\n- Garder l'usage local-first par defaut.\n- Ne pas pousser la base SQLite, exports ou historiques bruts dans Git.\n- Nettoyer secrets, chemins personnels, noms et donnees sensibles avant toute fiche KM.\n- Activer la sync distante seulement avec consentement, auth et perimetre clair.\n- Ne jamais exposer l'interface au reseau sans authentification.","integratedAt":"2026-05-22","theme":"dev"},{"id":"watch-ai-open-source-tools-inventory-md","title":"AI Open Source Tools Inventory","canonical":"","type":"Inventaire outils issu de veille X et sources web verifiees.","bucket":"watch","tags":["#ia","#open-source","#github","#tools","#devtools","#agents","#saas","#osint","#inventory"],"status":"a verifier","path":"watch/ai-open-source-tools-inventory.md","github":"https://github.com/calcom/cal.diy","summary":"# AI Open Source Tools Inventory ## Type Inventaire outils issu de veille X et sources web verifiees. ## Tags #ia, #open-source, #github, # uence | sensible |\n| Pression sociale | relancer trop souvent les personnes moins presentes | sensible |\n| Profilage social | inferer habitudes, groupes ou disponibilites | sensible ; #ROUGE si ciblage/stalking non consenti |\n\n## Fiche courte - Oh My Pizza!\n\n### Resume\n\nBlog personnel de Scott Yoshinaga avec archives, updates, posts culturels et notes pratiques. Source deja utile via l'article sur Twitter/X via RSS.\n\n### Patterns utiles\n\n- Curation personnelle claire.\n- Articles longs avec liens sortants.\n- Archive simple.\n- Melange culture, apps, musique et petites trouvailles web.\n- Bon modele de source de veille humaine, non algorithmique.\n\n### Liens projets\n\n- KM : source de veille et methode de curation.\n- Inspiration contenu : formats listes, favoris annuels, liens outils.\n\n### Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Surinterpretation | traiter un blog personnel comme source officielle | faible |\n| Copie de contenu | reprendre la curation ou le texte sans attribution | sensible |\n| Tracking culturel individuel | profiler les gouts d'une personne a partir de ses archives | sensible ; #ROUGE si harcelement/ciblage non consenti |\n\n### Garde-fous\n\n- Citer comme source personnelle.\n- Ne pas copier le wording ou les listes entieres.\n- Extraire des patterns et liens, pas l'identite personnelle.\n- Verifier les outils cites via sources primaires.\n\n## Prochaines actions\n\n1. Ajouter les prochaines references inspirantes dans ce fichier.\n2. Creer une fiche dediee seulement si une reference devient structurante.","integratedAt":"2026-05-22","theme":"agent"},{"id":"watch-nanoclaw-personal-agent-md","title":"NanoClaw - Personal AI Agent","canonical":"","type":"Veille outils IA / agent personnel multi-canaux.","bucket":"watch","tags":["#ai-agent","#personal-agent","#messaging","#containers","#claude-agent-sdk","#credential-vault","#local-first","#automation","#sensitive"],"status":"sensible"," data volatile, a reverifier avant decision produit ou execution locale.\n\n## Resume court\n\nPentestGPT - Autonomous Penetration Testing is a KM watch item classified as Veille `#ROUGE` / outil IA de pentest autonome. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.\n\n## Classification\n\n`#ROUGE`\n\nRaison : l'outil facilite directement des actions offensives operationnelles : reconnaissance, exploitation, post-exploitation et automatisation d'attack chains. A connaitre pour defense, audit, threat intelligence et comprehension du paysage, mais pas a diffuser comme guide d'usage.\n\n## Usage defensif legitime\n\n- Laboratoire interne, CTF, HackTheBox ou environnement explicitement autorise.\n- Evaluation defensive d'agents de pentest autonomes.\n- Etude des risques d'automatisation offensive par LLM.\n- Benchmark de garde-fous, detection, journalisation et containment.\n- Formation securite uniquement dans un cadre autorise et supervise.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Recon non autorisee | scan ou enumeration de cibles tierces | #ROUGE |\n| Exploitation | selection et execution de techniques d'exploitation | #ROUGE |\n| Privilege escalation | recherche de chemins d'elevation sur systemes compromis | #ROUGE |\n| Lateral movement | chainage d'actions apres acces initial | #ROUGE |\n| Abaissement de barriere | aide a des profils non qualifies pour conduire des attaques | #ROUGE |\n\n## Garde-fous\n\n- Ne pas fournir de commandes, payloads, procedures ou chaines d'exploitation.\n- Ne pas tester sur cible externe sans autorisation ecrite.\n- Ne pas connecter a des credentials, VPN, clouds ou reseaux reels sans cadrage.\n- Executer uniquement en lab isole si test local.\n- Journaliser objectif, perimetre, autorisation, cible, duree et responsable.","integratedAt":"2026-05-22","theme":"security"},{"id":"watch-red-team-risk-tools-watch-md","title":"Red Team Risk Tools Watch","canonical":"","type":"Veille outils sensibles #ROUGE.","bucket":"watch","tags":["#dual-use","#offensive-risk","#osint","#anti-detection","#privacy","#threat-intelligence"],"status":"#ROUGE","path":"watch/red-team-risk-tools-watch.md","github":"","summary":"Centraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger. #ROUGE signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.","relations":[],"raw":"# Red Team Risk Tools Watch\n\n## Type\n\nVeille outils sensibles `#ROUGE`.\n\n## Tags\n\n#rouge, #dual-use, #offensive-risk, #osint, #anti-detection, #privacy, #threat-intelligence\n\n## Role\n\nCentraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger.\n\n`#ROUGE` signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.\n\n## Regles #ROUGE\n\n- Recuperer les outils offensifs au lieu de les ignorer.\n- Les classer clairement `#ROUGE`.\n- Distinguer usage legitime defensif et usage abusif.\n- Ne pas fournir de mode d'emploi offensif.\n- Ne pas fournir de payload, procedure d'exploitation, contournement, ciblage ou automatisation abusive.\n- Ne pas stocker de donnees personnelles extraites par ces outils.\n- Ne pas integrer dans un projet sans cadrage explicite.\n\n## Outils / familles classes #ROUGE\n\nCritere strict : `#ROUGE` uniquement si l'outil facilite directement un usage offensif, furtif, intrusif ou d'abus a grande echelle.\n\n| Outil / famille | Usage defensif legitime | Usage abusif possible | Diffusion |\n| --- | --- | --- | --- |\n| Camofox Browser | tester detection bot sur ses propres services | contournement anti-bot, scraping furtif, fraude plateformes | #ROUGE non public |\n| Vehicle Search Tools | investigation autorisee, verification defensive | doxxing, stalking, identification de particuliers via plaques/VIN | #ROUGE non public |\n| Image OSINT tools | verification source image, threat intel, fact-checking | geolocalisation abusive, identification non consentie | #ROUGE non public |\n| Playwright MCP | tests QA, accessibilite, verification UI | automatisation d'actions non autorisees, scraping abusif | #ROUGE si cible externe |\n| n8n | automatisation interne | spam, exfiltration, scraping automatise | #ROUGE si connecteurs sensibles |\n| FreeLLMAPI / ARGO / LibreChat | self-host, privacy, experimentation controlee | fuite secrets, contournement conditions, agent non supervise | #ROUGE si secrets/comptes tiers |\n| PentestGPT | lab autorise, CTF, evaluation defensive d'agents de pentest | reconnaissance, exploitation, post-exploitation et privilege escalation non autorisees | #ROUGE non public |\n| PromptSpy / AI Android malware | threat intelligence, sensibilisation mobile, detection defensive | malware adaptatif, spyware Android, persistance et evasion mobile | #ROUGE non public |\n| CyberStrike | lab autorise, evaluation defensive d'agents de red team IA | automatisation de reconnaissance, pentest et chainage offensif | #ROUGE non public |\n| MalwareSourceCode | reverse engineering et detection en environnement isole | reutilisation, adaptation ou diffusion de code malware | #ROUGE non public |\n| GoSearch digital footprint | audit de sa propre exposition publique, sensibilisation privacy | doxxing, stalking, correlation de comptes et collecte de donnees personnelles | #ROUGE non public |\n| GhostTrack | audit de sa propre exposition publique, sensibilisation privacy | doxxing, stalking, correlation telephone/username/IP | #ROUGE non public |\n| Reverse Skill / hacker skills | threat intelligence, lab autorise, audit de skills agents | reverse non autorise, automatisation de taches offensives par agent | #ROUGE non public |\n| Serus dark web leak search | audit de ses propres comptes ou domaine autorise | recherche de donnees compromises, doxxing, credential abuse | #ROUGE non public |\n| IG-Detective Instagram OSINT | investigation autorisee et sensibilisation privacy | enumeration de contacts, geolocalisation, contournement et ciblage de profils | #ROUGE non public |\n| Aliens_eye AI OSINT | audit de sa propre exposition publique, veille privacy autorisee | correlation de comptes, doxxing, stalking et ciblage de personnes | #ROUGE non public |\n| Pentagi autonomous pentest agents | evaluation en lab isole et autorise, threat intelligence defensive | reconnaissance, exploitation et chainage de penetration testing non autorises | #ROUGE non public |\n\n## Sensible mais pas #ROUGE par defaut\n\n| Outil / famille | Pourquoi sensible | Classement |\n| --- | --- | --- |\n| Voicebox / Pipecat / Whisper | voix, transcription, consentement | sensible |\n| ViMax / OpenShorts / Hyperframes | generation media, risque deepfake selon contenu | sensible |\n| Agentic Inbox | email, validation humaine requise | sensible |\n| Claude Ads | manipulation publicitaire possible selon usage | sensible |\n| AutoHedge / Vibe-Trading / Fincept Terminal | risque financier | sensible finance |\n| Twitter RSS / Nitter / OpenRSS | veille publique pouvant deriver en surveillance | sensible |\n| Orbit / social planning | tracking relationnel possible si non consenti | sensible |\n\n## Garde-fous generaux\n\n- Usage uniquement autorise, defensif ou educatif.\n- Validation humaine obligatoire pour toute action externe.\n- Aucune diffusion publique de procedure offensive.\n- Aucune collecte de personnes privees.\n- Aucune execution sur cible tierce sans autorisation.\n- Journaliser les sources, pas les donnees sensibles.","integratedAt":"2026-05-22","theme":"security"},{"id":"watch-twitter-rss-monitoring-md","title":"Twitter RSS Monitoring","canonical":"","type":"Veille process / source monitoring.","bucket":"watch","tags":["#rss","#twitter","#x","#monitoring","#nitter","#openrss","#social-watch","#privacy"],"status":"sensible","path":"watch/twitter-rss-monitoring.md","github":"https://github.com/zedeus/nitter","summary":"Twitter RSS Monitoring is a KM watch item classified as Veille process / source monitoring. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.","relations":[],"raw":"# Twitter RSS Monitoring\n\n## Type\n\nVeille process / source monitoring.\n\n## Tags\n\n#rss, #twitter, #x, #monitoring, #nitter, #openrss, #social-watch, #privacy\n\n## Source\n\nArticle : `Keeping Up With Twitter Via RSS Feeds`\n\nURL : `https://ohmypizza.com/2023/04/keeping-up-with-twitter-via-rss`\n\nAuteur : Scott Yoshinaga\n\nDate source : 2023-04-20\n\nLecture KM : 2026-05-22\n\n## Metadata GitHub publique\n\nReleve API GitHub : 2026-08-21\n\n- repo : `zedeus/nitter`\n- URL : `https://github.com/zedeus/nitter`\n- description : Alternative Twitter front-end\n- licence : AGPL-3.0\n- etoiles relevees : 13467\n- topics releves : nim, privacy, self-hosted, twitter, x\n- derniere activite relevee : 2026-08-19T01:16:29Z\n- archived : non\n- fork : non\n\nNote : metadata volatile, a reverifier avant decision produit ou execution locale.\n\n## Resume court\n\nTwitter RSS Monitoring is a KM watch item classified as Veille process / source monitoring. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.\n\n## Outils cites\n\n| Outil | URL | Usage | Statut |\n| --- | --- | --- | --- |\n| Nitter | `https://nitter.net/<username>` | consulter un compte Twitter via interface alternative et recuperer un RSS | verifie partiel 2026-05-22, service/instances instables |\n| OpenRSS | `https://openrss.org/twitter.com/<username>` | generer un flux RSS depuis un compte Twitter public | verifie source officielle 2026-05-22 |\n\n## Nitter - verification officielle\n\nSources :\n\n- Instance : `https://nitter.net/`\n- Repo : `https://github.com/zedeus/nitter`\n\nVerification 2026-05-22 :\n\n- `https://nitter.net/` repond, mais la page chargee est minimale.\n- Repo GitHub verifie via GitHub API : `zedeus/nitter`.\n- Licence GitHub : AGPL-3.0.\n- Repo non archive au moment de la verification.\n- Dernier push lu via GitHub API : 2026-04-16.\n\nNotes de contexte :\n\n- Nitter est un frontend alternatif Twitter/X centre privacy/performance.\n- Le projet a connu une forte instabilite apres les changements d'acces de Twitter/X.\n- Plusieurs sources publiques indiquent que les instances et le RSS peuvent etre instables ou desactives selon les periodes.\n- A utiliser comme source de veille opportuniste, pas comme infrastructure fiable de production.\n\n## OpenRSS - verification officielle\n\nSource officielle : `https://openrss.org/`\n\nGuides / conditions lues :\n\n- `https://openrss.org/guides/how-to-use-an-open-rss-feed`\n- `https://openrss.org/terms`\n\nPoints verifies :\n\n- Page racine relue le 2026-05-22 depuis le lot fourni.\n- OpenRSS permet d'ajouter `openrss.org/` devant une URL pour obtenir un flux RSS quand la page est supportee.\n- Le service annonce des flux sans algorithmes de recommandation.\n- Le service indique retirer certains scripts, tracking links et contenus invasifs des flux.\n- OpenRSS est presente comme organisation nonprofit 501(c)(3).\n- Usage annonce : personnel, informatif, non commercial.\n- Les conditions demandent de limiter la frequence des requetes.\n- Les conditions interdisent l'usage illegal, le contournement de restrictions, l'acces a du contenu payant, l'espionnage, le harcelement et le monitoring de contenu non public.\n\n## Usage utile\n\n- Veille sobre sur comptes publics.\n- Centraliser des sources X dans un lecteur RSS.\n- Reduire l'exposition a l'interface addictive de X.\n- Surveiller les comptes source utiles pour KM sans connexion directe a X.\n- Alimenter une veille manuelle non intrusive.\n\n## Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Surveillance abusive | suivre systematiquement une personne sans cadre legitime | #ROUGE si cible personne privee |\n| Scraping agressif | multiplier flux et requetes au-dela d'une veille raisonnable | sensible ; #ROUGE si automatisation furtive ou massive |\n| Contournement plateforme | utiliser des services alternatifs pour contourner limites/API sans respecter conditions | sensible |\n| Profilage | croiser flux publics pour profiler une personne ou un groupe | sensible ; #ROUGE si ciblage individuel non consenti |\n\n## Garde-fous\n\n- Utiliser uniquement des comptes publics et pertinents pour la veille.\n- Ne pas suivre de personnes privees sans raison legitime.\n- Ne pas stocker donnees personnelles issues de flux.\n- Ne pas automatiser a grande echelle.\n- Respecter les limites des services tiers et les conditions applicables.\n- Preferer la veille thematique aux listes nominatives.\n- Usage OpenRSS : personnel, non commercial, frequence raisonnable.\n- Ne pas redistribuer les flux OpenRSS dans une app publique ou payante sans verifier les conditions.\n- Usage Nitter : limiter a une veille manuelle ou faible frequence ; ne pas dependra d'instances publiques pour un produit.","integratedAt":"2026-05-22","theme":"source"},{"id":"watch-vibeshit-vibe-coding-directory-md","title":"Vibe Shit - Vibe Coding Directory","canonical":"","type":"Veille outils IA / annuaire projets vibe coding.","bucket":"watch","tags":["#vibe-coding","#ai-tools","#agents","#llm","#devtools","#directory","#inspiration","#sensitive"],"status":"sensible","path":"watch/vibeshit-vibe-coding-directory.md","github":"","summary":"Vibe Shit - Vibe Coding Directory is a KM watch item classified as Veille outils IA / annuaire projets vibe coding. The final source is preserved in the fiche and must be verified before product use, public reuse or operational integration.","relations":[],"raw":"# Vibe Shit - Vibe Coding D ce Heat Tracker : `https://www.ngjoo.com/en/trending/`\n\n## Usage\n\nSuivre les projets open source IA en tendance : agents, skills, LLM, RAG, chat, multimodal, infrastructure et devtools.\n\n## Notes\n\n## Risques\n\n- Classements volatils.\n- Donnees externes a reverifier avant integration produit.\n- Ne pas transformer une tendance en decision sans cadrage.","integratedAt":"2026-05-19","theme":"agent"},{"id":"resources-RESOURCES-md","title":"Resources - NightIntel","canonical":"","type":"document","bucket":"document","tags":[],"status":"a verifier","path":"resources/RESOURCES.md","github":"","summary":"Index central des documents ressources utilises par les projets et themes NightIntel. Regle : les ressources gardent les sources lisibles et nommees de facon stable. Les projets et themes pointent vers ces ressources au lieu de multiplier les noms differents.","relations":[],"raw":"## Role\n\nRegle : les ressources gardent les sources lisibles et nommees de facon stable. Les projets et themes pointent vers ces ressources au lieu de multiplier les noms differents.\n\n## Nommage canonique\n\n- Dossiers : kebab-case.\n- Fichiers : kebab-case `.md`.\n- Nom court d'appel : `resource:<dossier>/<fichier-sans-extension>`.\n- Les anciens noms restent comme sources historiques, mais les nouveaux appels utilisent les noms canoniques.\n\n## Ressources NightCrawl\n\n| --- | --- | --- | --- |\n| `resource:nightcrawl/readme` | `nightcrawl/readme.md` | `NightCrawl/README.md` | Vue generale projet |\n| `resource:nightcrawl/product-synthesis` | `nightcrawl/product-synthesis.md` | `NightCrawl/NIGHTCRAWL_SYNTHESIS.md` | Synthese produit |\n| `resource:nightcrawl/bots-telegram-discord` | `nightcrawl/bots-telegram-discord.md` | `NightCrawl/BOT_TELEGRAM_DISCORD_SPEC.md` | Spec bots |\n\n## Ressources themes\n\n| --- | --- | --- |\n\n## Ressources design\n\n| --- | --- | --- | --- |\n| `resource:design/urgence-lol-standalone-charte` | `design/urgence-lol-standalone-charte.html` | fichier let activeId=KM_INDEX[0]?.id||"", topic="Tous", selected=new Set(), allFichesOpen=true;
const byId=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function toast(msg){const t=byId("toast");t.textContent=msg;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function statusClass(s){return s==="#ROUGE"?"hot":s==="a verifier"?"warn":s==="sensible"?"ai":""}
function statusRank(v){return {"#ROUGE":0,"a verifier":1,"sensible":2,"actif":3}[v]??4}
function dateRank(item){return Date.parse(item.integratedAt||"")||0}
function itemTerms(item){return norm([item.title,item.type,item.bucket,item.status,item.tags.join(" "),item.summary,item.raw].join(" "))}
function queryTerms(){return norm(byId("search").value).split(/\s+/).filter(Boolean)}
function matchesQuery(item,terms){if(!terms.length)return 1;const hay=itemTerms(item);for(const term of terms){if(!hay.includes(term))return 0}return 1}
function filteredItems(){const terms=queryTerms(), status=byId("statusFilter").value, tag=norm(byId("tagFilter").value), sort=byId("sort").value;let rows=KM_INDEX.filter(item=>matchesQuery(item,terms)>0);rows=rows.filter(item=>topic==="Tous"||item.bucket===topic);rows=rows.filter(item=>status==="all"||item.status===status);rows=rows.filter(item=>!tag||norm(item.tags.join(" ")).includes(tag)||norm(item.type).includes(tag)||norm(item.theme).includes(tag));rows.sort((a,b)=>sort==="title"?a.title.localeCompare(b.title):sort==="type"?a.theme.localeCompare(b.theme)||a.title.localeCompare(b.title):sort==="status"?statusRank(a.status)-statusRank(b.status)||a.title.localeCompare(b.title):dateRank(b)-dateRank(a)||a.title.localeCompare(b.title));return rows}
function activeItem(){return KM_INDEX.find(item=>item.id===activeId)||filteredItems()[0]||KM_INDEX[0]}
function highlight(text){let safe=esc(text);for(const term of queryTerms()){if(term.length<2)continue;safe=safe.replace(new RegExp(term.replace(/[.*+?^\$\{\}()|[\]\\]/g,"\\$&"),"ig"),m=>"<mark>"+m+"</mark>")}return safe}
function themeOfTag(tag,fallback){const text=norm(tag);if(/rouge|pentest|red|offensive|security/.test(text))return"security";if(/osint|threat|image|vehicle/.test(text))return"osint";if(/source|rss|x|twitter|monitor/.test(text))return"source";if(/github|code|dev|editor|coding/.test(text))return"dev";if(/llm|api|openai|provider/.test(text))return"llm";if(/agent|automation|ia|ai/.test(text))return"agent";if(/research|paper|citation/.test(text))return"research";if(/privacy|local|session|analytics/.test(text))return"privacy";if(/finance|trading/.test(text))return"finance";if(/directory|watch|inspiration|competitor|vibe/.test(text))return"watchlist";if(/media|video|voice|design/.test(text))return"media";return fallback||"tool"}
function inlineMd(text){const tick=String.fromCharCode(96);return esc(text).replace(new RegExp("(https?:\\/\\/[^\\s<]+)","g"),'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>').replace(new RegExp(tick+"([^"+tick+"]+)"+tick,"g"),"<code>$1</code>")}
function markdown(md){const lines=String(md||"").split("\n");let out="", inList=false, inTable=false;const close=()=>{if(inList){out+="</ul>";inList=false}if(inTable){out+="</tbody></table>";inTable=false}};for(const line of lines){if(/^\|(.+)\|$/.test(line)&&!/^\|\s*-/.test(line)){if(!inTable){close();out+="<table><tbody>";inTable=true}out+="<tr>"+line.slice(1,-1).split("|").map(c=>"<td>"+inlineMd(c.trim())+"</td>").join("")+"</tr>";continue}if(/^\|\s*-/.test(line))continue;if(inTable&&!/^\|/.test(line))close();if(/^###\s+/.test(line)){close();out+="<h3>"+inlineMd(line.replace(/^###\s+/,""))+"</h3>";continue}if(/^##\s+/.test(line)){close();out+="<h2>"+inlineMd(line.replace(/^##\s+/,""))+"</h2>";continue}if(/^#\s+/.test(line)){close();out+="<h1>"+inlineMd(line.replace(/^#\s+/,""))+"</h1>";continue}if(/^[-*]\s+/.test(line)){if(!inList){close();out+="<ul>";inList=true}out+="<li>"+inlineMd(line.replace(/^[-*]\s+/,""))+"</li>";continue}if(!line.trim()){close();continue}close();out+="<p>"+inlineMd(line)+"</p>"}close();return out}
function renderStats(){const red=KM_INDEX.filter(i=>i.status==="#ROUGE").length, sens=KM_INDEX.filter(i=>i.status==="sensible").length, ver=KM_INDEX.filter(i=>i.status==="a verifier").length, watch=KM_INDEX.filter(i=>i.bucket==="watch").length;byId("statsbar").innerHTML='<div class="stat"><span>Fiches</span><b>'+KM_INDEX.length+'</b></div><div class="stat"><span>Watch</span><b>'+watch+'</b></div><div class="stat"><span>#ROUGE</span><b>'+red+'</b></div><div class="stat"><span>Sensibles</span><b>'+sens+'</b></div><div class="stat"><span>A verifier</span><b>'+ver+'</b></div>'}
function renderTopics(){const buckets=[...new Set(KM_INDEX.map(i=>i.bucket))].filter(b=>!(b==="watch"&&KM_INDEX.every(i=>i.bucket==="watch")));const topics=["Tous",...buckets];byId("topics").innerHTML=topics.map(t=>'<button class="topic '+(t===topic?"active":"")+'" data-topic="'+esc(t)+'">'+esc(t)+'</button>').join("")}
function tagButton(label,cls){return '<button type="button" class="tag tag-btn '+esc(cls||"")+'" data-action="tag" data-tag="'+esc(label)+'">'+highlight(label)+'</button>'}
function sameTagTheme(tag,theme){const a=norm(tag).replace(/^#/,"").replace(/s$/,""),b=norm(theme).replace(/s$/,"");return a===b}
function inlineNoteHtml(item){return '<div class="inline-note"><div class="inline-head"><b>Fiche ouverte</b><button class="btn" data-action="collapse">Replier</button></div><div class="source-strip"><span>'+esc(item.integratedAt||"date n/a")+'</span><span>'+esc(item.path)+'</span>'+(item.github?'<a href="'+esc(item.github)+'" target="_blank" rel="noopener noreferrer">GitHub</a>':"")+'</div><p>'+esc(item.summary)+'</p><section class="detail-body">'+markdown(item.raw||"")+'</section></div>'}
function cardHtml(item){const active=item.id===activeId, sel=selected.has(item.id), showFiche=allFichesOpen||active;const tags=item.tags.filter(t=>norm(t)!=="#watch"&&norm(t)!=="watch"&&!sameTagTheme(t,item.theme)).slice(0,3);return '<article class="news-card '+(active?"active":"")+' '+(sel?"selected":"")+'" data-id="'+esc(item.id)+'"><div class="check" data-action="select" title="Selectionner"></div><div><div class="title-row"><h3 class="news-title" data-action="open">'+highlight(item.title)+'</h3></div><div class="meta">'+tagButton(item.status,statusClass(item.status))+tagButton("#"+item.theme,item.theme)+tags.map(t=>tagButton(t,themeOfTag(t,item.theme))).join("")+'</div>'+(showFiche?inlineNoteHtml(item):"")+'</div></article>'}
function renderFeed(){const rows=filteredItems();if(!rows.some(i=>i.id===activeId)&&rows[0])activeId=rows[0].id;const feedCount=byId("feedCount");if(feedCount)feedCount.textContent=rows.length+" resultats";byId("articleStatus").innerHTML="<span>"+rows.length+" fiches visibles</span><span>"+selected.size+" selectionnees</span>";byId("feed").innerHTML=rows.map(cardHtml).join("")||'<section class="note"><strong>Aucun resultat</strong><p>Vide la recherche ou change les filtres.</p></section>'}
function renderDetail(){const item=activeItem();if(!item)return;const gh=item.github?'<a href="'+esc(item.github)+'" target="_blank" rel="noopener noreferrer">GitHub</a>':"";byId("detail").innerHTML='<section class="detail-title"><span class="eyebrow">Fiche</span><div class="titleline"><h1>'+esc(item.title)+'</h1><div class="statusbox"><b>'+esc(item.status)+'</b><span>statut</span></div></div><div class="source-strip"><span>'+esc(item.integratedAt||"date n/a")+'</span><span>'+esc(item.path)+'</span>'+gh+'</div><p>'+esc(item.summary)+'</p><div class="detail-actions"><a class="btn dark" href="'+esc(item.path)+'" target="_blank" rel="noopener noreferrer">Ouvrir .md</a><button class="btn" id="copyActive">Copier MD</button><button class="btn" id="toggleFiche">Replier</button><button class="btn red" id="selectActive">Selection</button></div></section><section class="detail-body">'+markdown(item.raw||"")+'</section>'}
function itemMarkdown(item){return "## "+item.title+"\n\n- Statut: "+item.status+"\n- Type: "+item.type+"\n\n"+(item.raw||item.summary)+"\n"}
function exportMarkdown(items){const rows=items.length?items:[activeItem()];const chapter=rows.map(item=>"- "+item.title+" : "+(item.summary||"").replace(/\s+/g," ").trim()).join("\n");return "# KM Search v1.11 selection\n\n## Chapitrage\n\n"+chapter+"\n\n## Fiches\n\n"+rows.map(itemMarkdown).join("\n")}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function copy(text){await navigator.clipboard.writeText(text)}
function renderAll(){renderStats();renderTopics();byId("toggleAllFiches").textContent=allFichesOpen?"Masquer fiches":"Afficher fiches";renderFeed();renderDetail()}
document.addEventListener("click",e=>{if(e.target.id==="toggleFiche"){byId("workspace").classList.add("fiche-collapsed");byId("openFiche").classList.add("on");toast("Colonne repliee, fiche visible dans la liste");return}if(e.target.id==="openFiche"){byId("workspace").classList.remove("fiche-collapsed");byId("openFiche").classList.remove("on");toast("Colonne ouverte");return}const tagBtn=e.target.closest('[data-action="tag"]');if(tagBtn){byId("tagFilter").value=tagBtn.dataset.tag||"";renderAll();toast("Tag filtre: "+(tagBtn.dataset.tag||""));return}const topicBtn=e.target.closest(".topic");if(topicBtn){topic=topicBtn.dataset.topic;renderAll();return}const card=e.target.closest(".news-card");if(card&&e.target.dataset.action==="collapse"){if(activeId===card.dataset.id)activeId="";renderAll();return}if(card&&e.target.dataset.action==="select"){selected.has(card.dataset.id)?selected.delete(card.dataset.id):selected.add(card.dataset.id);renderAll();return}if(card&&e.target.dataset.action==="copy"){const item=KM_INDEX.find(i=>i.id===card.dataset.id);copy(itemMarkdown(item)).then(()=>toast("Fiche copiee"));return}if(card&&(e.target.dataset.action==="open"||!e.target.closest("a,button,.check"))){activeId=card.dataset.id;byId("workspace").classList.remove("fiche-collapsed");byId("openFiche").classList.remove("on");history.replaceState(null,"","#fiche="+activeId);renderAll();return}if(e.target.id==="copyActive"){copy(itemMarkdown(activeItem())).then(()=>toast("Fiche active copiee"));return}if(e.target.id==="selectActive"){const id=activeItem().id;selected.has(id)?selected.delete(id):selected.add(id);renderAll();return}});
byId("toggleAllFiches").onclick=()=>{allFichesOpen=!allFichesOpen;renderAll();toast(allFichesOpen?"Fiches affichees":"Fiches masquees")};
["search","sort","statusFilter","tagFilter"].forEach(id=>["input","change","search","keyup"].forEach(evt=>byId(id).addEventListener(evt,renderAll)));
byId("clearSearch").onclick=()=>{byId("search").value="";byId("tagFilter").value="";renderAll();byId("search").focus()};
byId("copySelection").onclick=()=>{const items=KM_INDEX.filter(i=>selected.has(i.id));copy(exportMarkdown(items)).then(()=>toast("Selection copiee"))};
