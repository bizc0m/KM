\n\nVeille inspirations / concurrents / outils.\n\n## Tags\n\n## Role\n\nCentraliser les sites inspirants, concurrents, references produit et outils potentiellement utiles aux projets.\n\nObjectif : veiller sans copier. Extraire les patterns utiles, les risques, les garde-fous et les opportunites d'integration.\n\n## Regles\n\n- Distinguer : inspiration, concurrent, outil utilisable, source technique.\n- Ajouter l'URL, la date de lecture, le role, les projets lies, les risques.\n- Ne pas copier l'identite visuelle ou le wording d'un concurrent.\n- Identifier l'usage abusif possible quand l'outil touche social, data, OSINT, IA, tracking ou automation.\n- Classer `#ROUGE` si l'outil peut servir a surveillance, scraping abusif, contournement, manipulation ou fuite de donnees.\n\n## Index veille\n\n| Nom | URL | Type | Projets lies | Usage utile | Risques | Statut |\n| --- | --- | --- | --- | --- | --- | --- |\n| Orbit | `https://weorbit.org/` | inspiration / concurrent social planning | NightLife, NightCrawl, Annecy Intel | coordination sorties, cercles, RSVP, nudges doux, privacy calendar | pression sociale, sur-notification, tracking relationnel | a suivre |\n\n## Fiche courte - Orbit\n\n### Resume\n\nOrbit aide des groupes d'amis a trouver des disponibilites communes via calendrier, cercles, nudges et RSVP.\n\n### Patterns utiles\n\n- Disponibilite calendrier sans partager les titres d'evenements.\n- Cercles sociaux par groupe/vibe.\n- Nudges automatiques mais limites.\n- RSVP simple.\n- Ton ludique sans culpabilisation.\n\n### Liens projets\n\n- NightLife : organiser sorties, groupes, RSVP, opt-in calendrier.\n- NightCrawl : cercles de veille / transmissions de groupe.\n- Annecy Intel : coordination locale et sorties.\n\n### Garde-fous\n\n- Geoloc/calendrier toujours opt-in.\n- Pas de score de popularite sociale.\n- Pas de penalite si refus ou absence.\n- Cadence de nudges explicite et configurable.\n- Pas de partage des titres d'evenements.\n\n### Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Tracking relationnel | mesurer qui voit qui et a quelle frequence | actif |\n| Pression sociale | relancer trop souvent les personnes moins presentes | actif |\n| Profilage social | inferer habitudes, groupes ou disponibilites | sensible ; #ROUGE si ciblage/stalking non consenti |\n\n## Fiche courte - Oh My Pizza!\n\n### Resume\n\nBlog personnel de Scott Yoshinaga avec archives, updates, posts culturels et notes pratiques. Source deja utile via l'article sur Twitter/X via RSS.\n\n### Patterns utiles\n\n- Curation personnelle claire.\n- Articles longs avec liens sortants.\n- Archive simple.\n- Melange culture, apps, musique et petites trouvailles web.\n- Bon modele de source de veille humaine, non algorithmique.\n\n### Liens projets\n\n- KM : source de veille et methode de curation.\n- Inspiration contenu : formats listes, favoris annuels, liens outils.\n\n### Usage abusif possible\n\n| Risque | Description | Classement |\n| --- | --- | --- |\n| Surinterpretation | traiter un blog personnel comme source officielle | faible |\n| Copie de contenu | reprendre la curation ou le texte sans attribution | actif |\n| Tracking culturel individuel | profiler les gouts d'une personne a partir de ses archives | sensible ; #ROUGE si harcelement/ciblage non consenti |\n\n### Garde-fous\n\n- Citer comme source personnelle.\n- Ne pas copier le wording ou les listes entieres.\n- Extraire des patterns et liens, pas l'identite personnelle.\n- Verifier les outils cites via sources primaires.\n\n## Prochaines actions\n\n1. Ajouter les prochaines references inspirantes dans ce fichier.\n2. Creer une fiche dediee seulement si une reference devient structurante.","integratedAt":"2026-05-22","theme":"agent"},{"id":"watch-nanoclaw-personal-agent-md","title":"NanoClaw - Personal AI Agent","canonical":"","type":"Veille outils IA / agent personnel multi-canaux.","bucket":"watch","tags":["#ai-agent","#personal-agent","#messagi "","type":"Veille outils sensibles #ROUGE.","bucket":"watch","tags":["#dual-use","#offensive-risk","#osint","#anti-detection","#privacy","#threat-intelligence"],"status":"#ROUGE","path":"watch/red-team-risk-tools-watch.md","github":"","githubTopics":[],"summary":"Centraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger. #ROUGE signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.","relations":[],"raw":"# Red Team Risk Tools Watch\n\n## Type\n\nVeille outils sensibles `#ROUGE`.\n\n## Tags\n\n#rouge, #dual-use, #offensive-risk, #osint, #anti-detection, #privacy, #threat-intelligence\n\n## Role\n\nCentraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger.\n\n`#ROUGE` signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.\n\n## Regles #ROUGE\n\n- Recuperer les outils offensifs au lieu de les ignorer.\n- Les classer clairement `#ROUGE`.\n- Distinguer usage legitime defensif et usage abusif.\n- Ne pas fournir de mode d'emploi offensif.\n- Ne pas fournir de payload, procedure d'exploitation, contournement, ciblage ou automatisation abusive.\n- Ne pas stocker de donnees personnelles extraites par ces outils.\n- Ne pas integrer dans un projet sans cadrage explicite.\n\n## Outils / familles classes #ROUGE\n\nCritere strict : `#ROUGE` uniquement si l'outil facilite directement un usage offensif, furtif, intrusif ou d'abus a grande echelle.\n\n| Outil / famille | Usage defensif legitime | Usage abusif possible | Diffusion |\n| --- | --- | --- | --- |\n| Camofox Browser | tester detection bot sur ses propres services | contournement anti-bot, scraping furtif, fraude plateformes | #ROUGE non public |\n| Vehicle Search Tools | investigation autorisee, verification defensive | doxxing, stalking, identification de particuliers via plaques/VIN | #ROUGE non public |\n| Image OSINT tools | verification source image, threat intel, fact-checking | geolocalisation abusive, identification non consentie | #ROUGE non public |\n| Playwright MCP | tests QA, accessibilite, verification UI | automatisation d'actions non autorisees, scraping abusif | #ROUGE si cible externe |\n| n8n | automatisation interne | spam, exfiltration, scraping automatise | #ROUGE si connecteurs sensibles |\n| FreeLLMAPI / ARGO / LibreChat | self-host, privacy, experimentation controlee | fuite secrets, contournement conditions, agent non supervise | #ROUGE si secrets/comptes tiers |\n| PentestGPT | lab autorise, CTF, evaluation defensive d'agents de pentest | reconnaissance, exploitation, post-exploitation et privilege escalation non autorisees | #ROUGE non public |\n| PromptSpy / AI Android malware | threat intelligence, sensibilisation mobile, detection defensive | malware adaptatif, spyware Android, persistance et evasion mobile | #ROUGE non public |\n| CyberStrike | lab autorise, evaluation defensive d'agents de red team IA | automatisation de reconnaissance, pentest et chainage offensif | #ROUGE non public |\n| MalwareSourceCode | reverse engineering et detection en environnement isole | reutilisation, adaptation ou diffusion de code malware | #ROUGE non public |\n| GoSearch digital footprint | audit de sa propre exposition publique, sensibilisation privacy | doxxing, stalking, correlation de comptes et collecte de donnees personnelles | #ROUGE non public |\n| GhostTrack | audit de sa propre exposition publique, sensibilisation privacy | doxxing, stalking, correlation telephone/username/IP | #ROUGE non public |\n| Reverse Skill / hacker skills | threat intelligence, lab autorise, audit de skills agents | reverse non autorise, automatisation de taches offensives par agent | #ROUGE non public |\n| Serus dark web leak search | audit de ses propres comptes ou domaine autorise | recherche de donnees compromises, doxxing, credential abuse | #ROUGE non public |\n| IG-Detective Instagram OSINT | investigation autorisee et sensibilisation privacy | enumeration de contacts, geolocalisation, contournement et ciblage de profils | #ROUGE non public |\n| Aliens_eye AI OSINT | audit de sa propre exposition publique, veille privacy autorisee | correlation de comptes, doxxing, stalking et ciblage de personnes | #ROUGE non public |\n| Pentagi autonomous pentest agents | evaluation en lab isole et autorise, threat intelligence defensive | reconnaissance, exploitation et chainage de penetration testing non autorises | #ROUGE non public |\n\n## A controler hors #ROUGE\n\n| Outil / famille | Point de vigilance | Classement |\n| --- | --- | --- |\n| Voicebox / Pipecat / Whisper | voix, transcription, consentement | actif |\n| ViMax / OpenShorts / Hyperframes | generation media, risque deepfake selon contenu | actif |\n| Agentic Inbox | email, validation humaine requise | actif |\n| Claude Ads | manipulation publicitaire possible selon usage | actif |\n| AutoHedge / Vibe-Trading / Fincept Terminal | risque financier | sensible finance |\n| Twitter RSS / Nitter / OpenRSS | veille publique pouvant deriver en surveillance | actif |\n| Orbit / social planning | tracking relationnel possible si non consenti | actif |","integratedAt":"2026-05-22","theme":"security"},{"id":"watch-twitter-rss-monitoring-md","title":"Twitter RSS Monitoring","canonical":"","type":"Veille process / source monitoring.","bucket":"watch","tags":["#rss","#twitter","#x","#monitoring","#nitter","#openrss","#social-watch","#privacy"],"status":"actif","path":"watch/twitter-rss-monitoring.md","github":"https://github.com/zedeus/nitter","githubTopics":["nim","privacy","self-hosted","twitter","x"],"summary":"Twitter RSS Monitoring est une fiche KM de veille Veille process / source monitoring. Source finale conservee dans la fiche.","relations":[],"raw":" eille opportuniste, pas comme infrastructure fiable de production.\n\n## OpenRSS - verification officielle\n\nSource officielle : `https://openrss.org/`\n\nGuides / conditions lues :\n\n- `https://openrss.org/guides/how-to-use-an-open-rss-feed`\n- `https://openrss.org/terms`\n\nPoints verifies :\n\n- Page racine relue le 2026-05-22 depuis le lot fourni.\n- OpenRSS permet d'ajouter `openrss.org/` devant une URL pour obtenir un flux RSS quand la page est supportee.\n- Le service annonce des flux sans algorithmes de recommandation.\n- Le service indique retirer certains scripts, tracking links et contenus invasifs des flux.\n- OpenRSS est presente comme organisation nonprofit 501(c)(3).\n- Usage annonce : personnel, informatif, non commercial.\n- Les conditions demandent de limiter la frequence des requetes.\n- Les conditions interdisent l'usage illegal, le contournement de restrictions, l'acces a du contenu payant, l'espionnage, le harcelement et le monitoring de contenu non public.\n\n## Usage utile\n\n- Veille sobre sur comptes publics.\n- Centraliser des sources X dans un lecteur RSS.\n- Reduire l'exposition a l'interface addictive de X.\n- Surveiller les comptes source utiles pour KM sans connexion directe a X.\n- Alimenter une veille manuelle non intrusive.","integratedAt":"2026-05-22","theme":"source"},{"id":"watch-vibeshit-vibe-coding-directory-md","title":"Vibe Shit - Vibe Coding Directory","canonical":"","type":"Veille outils IA / annuaire projets vibe coding.","bucket":"watch","tags":["#vibe-coding","#ai-tools","#agents","#llm","#devtools","#directory","#inspiration"],"status":"actif","path":"watch/vibeshit-vibe-coding-directory.md","github":"","githubTopics":[],"summary":"Vibe Shit - Vibe Coding Directory est une fiche KM de veille Veille outils IA / annuaire projets vibe coding. Source finale conservee dans la fiche.","relations":[],"raw":"# Vibe Shit - Vibe Coding Directory\n\n## Type\n\nVeille outils IA / annuaire projets vibe coding.\n\n## Tags\n\n#vibe function themeOfTag(tag,fallback){const text=norm(tag);if(/rouge|pentest|red|offensive|security/.test(text))return"security";if(/osint|threat|image|vehicle/.test(text))return"osint";if(/source|rss|x|twitter|monitor/.test(text))return"source";if(/github|code|dev|editor|coding/.test(text))return"dev";if(/llm|api|openai|provider/.test(text))return"llm";if(/agent|automation|ia|ai/.test(text))return"agent";if(/research|paper|citation/.test(text))return"research";if(/privacy|local|session|analytics/.test(text))return"privacy";if(/finance|trading/.test(text))return"finance";if(/directory|watch|inspiration|competitor|vibe/.test(text))return"watchlist";if(/media|video|voice|design/.test(text))return"media";return fallback||"tool"}

function markdown(md){const lines=String(md||"").split("\n");let out="", inList=false, inTable=false, tableHeaders=[];const close=()=>{if(inList){out+="</ul>";inList=false}if(inTable){out+="</tbody></table>";inTable=false;tableHeaders=[]}};for(const line of lines){if(/^\|(.+)\|$/.test(line)&&!/^\|\s*-/.test(line)){const cells=line.slice(1,-1).split("|").map(c=>c.trim());let isHeader=false;if(!inTable){close();tableHeaders=cells.map(c=>norm(c));out+="<table><tbody>";inTable=true;isHeader=true}out+="<tr>"+cells.map((c,i)=>"<td>"+(isHeader?inlineMd(c):inlineMdWithContext(c,/topics releves/.test(tableHeaders[i]||"")?"github-topic-list":""))+"</td>").join("")+"</tr>";continue}if(/^\|\s*-/.test(line))continue;if(inTable&&!/^\|/.test(line))close();if(/^###\s+/.test(line)){close();out+="<h3>"+inlineMd(line.replace(/^###\s+/,""))+"</h3>";continue}if(/^##\s+/.test(line)){close();out+="<h2>"+inlineMd(line.replace(/^##\s+/,""))+"</h2>";continue}if(/^#\s+/.test(line)){close();out+="<h1>"+inlineMd(line.replace(/^#\s+/,""))+"</h1>";continue}if(/^[-*]\s+/.test(line)){if(!inList){close();out+="<ul>";inList=true}out+="<li>"+inlineMdWithContext(line.replace(/^[-*]\s+/,""),"")+"</li>";continue}if(!line.trim()){close();continue}close();out+="<p>"+inlineMdWithContext(line,"")+"</p>"}close();return out}

function inlineNoteHtml(item){return '<div class="inline-note"><div class="inline-head"><b>Fiche ouverte</b><button class="btn" data-action="collapse">Replier</button></div><div class="source-strip"><span>'+esc(item.integratedAt||"date n/a")+'</span><span>'+esc(item.path)+'</span>'+(item.github?'<a href="'+esc(item.github)+'" target="_blank" rel="noopener noreferrer">GitHub</a>':"")+githubTopicChips(item,10)+'</div><p>'+esc(item.summary)+'</p><section class="detail-body">'+markdown(item.raw||"")+'</section></div>'}
function cardHtml(item){const active=item.id===activeId, sel=selected.has(item.id), showFiche=allFichesOpen||active;const tags=item.tags.filter(t=>norm(t)!=="#watch"&&norm(t)!=="watch"&&!sameTagTheme(t,item.theme)).slice(0,3);return '<article class="news-card '+(active?"active":"")+' '+(sel?"selected":"")+'" data-id="'+esc(item.id)+'"><div class="check" data-action="select" title="Selectionner"></div><div><div class="title-row"><h3 class="news-title" data-action="open">'+highlight(item.title)+'</h3></div><div class="meta">'+tagButton(item.status,statusClass(item.status))+tagButton("#"+item.theme,item.theme)+tags.map(t=>tagButton(t,themeOfTag(t,item.theme))).join("")+githubTopicChips(item,5)+'</div>'+(showFiche?inlineNoteHtml(item):"")+'</div></article>'}
function renderFeed(){const rows=filteredItems();if(!rows.some(i=>i.id===activeId)&&rows[0])activeId=rows[0].id;const feedCount=byId("feedCount");if(feedCount)feedCount.textContent=rows.length+" resultats";byId("articleStatus").innerHTML="<span>"+rows.length+" fiches visibles</span><span>"+selected.size+" selectionnees</span>";byId("feed").innerHTML=rows.map(cardHtml).join("")||'<section class="note"><strong>Aucun resultat</strong><p>Vide la recherche ou change les filtres.</p></section>'}
function renderDetail(){const item=activeItem();if(!item)return;const gh=item.github?'<a href="'+esc(item.github)+'" target="_blank" rel="noopener noreferrer">GitHub</a>':"";byId("detail").innerHTML='<section class="detail-title"><span class="eyebrow">Fiche</span><div class="titleline"><h1>'+esc(item.title)+'</h1><div class="statusbox"><b>'+esc(item.status)+'</b><span>statut</span></div></div><div class="source-strip"><span>'+esc(item.integratedAt||"date n/a")+'</span><span>'+esc(item.path)+'</span>'+gh+githubTopicChips(item,14)+'</div><p>'+esc(item.summary)+'</p><div class="detail-actions"><a class="btn dark" href="'+esc(item.path)+'" target="_blank" rel="noopener noreferrer">Ouvrir .md</a><button class="btn" id="copyActive">Copier MD</button><button class="btn" id="toggleFiche">Replier</button><button class="btn red" id="selectActive">Selection</button></div></section><section class="detail-body">'+markdown(item.raw||"")+'</section>'}
function itemMarkdown(item){return "## "+item.title+"\n\n- Statut: "+item.status+"\n- Type: "+item.type+"\n\n"+(item.raw||item.summary)+"\n"}
function exportMarkdown(items){const rows=items.length?items:[activeItem()];const chapter=rows.map(item=>"- "+item.title+" : "+(item.summary||"").replace(/\s+/g," ").trim()).join("\n");return "# KM Search v1.11 selection\n\n## Chapitrage\n\n"+chapter+"\n\n## Fiches\n\n"+rows.map(itemMarkdown).join("\n")}
function download(name,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function copy(text){await navigator.clipboard.writeText(text)}
function renderAll(){renderStats();renderTopics();byId("toggleAllFiches").textContent=allFichesOpen?"Masquer fiches":"Afficher fiches";renderFeed();renderDetail()}
document.addEventListener("click",e=>{if(e.target.id==="toggleFiche"){byId("workspace").classList.add("fiche-collapsed");byId("openFiche").classList.add("on");toast("Colonne repliee, fiche visible dans la liste");return}if(e.target.id==="openFiche"){byId("workspace").classList.remove("fiche-collapsed");byId("openFiche").classList.remove("on");toast("Colonne ouverte");return}const tagBtn=e.target.closest('[data-action="tag"]');if(tagBtn){byId("tagFilter").value=tagBtn.dataset.tag||"";renderAll();toast("Tag filtre: "+(tagBtn.dataset.tag||""));return}const topicBtn=e.target.closest(".topic");if(topicBtn){topic=topicBtn.dataset.topic;renderAll();return}const card=e.target.closest(".news-card");if(card&&e.target.dataset.action==="collapse"){if(activeId===card.dataset.id)activeId="";renderAll();return}if(card&&e.target.dataset.action==="select"){selected.has(card.dataset.id)?selected.delete(card.dataset.id):selected.add(card.dataset.id);renderAll();return}if(card&&e.target.dataset.action==="copy"){const item=KM_INDEX.find(i=>i.id===card.dataset.id);copy(itemMarkdown(item)).then(()=>toast("Fiche copiee"));return}if(card&&(e.target.dataset.action==="open"||!e.target.closest("a,button,.check"))){activeId=card.dataset.id;byId("workspace").classList.remove("fiche-collapsed");byId("openFiche").classList.remove("on");history.replaceState(null,"","#fiche="+activeId);renderAll();return}if(e.target.id==="copyActive"){copy(itemMarkdown(activeItem())).then(()=>toast("Fiche active copiee"));return}if(e.target.id==="selectActive"){const id=activeItem().id;selected.has(id)?selected.delete(id):selected.add(id);renderAll();return}});
byId("toggleAllFiches").onclick=()=>{allFichesOpen=!allFichesOpen;renderAll();toast(allFichesOpen?"Fiches affichees":"Fiches masquees")};
["search","sort","statusFilter","tagFilter"].forEach(id=>["input","change","search","keyup"].forEach(evt=>byId(id).addEventListener(evt,renderAll)));
byId("clearSearch").onclick=()=>{byId("search").value="";byId("tagFilter").value="";renderAll();byId("search").focus()};
byId("copySelection").onclick=()=>{const items=KM_INDEX.filter(i=>selected.has(i.id));copy(exportMarkdown(items)).then(()=>toast("Selection copiee"))};
byId("exportSelection").onclick=()=>{const items=KM_INDEX.filter(i=>selected.has(i.id));download("km-search-v1.11-selection.md",exportMarkdown(items))};
byId("exportJson").onclick=()=>download("km-search-v1.11-index.json",JSON.stringify(KM_INDEX,null,2));
const hash=new URLSearchParams(location.hash.replace(/^#/,""));if(hash.get("fiche")&&KM_INDEX.some(i=>i.id===hash.get("fiche")))activeId=hash.get("fiche");renderAll();
</script>
</body>
</html>
