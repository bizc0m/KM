tonomous and self evolving research from idea to paper stars lus : 12498 forks lus : 1463 licence : MIT archived : false dernier push lu : 2026 05 22 Resume court AutoResearchClaw est un pipeline agentique qui transforme une idee de recherche en papier academique avec litterature, experiences, analyses, citations, LaTeX et revue multi agent. Le projet supporte un mode autonome et des modes human in the loop/co pilot. Le README annonce une pipeline de recherche multi etapes, recherche bibliographique via sources academiques, verification de citations, execution d'experiences en sandbox, generation de graphiques, revue multi agent et integration OpenClaw / agents CLI compatibles. Usage utile Prototyper des workflows de recherche scientifique assistes par IA. Etudier une architecture agentique longue, versionnee et human in the loop. Tester des mecanismes anti hallucination : verification de citations, coherence papier/preuves, revue multi agent. Inspirer KM pour transformer une idee en dossier structure, avec decisions, preuves et rollback. Evaluer des garde fous pour agents autonomes. Usage abusif possible Risque Description Classement Papiers non verifies generation de contenu academique qui peut sembler credible sans validation humaine sensible Citation laundering produire une bibliographie ou des claims qui donnent une fausse autorite sensible API keys configuration de providers LLM et couts pouvant exposer secrets ou budgets sensible Execution d'experiences code genere et execute en sandbox, risques de dependances ou donnees non controlees sensible Publication automatique diffusion de papier, resultats ou claims sans revue humaine sensible Garde fous Toujours garder un mode human in the loop pour toute sortie publique. Ne jamais publier un papier, claim ou resultat sans revue humaine et verification source. Ne pas stocker de cles API en clair dans config, repo, logs ou artifacts. Auditer les experiences generees avant execution hors sandbox. Distinguer clairement brouillon IA, resultat verifie et publication. Journaliser topic, sources, hypotheses, decisions, couts et rollback. Relations watch:nanoclaw personal agent watch:agentsview session intelligence watch:vibeshit vibe coding directory watch:ai open source tools inventory process:ai tools theme:charte ia Fit projets Projet Fit Raison KM fort pipeline idee dossier verifie, avec historique et preuves PACTE IA fort utile pour comparer visions IA, audit et claims NightIntel moyen inspiration pour agents d'analyse, mais pas pour publication automatique outils internes fort architecture agentique longue, human in the loop et verification Decision KM Garder comme source prioritaire de veille agentique. Classification sensible, pas ROUGE par defaut. Devient ROUGE seulement si l'outil est utilise pour fabriquer ou diffuser volontairement des papiers, preuves, citations ou claims trompeurs. Changelog v0.1 2026 05 22 Objectif : integrer AutoResearchClaw comme agent de recherche autonome. Fichiers touches : watch/autoresearchclaw autonomous research.md, watch/index.md, index.md, watch/ai open source tools inventory.md, process/AI Tools.md, km/history.md. Risques : generation de claims scientifiques, couts API, execution d'experiences, citations et publication non verifiee. Rollback possible : supprimer cette fiche et retirer les lignes d'index."},{"title":"Awesome Free LLM APIs","canonical":"watch:awesome-free-llm-apis","type":"Veille outils IA / ressources API LLM gratuites.","tags":["llm","api","free tier","providers","inference","openai compatible","ai tools","sensitive"],"status":"sensible","path":"watch/awesome-free-llm-apis.md","github":"https://github.com/bizc0m/KM/blob/main/watch/awesome-free-llm-apis.md","summary":"Liste de fournisseurs LLM avec tiers gratuits permanents ou credits gratuits. Le README indique que les endpoints sont majoritairement compatibles avec le SDK OpenAI, sauf mention contraire, et pointe vers les pages de creation de cles API. Exemples visibles au moment de la lecture : AI21 Labs Aion Labs Alibaba Cloud Model Studio Cohere DeepSeek Google Gemini Mistral AI xAI Z AI Cerebras Cloudflare Workers AI GitHub ","body":"Awesome Free LLM APIs Type Veille outils IA / ressources API LLM gratuites. Tags llm, api, free tier, providers, inference, openai compatible, ai tools, sensitive Appel canonique watch:awesome free llm apis Sources Repo : https://github.com/mnfst/awesome free llm apis Lecture : 2026 05 22 Verification GitHub API : repo : mnfst/awesome free llm apis description : list of permanent free LLM API keys stars lus : 4477 forks lus : 430 licence : CC0 1.0 archived : false dernier push lu : 2026 05 22 Resume court Liste de fournisseurs LLM avec tiers gratuits permanents ou credits gratuits. Le README indique que les endpoints sont majoritairement compatibles avec le SDK OpenAI, sauf mention contraire, et pointe vers les pages de creation de cles API. Exemples visibles au moment de la lecture : AI21 Labs Aion Labs Alibaba Cloud Model Studio Cohere DeepSeek Google Gemini Mistral AI xAI Z AI Cerebras Cloudflare Workers AI GitHub Models Groq Hugging Face Kilo Code Usage utile Comparer providers LLM gratuits ou trial. Identifier les bases URL OpenAI compatible. Prototyper sans exposer une cle principale. Alimenter un routeur LLM interne avec limites documentees. Croiser avec watch:free llm api resources. Usage abusif possible Risque Description Classement Abuse quotas creation de comptes ou automatisation pour contourner les limites sensible ; ROUGE si abus organise Donnees sensibles envoi de secrets, prompts prives ou donnees personnelles a des providers tiers sensible Terms mismatch usage commercial ou production alors que le free tier l'interdit sensible Provider volatile limites, regions, prix et politiques data peuvent changer vite sensible Key leakage cles API copiees dans repo, logs ou prompts sensible critique Garde fous Verifier chaque provider a la source officielle avant usage. Ne jamais stocker de cle API en clair. Documenter region, limite, cout reel, politique data et usage autorise. Ne pas contourner quotas, paywalls ou conditions commerciales. Preferer comptes/projets separes pour prototypes. Ne pas envoyer de donnees personnelles ou confidentielles a un provider gratuit non audite. Relations watch:free llm api resources watch:ai open source tools inventory watch:red team risk tools watch process:ai tools Decision KM Garder comme source sœur de watch:free llm api resources. Classification sensible, pas ROUGE par defaut. Devient ROUGE seulement en cas d'abus de quotas, contournement de conditions, collecte non legitime de cles ou usage de providers non autorises. Changelog v0.1 2026 05 22 Objectif : integrer mnfst/awesome free llm apis. Fichiers touches : watch/awesome free llm apis.md, watch/index.md, index.md, watch/ai open source tools inventory.md, process/AI Tools.md, km/history.md. Risques : providers variables, conditions d'usage, cles API, donnees envoyees a tiers. Rollback possible : supprimer cette fiche et retirer les lignes d'index. v0.2 2026 05 22 Objectif : confirmer que le lien du nouveau lot est un doublon deja indexe. Fichiers touches : watch/awesome free llm apis.md, km/history.md. Risques : aucun changement fonctionnel. Rollback possible : retirer ce changelog."},{"title":"CC-GUI / MossX - VibeCoding Editor","canonical":"watch:ccgui-mossx-vibecoding-editor","type":"Veille outils IA / editeur vibe coding multi engine.","tags":["vibe coding","ai editor","developer tools","claude code","codex","opencode","gemini","multi engine","sensitive","to verify"],"status":"a verifier","path":"watch/ccgui-mossx-vibecoding-editor.md","github":"https://github.com/bizc0m/KM/blob/main/watch/ccgui-mossx-vibecoding-editor.md","summary":"CC GUI / MossX est presente comme un editeur/portail vibe coding open source multi engine, proche d'une alternative Cursor. La page Vibe Shit cite Claude Code, Codex, OpenCode et Gemini, avec panels developpeur : chat canvas, terminal, gestion Git, kanban et memoire IA.","body":"CC GUI / MossX VibeCoding Editor Type Veille outils IA / editeur vibe coding multi engine. Tags vibe coding, ai editor, developer tools, claude code, codex, opencode, gemini, multi engine, sensitive, to verify Appel canonique watch:ccgui mossx vibecoding editor Sources Page Vibe Shit : https://vibeshit.org/product/ccgui Site associe : https://www.mossx.ai/ Lecture : 2026 05 22 Statut verification a verifier La page Vibe Shit annonce un lien GitHub et un auteur zhukunpenglinyutong, mais le repo visible n'a pas ete confirme via GitHub API au moment de la verification. Le site MossX est lisible et presente un portail vibe coding open source avec support Claude Code, Codex, Cursor/VSCode, AI workflows, MCP Market et Skills Market. Resume court CC GUI / MossX est presente comme un editeur/portail vibe coding open source multi engine, proche d'une alternative Cursor. La page Vibe Shit cite Claude Code, Codex, OpenCode et Gemini, avec panels developpeur : chat canvas, terminal, gestion Git, kanban et memoire IA. Usage utile Comparer les interfaces AI coding : Cursor, Claude Code GUI, Codex, OpenCode, Gemini. Surveiller les patterns UI pour agents de code : terminal, git, kanban, memoire, workflows. Inspirer des outils internes de pilotage agents et revue de plans. Identifier les risques d'integration multi provider et multi agent dans un IDE. Usage abusif possible Risque Description Classement Code disclosure envoyer code prive ou prompts sensibles a des providers non verifies sensible Key leakage stocker cles API / tokens dans config, logs ou plugins sensible critique Tool execution laisser un agent modifier fichiers, git ou terminal sans validation sensible Supply chain installer plugins, MCP ou skills non audites sensible False authority UI professionnelle pouvant masquer des claims non verifies sensible Garde fous Verifier repo, licence, permissions et modele de securite avant usage. Ne pas ouvrir de repo sensible dans un editeur non audite. Ne pas stocker secrets en clair dans l'outil. Desactiver execution terminal/git automatique sans validation humaine. Tester uniquement sur repo sandbox avant integration. Auditer MCP, skills et plugins ajoutes. Relations watch:vibeshit vibe coding directory watch:agentsview session intelligence watch:nanoclaw personal agent watch:ai open source tools inventory process:ai tools theme:charte ia Decision KM Garder en veille sensible avec statut a verifier. Pas ROUGE par defaut, car l'usage annonce est developpeur/IDE. Devient ROUGE seulement si l'outil facilite execution non autorisee, exfiltration de code/secrets ou installation de composants malveillants. Changelog v0.1 2026 05 22 Objectif : integrer ccgui depuis Vibe Shit comme editeur vibe coding multi engine. Fichiers touches : watch/ccgui mossx vibecoding editor.md, watch/index.md, index.md, watch/ai open source tools inventory.md, process/AI Tools.md, km/history.md. Risques : repo GitHub non confirme, plugins/MCP/skills a auditer. Rollback possible : supprimer cette fiche et retirer les lignes d'index."},{"title":"CodePatrol - Code Security Watch","canonical":"watch:codepatrol-code-security","type":"Veille outils dev/security / code review et SAST.","tags":["code security","sast","code review","vulnerability scanning","appsec","devtools","sensitive","to verify"],"status":"a verifier","path":"watch/codepatrol-code-security.md","github":"https://github.com/bizc0m/KM/blob/main/watch/codepatrol-code-security.md","summary":"CodePatrol semble designer une famille/outillage de code security : revue automatisee, SAST, scan de vulnerabilites, alerting et consolidation de resultats. L'URL exacte fournie doit etre re verifiee avant integration technique ou recommandation.","body":"CodePatrol Code Security Watch Type Veille outils dev/security / code review et SAST. Tags code security, sast, code review, vulnerability scanning, appsec, devtools, sensitive, to verify Appel canonique watch:codepatrol code security Sources URL fournie : https://codepatrol 2.polsia.app/ Source secondaire trouvee : https://sourceforge.net/software/product/CodePatrol/ Lecture : 2026 05 22 Statut verification a verifier L'URL fournie n'a pas donne de contenu exploitable dans la lecture actuelle. Les resultats publics associent le nom CodePatrol a un outil de revue de code automatisee orientee securite, SAST, scan de vulnerabilites et agregation de resultats. Resume court CodePatrol semble designer une famille/outillage de code security : revue automatisee, SAST, scan de vulnerabilites, alerting et consolidation de resultats. L'URL exacte fournie doit etre re verifiee avant integration technique ou recommandation. Usage utile Surveiller les outils SAST et code review securite. Comparer avec CodeQL, Semgrep, Checkmarx, Veracode, Codacy ou plateformes AI native AppSec. Inspirer un flux KM de verification de projets : secrets, vulnerabilites, dependances, IaC, qualite code. Relier aux guardrails agents avant execution ou publication de code. Usage abusif possible Risque Description Classement Upload code prive envoyer un repo sensible vers un SaaS non verifie sensible critique Secrets exposure scan d'un repo contenant tokens, credentials ou donnees client sensible critique False confidence croire qu'un scan SAST remplace audit humain ou tests dynamiques sensible Supply chain installer un outil ou plugin non verifie dans CI/CD sensible Garde fous Ne pas connecter de repo prive avant verification du fournisseur, des conditions et du traitement des donnees. Scanner localement ou sur repo test quand possible. Ne jamais uploader secrets, .env, dumps, logs ou donnees personnelles. Verifier provenance, integrations, permissions GitHub/GitLab et politique de retention. Traiter les resultats comme signal, pas comme preuve absolue. Relations watch:ai open source tools inventory watch:red team risk tools watch process:ai tools theme:charte ia Decision KM Garder en veille sensible avec statut a verifier. Pas ROUGE par defaut car l'usage principal est defensif/code security. Devient ROUGE seulement si l'outil sert a exfiltrer du code, collecter secrets ou scanner des repos sans autorisation. Changelog v0.1 2026 05 22 Objectif : integrer l'URL codepatrol 2.polsia.app en veille code security. Fichiers touches : watch/codepatrol code security.md, watch/index.md, index.md, process/AI Tools.md, km/history.md. Risques : source directe non exploitable, confusion possible avec autres produits CodePatrol. Rollback possible : supprimer cette fiche et retirer les lignes d'index."},{"title":"Free LLM API Resources","canonical":"watch:free-llm-api-resources","type":"Veille outils IA / ressources API.","tags":["llm","api","free tier","inference","providers","ai tools","sensitive"],"status":"sensible","path":"watch/free-llm-api-resources.md","github":"https://github.com/bizc0m/KM/blob/main/watch/free-llm-api-resources.md","summary":"Liste maintenue de fournisseurs donnant un acces gratuit ou des credits d'essai pour inference LLM via API. Le README precise : ne pas abuser des services ; les services non legitimes, par exemple reverse engineering de chatbots existants, sont explicitement exclus.","body":"Free LLM API Resources Type Veille outils IA / ressources API. Tags llm, api, free tier, inference, providers, ai tools, sensitive Appel canonique watch:free llm api resources Source Repo : https://github.com/cheahjs/free llm api resources Auteur repo : cheahjs Lecture : 2026 05 22 Verification GitHub API : repo : cheahjs/free llm api resources description : list of free LLM inference resources accessible via API stars lus : 22013 forks lus : 2246 licence : NOASSERTION archived : false dernier push lu : 2026 05 22 Resume court Liste maintenue de fournisseurs donnant un acces gratuit ou des credits d'essai pour inference LLM via API. Le README precise : ne pas abuser des services ; les services non legitimes, par exemple reverse engineering de chatbots existants, sont explicitement exclus. Fournisseurs principaux cites Free providers OpenRouter Google AI Studio NVIDIA NIM Mistral La Plateforme Mistral Codestral HuggingFace Inference Providers Vercel AI Gateway OpenCode Zen Cerebras Groq Cohere GitHub Models Cloudflare Workers AI Providers avec credits d'essai Fireworks Baseten Nebius Novita AI21 Upstage NLP Cloud Alibaba Cloud Model Studio Modal Inference.net Hyperbolic SambaNova Cloud Scaleway Generative APIs Usage utile Comparer les fournisseurs LLM gratuits ou trial. Prototyper sans exposer de cle principale. Identifier des alternatives temporaires pour tests. Alimenter process:ai tools. Completer watch:ai open source tools inventory. Usage abusif possible Risque Description Classement Abuse quotas multiplier comptes/requetes pour contourner les limites sensible ; ROUGE si automatisation abusive Fuite donnees envoyer secrets, donnees privees ou prompts sensibles a des providers gratuits sensible Terms bypass utiliser des routes gratuites pour contourner conditions commerciales sensible Non legitimate providers utiliser services reverse engineeres ou non autorises ROUGE Garde fous Respecter limites et conditions de chaque fournisseur. Ne pas envoyer secrets, tokens, donnees personnelles ou prompts confidentiels. Verifier la politique d'entrainement des donnees. Ne pas automatiser de contournement de quotas. Preferer fournisseurs officiels et documentes. Documenter provider, modele, limites, usage et cout reel avant integration. Relations watch:ai open source tools inventory watch:red team risk tools watch process:ai tools process:km auto operating prompt v1.0 Decision KM Garder comme ressource utile et sensible. Pas ROUGE par defaut car la source exclut les providers non legitimes et demande de ne pas abuser. Changelog v0.1 2026 05 22 Objectif : integrer le repo cheahjs/free llm api resources. Fichiers touches : watch/free llm api resources.md, watch/index.md, index.md, km/history.md. Risques : limites/providers variables, donnees envoyees a tiers. Rollback possible : supprimer cette fiche et retirer les lignes d'index. v0.2 2026 05 22 Objectif : confirmer que le lien du nouveau lot est un doublon deja indexe. Fichiers touches : watch/free llm api resources.md, km/history.md. Risques : aucun changement fonctionnel. Rollback possible : retirer ce changelog."},{"title":"Inspiration Competitors Tools Watch","canonical":"watch:inspiration-competitors-tools","type":"Veille inspirations / concurrents / outils.","tags":["inspiration","competitors","tools","product watch","social planning","nightintel","privacy"],"status":"sensible","path":"watch/inspiration-competitors-tools-watch.md","github":"https://github.com/bizc0m/KM/blob/main/watch/inspiration-competitors-tools-watch.md","summary":"Centraliser les sites inspirants, concurrents, references produit et outils potentiellement utiles aux projets. Objectif : veiller sans copier. Extraire les patterns utiles, les risques, les garde fous et les opportunites d'integration.","body":"Inspiration Competitors Tools Watch Type Veille inspirations / concurrents / outils. Tags inspiration, competitors, tools, product watch, social planning, nightintel, privacy Appel canonique watch:inspiration competitors tools Role Centraliser les sites inspirants, concurrents, references produit et outils potentiellement utiles aux projets. Objectif : veiller sans copier. Extraire les patterns utiles, les risques, les garde fous et les opportunites d'integration. Regles Distinguer : inspiration, concurrent, outil utilisable, source technique. Ajouter l'URL, la date de lecture, le role, les projets lies, les risques. Ne pas copier l'identite visuelle ou le wording d'un concurrent. Identifier l'usage abusif possible quand l'outil touche social, data, OSINT, IA, tracking ou automation. Classer ROUGE si l'outil peut servir a surveillance, scraping abusif, contournement, manipulation ou fuite de donnees. Index veille Nom URL Type Projets lies Usage utile Risques Statut Orbit https://weorbit.org/ inspiration / concurrent social planning NightLife, NightCrawl, Annecy Intel coordination sorties, cercles, RSVP, nudges doux, privacy calendar pression sociale, sur notification, tracking relationnel a suivre Oh My Pizza! https://ohmypizza.com/ inspiration / source veille personnelle KM, Night Intel, NightLife veille culturelle, curation apps/musique/tech, patterns blog personnel source personnelle, a ne pas traiter comme reference officielle a suivre Fiche courte Orbit Resume Orbit aide des groupes d'amis a trouver des disponibilites communes via calendrier, cercles, nudges et RSVP. Patterns utiles Disponibilite calendrier sans partager les titres d'evenements. Cercles sociaux par groupe/vibe. Nudges automatiques mais limites. RSVP simple. Ton ludique sans culpabilisation. Liens projets NightLife : organiser sorties, groupes, RSVP, opt in calendrier. NightCrawl : cercles de veille / transmissions de groupe. Annecy Intel : coordination locale et sorties. Garde fous Geoloc/calendrier toujours opt in. Pas de score de popularite sociale. Pas de penalite si refus ou absence. Cadence de nudges explicite et configurable. Pas de partage des titres d'evenements. Usage abusif possible Risque Description Classement Tracking relationnel mesurer qui voit qui et a quelle frequence sensible Pression sociale relancer trop souvent les personnes moins presentes sensible Profilage social inferer habitudes, groupes ou disponibilites sensible ; ROUGE si ciblage/stalking non consenti Fiche courte Oh My Pizza! Resume Blog personnel de Scott Yoshinaga avec archives, updates, posts culturels et notes pratiques. Source deja utile via l'article sur Twitter/X via RSS. Patterns utiles Curation personnelle claire. Articles longs avec liens sortants. Archive simple. Melange culture, apps, musique et petites trouvailles web. Bon modele de source de veille humaine, non algorithmique. Liens projets KM : source de veille et methode de curation. Night Intel / NightLife : veille culturelle et signaux faibles. Inspiration contenu : formats listes, favoris annuels, liens outils. Usage abusif possible Risque Description Classement Surinterpretation traiter un blog personnel comme source officielle faible Copie de contenu reprendre la curation ou le texte sans attribution sensible Tracking culturel individuel profiler les gouts d'une personne a partir de ses archives sensible ; ROUGE si harcelement/ciblage non consenti Garde fous Citer comme source personnelle. Ne pas copier le wording ou les listes entieres. Extraire des patterns et liens, pas l'identite personnelle. Verifier les outils cites via sources primaires. Prochaines actions 1. Ajouter les prochaines references inspirantes dans ce fichier. 2. Creer une fiche dediee seulement si une reference devient structurante. 3. Relier aux themes privacy, social planning, Night Intel. Relations watch:tool project fit scan watch:red team risk tools watch theme:charte ia process:km auto operating prompt v1.0 Changelog v0.1 2026 05 22 Objectif : creer un fichier de veille pour sites inspirants, concurrents et outils. Fichiers touches : watch/inspiration competitors tools watch.md, watch/index.md, index.md, km/history.md. Risques : ne pas copier les concurrents, seulement analyser les patterns. Rollback possible : supprimer cette fiche et retirer les lignes d'index. v0.2 2026 05 22 Objectif : ajouter ohmypizza.com comme source inspirante de veille personnelle. Fichiers touches : watch/inspiration competitors tools watch.md, km/history.md. Risques : source personnelle, a ne pas traiter comme reference officielle. Rollback possible : retirer l'entree Oh My Pizza. v0.3 2026 05 22 Objectif : resserrer ROUGE aux abus offensifs directs et classer le reste en sensible. Fichiers touches : watch/inspiration competitors tools watch.md. Risques : social planning et blogs personnels restent privacy sensitive. Rollback possible : revenir a v0.2."},{"title":"NanoClaw - Personal AI Agent","canonical":"watch:nanoclaw-personal-agent","type":"Veille outils IA / agent personnel multi canaux.","tags":["ai agent","personal agent","messaging","containers","claude agent sdk","credential vault","local first","automation","sensitive"],"status":"sensible","path":"watch/nanoclaw-personal-agent.md","github":"https://github.com/bizc0m/KM/blob/main/watch/nanoclaw-personal-agent.md","summary":"NanoClaw est un agent IA personnel open source, leger et personnalisable. Il connecte un agent a des canaux de messagerie comme WhatsApp, Telegram, Slack, Discord, Microsoft Teams, Matrix, GitHub, Linear, email et autres. Le projet met en avant une architecture simple : un host Node, des conteneurs par groupe d'agents, deux bases SQLite par session, des skills installables a la demande et une isolation des credential","body":"NanoClaw Personal AI Agent Type Veille outils IA / agent personnel multi canaux. Tags ai agent, personal agent, messaging, containers, claude agent sdk, credential vault, local first, automation, sensitive Appel canonique watch:nanoclaw personal agent Sources Page Vibe Shit : https://vibeshit.org/product/nanoclaw Site : https://nanoclaw.dev/ Site FR : https://nanoclaw.dev/fr/ Repo : https://github.com/nanocoai/nanoclaw Lecture : 2026 05 22 Verification GitHub API : repo : nanocoai/nanoclaw description : lightweight alternative to OpenClaw running in containers, with messaging apps, memory and scheduled jobs stars lus : 29269 forks lus : 12855 licence : MIT archived : false dernier push lu : 2026 05 20 Resume court NanoClaw est un agent IA personnel open source, leger et personnalisable. Il connecte un agent a des canaux de messagerie comme WhatsApp, Telegram, Slack, Discord, Microsoft Teams, Matrix, GitHub, Linear, email et autres. Le projet met en avant une architecture simple : un host Node, des conteneurs par groupe d'agents, deux bases SQLite par session, des skills installables a la demande et une isolation des credentials via Agent Vault. Usage utile Construire un assistant personnel message first. Tester des agents par canal avec isolation forte. Relier messagerie, jobs planifies, memoire et providers IA. Inspirer les workflows NightIntel de transmission, bots et operations locales. Etudier une architecture agent simple, auditable et containerisee. Usage abusif possible Risque Description Classement Automation messaging envoi de messages automatises non consentis ou spam multi canaux sensible ; ROUGE si spam/phishing Credential routing mauvaise configuration du vault ou exposition de providers sensible Workspace mounts montage de dossiers contenant secrets ou donnees personnelles sensible Agent impersonation bot qui parle comme une personne sans signalement clair sensible Scheduled tasks jobs recurrents pouvant surveiller ou contacter sans opt in sensible ; ROUGE si surveillance abusive Garde fous Usage opt in sur chaque canal de messagerie. Aucun secret en clair dans repo, logs ou sessions. Monter seulement les dossiers necessaires dans les conteneurs. Distinguer clairement agent, humain et automatisation. Desactiver tout broadcast, scraping ou contact massif non sollicite. Auditer chaque skill installe avant usage. Relations watch:agentsview session intelligence watch:vibeshit vibe coding directory watch:ai open source tools inventory watch:red team risk tools watch process:ai tools theme:charte ia Fit projets Projet Fit Raison KM moyen assistant de capture/reprise via messagerie, a cadrer privacy NightIntel fort bots de transmission, cellules locales, alertes et briefings opt in NightCrawl fort agent operationnel de collecte/validation avec canaux separes outils internes fort assistant personnel multi agent avec isolation Decision KM Garder comme source prioritaire a surveiller. Classification sensible, pas ROUGE par defaut. Devient ROUGE uniquement si usage de spam, phishing, surveillance abusive, credential abuse ou contournement de consentement. Changelog v0.1 2026 05 22 Objectif : integrer NanoClaw comme agent personnel multi canaux. Fichiers touches : watch/nanoclaw personal agent.md, watch/index.md, index.md, watch/ai open source tools inventory.md, process/AI Tools.md, km/history.md. Risques : messagerie automatisee, credentials, prompts et donnees personnelles. Rollback possible : supprimer cette fiche et retirer les lignes d'index. v0.2 2026 05 22 Objectif : ajouter la page Vibe Shit comme source annuaire. Fichiers touches : watch/nanoclaw personal agent.md, process/AI Tools.md, km/history.md. Risques : page annuaire externe variable. Rollback possible : retirer la ligne Page Vibe Shit. v0.3 2026 05 22 Objectif : ajouter la page francaise officielle fournie dans le lot. Fichiers touches : watch/nanoclaw personal agent.md, process/AI Tools.md, km/history.md. Risques : contenu localise pouvant diverger du site EN. Rollback possible : retirer la ligne Site FR."},{"title":"AI Tools","canonical":"watch:nanoclaw-personal-agent","type":"process","tags":[],"status":"a verifier","path":"process/AI-Tools.md","github":"https://github.com/bizc0m/KM/blob/main/process/AI-Tools.md","summary":"AI Tools MavKa Bot URL : https://github.com/MozgAI/MavKa Resume en 3 lignes : MavKa est un bot IA personnel dans Telegram, auto heberge sur ton ordinateur. Il combine chat, voix, analyse d'images, recherche web, memoire persistante et agent de code local. Il permet de choisir plusieurs fournisseurs IA comme DeepSeek, OpenAI, Claude, Kimi ou Groq. Avantages principaux : Usage direct depuis Telegram. Installation rapid","body":"AI Tools MavKa Bot URL : https://github.com/MozgAI/MavKa Resume en 3 lignes : MavKa est un bot IA personnel dans Telegram, auto heberge sur ton ordinateur. Il combine chat, voix, analyse d'images, recherche web, memoire persistante et agent de code local. Il permet de choisir plusieurs fournisseurs IA comme DeepSeek, OpenAI, Claude, Kimi ou Groq. Avantages principaux : Usage direct depuis Telegram. Installation rapide via script. Open source, licence MIT. Choix du fournisseur IA, donc moins de dependance a une seule plateforme. Cout potentiellement bas avec DeepSeek. Fonctions utiles : voix, vision, recherche web, memoire, actions sur fichiers locaux. Reference future : MavKa = assistant IA Telegram + terminal + memoire + multi fournisseurs IA. Parallel Code URL : https://github.com/johannesjo/parallel code Resume en 3 lignes : Parallel Code permet de lancer plusieurs agents de code IA en parallele sur une meme base de code. Il supporte Claude Code, Codex, Gemini et Copilot CLI. Chaque agent travaille dans son propre git worktree pour comparer les resultats sans melanger les modifications. Avantages principaux : Test rapide de plusieurs agents IA sur la meme tache. Isolation des changements avec git worktrees. Comparaison facile des solutions produites. Compatible avec plusieurs CLI IA populaires. Utile pour prototypage, refactor, correction de bug et benchmark d'agents. Reference future : Parallel Code = orchestration multi agents IA + worktrees Git + comparaison de solutions. Claw Code URL repo officiel : https://github.com/instructkr/claw code URL repo actuel : https://github.com/ultraworkers/claw code Site : https://claw code.codes Resume en 3 lignes : Claw Code est un framework open source d'agent de code IA inspire de l'architecture Claude Code. Le projet utilise principalement Rust, avec un CLI claw a compiler depuis les sources. Il sert a tester, executer et structurer des workflows d'agent de code avec sessions, outils, permissions et MCP. Avantages principaux : Open source et inspectable. Base Rust orientee performance. CLI local pour workflows d'agent de code. Documentation dediee : architecture, outils, commandes, memoire, permissions et MCP. Utile pour comprendre ou experimenter une architecture type Claude Code. Reference future : Claw Code = framework open source d'agent de code IA + CLI Rust + architecture type Claude Code. ClawBot Cloud URL : https://cloud.clawbot.ai/?utm source=clawcodes Resume en 3 lignes : ClawBot Cloud est une plateforme cloud pour deployer un agent OpenClaw sans maintenance locale. L'agent est annonce comme disponible 24/7 et accessible depuis des plateformes de chat. Le site propose un assistant de configuration avec choix automatique du modele, connexion d'un canal et deploiement. Avantages principaux : Pas d'installation locale lourde. Agent cloud toujours en ligne. Configuration guidee en 3 etapes. Modeles integres : Claude, GPT, Gemini, Grok, Kimi, Qwen et autres. Utile pour tester OpenClaw rapidement sans gerer serveur, uptime ou maintenance. Reference future : ClawBot Cloud = version hebergee d'agent OpenClaw + 24/7 + zero maintenance locale. RTK Rust Token Killer URL site : https://www.rtk ai.app/ URL repo : https://github.com/rtk ai/rtk Resume en 3 lignes : RTK est un outil CLI open source en Rust qui compresse les sorties de commandes avant qu'elles entrent dans le contexte d'un agent IA. Il reduit le bruit des commandes comme git status, git diff, grep, find, ls, pytest, cargo test ou npm test. Il fonctionne avec Claude Code, Cursor, Aider, Gemini CLI, OpenAI Codex, Cline, Windsurf et GitHub Copilot. Avantages principaux : Reduit fortement les tokens inutiles dans les sessions de coding IA. Ameliore la qualite du contexte donne au modele. Allonge les sessions avant saturation du contexte. Peut reduire les couts API sur les workflows tres CLI. Open source, MIT, local first, sans compte ni cle API. Installation simple via Homebrew, script curl, Cargo ou binaires precompiles. Reference future : RTK = compresseur de sorties terminal pour agents IA + economie de tokens + meilleur contexte. CloakBrowser URL : https://github.com/CloakHQ/CloakBrowser Resume en 3 lignes : CloakBrowser est un Chromium modifie au niveau source pour automatisation web stealth. Il se presente comme remplacement Playwright/Puppeteer avec API proche et binaires auto telecharges. Il vise les tests d'automatisation, fingerprinting, profils persistants et compatibilite agents IA/browser automation. Avantages principaux : Remplacement rapide de Playwright/Puppeteer. Patches Chromium source level, pas seulement injection JS. Support Python et JavaScript. Profils persistants, proxy, timezone/locale. Utile pour tests anti bot defensifs et QA d'automatisation, a utiliser legalement. Reference future : CloakBrowser = Chromium stealth + Playwright/Puppeteer drop in + tests anti detection. AiToEarn URL : https://github.com/yikart/AiToEarn Resume en 3 lignes : AiToEarn est une collection de ressources autour de l'usage de l'IA pour creer des revenus. Le repo sert surtout de repertoire d'idees, outils, workflows et opportunites IA. Il est utile comme veille business IA plus que comme outil technique unique. Avantages principaux : Source d'inspiration pour monetisation IA. Liste centralisee d'idees et ressources. Utile pour veille marche et brainstorming. Bon point de depart pour trouver des niches IA. A verifier au cas par cas avant investissement de temps ou argent. Reference future : AiToEarn = repertoire d'idees pour gagner avec l'IA + veille opportunites. agentmemory URL : https://github.com/rohitg00/agentmemory Resume en 3 lignes : agentmemory fournit une memoire persistante pour agents de code IA. L'objectif est de conserver contexte, decisions et preferences entre sessions. Le projet cible les agents coding et se base sur des benchmarks d'usage reel. Avantages principaux : Memoire persistante entre sessions. Meilleure continuite pour agents de code. Peut reduire les repetitions de contexte. Utile pour grands projets ou travail long. Oriente benchmarks et comparaison pratique. Reference future : agentmemory = memoire persistante pour agents coding + contexte long terme. UI TARS Desktop URL : https://github.com/bytedance/UI TARS desktop Resume en 3 lignes : UI TARS Desktop est une stack open source d'agent IA multimodal pour ordinateur. Elle relie modeles IA, perception d'interface et infrastructure agent pour agir sur des UI. Le projet vise les workflows desktop ou l'agent observe, raisonne et interagit avec l'ecran. Avantages principaux : Agent multimodal open source. Oriente controle d'interface graphique. Utile pour automatisation desktop. Base ByteDance, avec ambition stack complete. Bon candidat pour experimenter agents visuels. Reference future : UI TARS Desktop = agent multimodal desktop + vision UI + automatisation ecran. 9Router URL : https://github.com/decolua/9router Resume en 3 lignes : 9Router est un routeur local/API pour connecter outils de coding IA a de nombreux fournisseurs et modeles. Il supporte Claude Code, Codex, Cursor, Cline, Copilot, OpenClaw et autres via endpoint compatible. Il ajoute fallback automatique, suivi de quotas et economie de tokens via RTK. Avantages principaux : Centralise plusieurs fournisseurs IA. Fallback automatique si quota ou limite. Compatible avec beaucoup de CLI coding. Economie de tokens avec RTK. Dashboard local et endpoint OpenAI compatible. Reference future : 9Router = routeur IA multi fournisseurs + fallback + economie tokens pour coding agents. DeepSeek TUI URL : https://github.com/Hmbown/DeepSeek TUI Resume en 3 lignes : DeepSeek TUI est un agent de code en terminal pour les modeles DeepSeek. Il propose une interface TUI pour travailler dans le shell avec assistance IA. Il est utile pour coding agent leger, local dans le terminal, centre sur DeepSeek. Avantages principaux : Interface terminal simple. Oriente modeles DeepSeek. Utile pour coding agent sans IDE lourd. Bon pour workflows shell. Alternative specialisee aux gros assistants de code. Reference future : DeepSeek TUI = agent coding terminal + DeepSeek + interface TUI. AI Trader URL : https://github.com/HKUDS/AI Trader Resume en 3 lignes : AI Trader est un projet de recherche/outil autour du trading automatise par agents IA. Il vise des workflows agent native pour analyse, decision et execution de trading. Usage a traiter comme experimental et risque, pas comme conseil financier. Avantages principaux : Exemple d'architecture agentique appliquee au trading. Utile pour recherche, backtesting et experimentation. Montre comment structurer decisions et actions de marche. Peut inspirer des agents financiers internes. Attention forte : risque financier, validation et conformite obligatoires. Reference future : AI Trader = agent IA de trading automatise + recherche + risque eleve. Skills by Matt Pocock URL : https://github.com/mattpocock/skills Resume en 3 lignes : Ce repo contient des skills pratiques pour ingenieurs, issus d'une configuration Claude. Il sert de bibliotheque de procedures et prompts reutilisables pour developpement logiciel. Il est utile pour standardiser la maniere dont un agent IA execute certaines taches techniques. Avantages principaux : Skills prets a adapter. Oriente pratiques d'ingenierie reelles. Bon modele pour creer ses propres skills. Ameliore coherence des workflows agents. Utile avec Claude Code et autres agents compatibles skills. Reference future : Skills = bibliotheque de workflows/prompts techniques pour agents IA. SuperSplat URL : https://github.com/playcanvas/supersplat Demo : https://superspl.at/editor Resume en 3 lignes : SuperSplat est un editeur open source de 3D Gaussian Splats. Il permet d'inspecter, editer, optimiser et publier des scenes 3D splat dans le navigateur. Il est construit avec des technologies web et peut etre utilise sans installation via la demo. Avantages principaux : Editeur 3DGS gratuit et open source. Fonctionne dans le navigateur. Utile pour visualisation, nettoyage et optimisation de splats. Base PlayCanvas, WebGL/WebGPU. Bon outil pour pipelines IA 3D, scan, photogrammetrie et scenes immersives. Reference future : SuperSplat = editeur web 3D Gaussian Splat + optimisation + publication. Hysteria URL : https://github.com/apernet/hysteria Resume en 3 lignes : Hysteria est un proxy rapide et resistant a la censure. Le projet vise les connexions reseau performantes dans des environnements contraints. Il peut servir d'infrastructure proxy pour developpement, reseau ou acces distant legitime. Avantages principaux : Proxy performant. Oriente resistance aux restrictions reseau. Projet mature et tres suivi. Utile pour infrastructure, tests reseau et acces distant. A utiliser selon les lois et politiques reseau applicables. Reference future : Hysteria = proxy rapide + resistance censure + infrastructure reseau. GitHub Spec Kit URL : https://github.com/github/spec kit Source : https://x.com/nicos ai/status/2056478886280753455 Resume en 3 lignes : Spec Kit est un toolkit open source de GitHub pour faire du spec driven development avec des agents IA. Il force l'agent a produire une specification, clarifier les manques, planifier et decouper les taches avant de coder. Il s'integre a des agents comme Claude Code, Codex, Cursor, Copilot, Gemini CLI et autres. Avantages principaux : Reduit le vibe coding vague. Structure le flux : constitution, specification, clarification, plan, tasks, implementation. Ameliore la previsibilite des agents de code. Compatible avec plusieurs outils IA. Utile pour projets complexes ou multi agents. Reference future : Spec Kit = workflow spec first pour agents IA + planification avant code. agency agents URL : https://github.com/msitarzewski/agency agents Source : https://x.com/NFTCPS/status/2056188353490595903 Resume en 3 lignes : agency agents est une bibliotheque de roles d'agents IA specialises. Elle contient des personas et processus pour des profils comme CEO, avocat, develo"},{"title":"Open Source SaaS Alternatives - nicos_ai","canonical":"watch:open-source-saas-alternatives-nicos-ai","type":"Veille outils open source.","tags":["open source","saas alternatives","ai tools","design","automation","local first","sensitive"],"status":"sensible","path":"watch/open-source-saas-alternatives-nicos-ai.md","github":"https://github.com/bizc0m/KM/blob/main/watch/open-source-saas-alternatives-nicos-ai.md","summary":"Le post liste 10 repos open source presentes comme alternatives a des outils SaaS ou services payants : video download, IA locale, image generation, design, workspace, automation, scheduling et password manager.","body":"Open Source SaaS Alternatives nicos ai Type Veille outils open source. Tags open source, saas alternatives, ai tools, design, automation, local first, sensitive Appel canonique watch:open source saas alternatives nicos ai Source Post X public fourni le 2026 05 22. URL : https://x.com/nicos ai/status/2057511065802469432 Auteur : nicos ai / Nico Date post : 2026 05 21 Lecture : FxTwitter API publique, sans compte X. Resume court Le post liste 10 repos open source presentes comme alternatives a des outils SaaS ou services payants : video download, IA locale, image generation, design, workspace, automation, scheduling et password manager. Outils cites Outil URL verifiee Statut Classement yt dlp https://github.com/yt dlp/yt dlp verifie GitHub sensible Ollama https://github.com/ollama/ollama verifie GitHub interne Fooocus https://github.com/lllyasviel/Fooocus verifie GitHub sensible PhotoGIMP https://github.com/Diolinux/PhotoGIMP verifie GitHub interne Open Design https://github.com/nexu io/open design verifie GitHub interne AppFlowy https://github.com/AppFlowy IO/AppFlowy deja verifie interne Penpot https://github.com/penpot/penpot deja verifie interne n8n https://github.com/n8n io/n8n deja verifie sensible ; ROUGE si exfiltration/spam Cal https://github.com/calcom/cal.diy deja verifie, ancien lien redirige interne Bitwarden Server https://github.com/bitwarden/server verifie GitHub interne critique Nouveaux outils ajoutes a l'inventaire yt dlp Ollama Fooocus PhotoGIMP Open Design Bitwarden Server Deduplication Deja presents dans KM : AppFlowy Penpot n8n Cal.com Usage abusif possible Outil Usage utile Usage abusif possible Classement yt dlp archivage legitime, recuperation de ses propres contenus, veille media telechargement non autorise, violation copyright, contournement plateformes sensible Ollama IA locale privacy first execution de modeles non controles, fuite via prompts si mal gere interne Fooocus generation image locale images trompeuses, usurpation visuelle sensible PhotoGIMP workflow design local confusion marque/interface si redistribution commerciale trompeuse interne Open Design generation UI/design copie de designs, confusion avec outils proprietaires interne n8n automation spam, scraping, exfiltration si connecteurs sensibles sensible ; ROUGE si abus operationnel Bitwarden Server gestion secrets mauvaise configuration exposant secrets interne critique Garde fous Ne pas promouvoir yt dlp pour contourner droits d'auteur ou restrictions. Verifier licences et conditions des plateformes avant usage media. IA locale : ne pas stocker secrets dans prompts ou historiques. Automation : validation humaine obligatoire avant actions externes. Secrets : aucun token en clair dans repo. Relations watch:ai open source tools inventory watch:red team risk tools watch watch:x source authors log process:ai tools Changelog v0.1 2026 05 22 Objectif : integrer le post nicos ai et dedupliquer les outils open source cites. Fichiers touches : watch/open source saas alternatives nicos ai.md, watch/ai open source tools inventory.md, watch/x source authors log.md, watch/index.md, index.md, km/history.md. Risques : claims promotionnels, usages sensibles de yt dlp/n8n/Fooocus. Rollback possible : supprimer cette fiche et retirer les lignes d'index."},{"title":"OSINT Tools Watch","canonical":"watch:osint-tools-watch","type":"Veille OSINT transversale.","tags":["osint","vehicle search","vin","license plate","threat intelligence","privacy sensitive"],"status":"a verifier","path":"watch/osint-tools-watch.md","github":"https://github.com/bizc0m/KM/blob/main/watch/osint-tools-watch.md","summary":"Le post reference une section \"Vehicle Search Tools\" du repo GitHub awesome hacker search engines, avec des outils de recherche de plaques, VIN et historiques de vehicules. Source citee par le post : https://github.com/edoardottt/awesome hacker search engines vehicle Verification : Repo verifie via GitHub API : https://github.com/edoardottt/awesome hacker search engines Statut : accessible. Licence GitHub : MIT. Gard","body":"OSINT Tools Watch Type Veille OSINT transversale. Tags osint, vehicle search, vin, license plate, threat intelligence, privacy sensitive Source Post X public fourni le 2026 05 22. Lecture effectuee via FxTwitter API publique, sans compte X. Appel canonique watch:osint tools watch Relations watch:ai open source tools watch theme:charte ia Resume court Le post reference une section \"Vehicle Search Tools\" du repo GitHub awesome hacker search engines, avec des outils de recherche de plaques, VIN et historiques de vehicules. Source citee par le post : https://github.com/edoardottt/awesome hacker search engines vehicle Verification : Repo verifie via GitHub API : https://github.com/edoardottt/awesome hacker search engines Statut : accessible. Licence GitHub : MIT. Garde fou : ne pas extraire ni stocker de donnees personnelles vehicules dans KM. Sources lues Date post Auteur URL Sujet Statut 2026 05 21 cyb detective https://x.com/cyb detective/status/2057462395568558157 Vehicle Search Tools : license plate search, VIN check, vehicle history records sensible Arbitrage Element Decision Raison Vehicle search OSINT garder avec prudence utile pour veille OSINT, mais donnees potentiellement personnelles Plaques / VIN / historique vehicule a cadrer risque privacy, stalking, doxxing, usage abusif Repo awesome hacker search engines garder comme source index public, a verifier avant utilisation Garde fous Usage uniquement defensif, recherche legitime, audit, investigation autorisee ou apprentissage. Pas de doxxing, stalking, surveillance abusive ou identification de particuliers sans base legitime. Ne pas stocker plaques, VIN, noms, adresses ou resultats personnels dans KM. Verifier legalite locale avant usage de tout outil lie aux vehicules. Risques Outils externes variables. Donnees vehicules possiblement personnelles. Resultats pouvant etre faux, obsoletes ou hors cadre legal selon pays. Prochaines actions 1. Verifier le repo GitHub source avant integration. 2. Extraire uniquement les categories utiles et licites. 3. Creer une fiche dediee si un outil devient actionnable. Changelog v0.1 2026 05 22 Objectif : integrer automatiquement le lien Cyb Detective dans KM Watch. Fichiers touches : watch/osint tools watch.md, watch/index.md, index.md, km/history.md. Risques : sujet privacy sensitive. Rollback possible : supprimer cette fiche et retirer les lignes d'index. v0.2 2026 05 22 Objectif : verifier le repo source Vehicle Search Tools. Fichiers touches : watch/osint tools watch.md. Risques : contenu privacy sensitive. Rollback possible : retirer le bloc Verification."},{"title":"PentestGPT - Autonomous Penetration Testing","canonical":"watch:pentestgpt-autonomous-pentest","type":"Veille ROUGE / outil IA de pentest autonome.","tags":["ROUGE","pentest","red team","autonomous agent","exploitation","recon","privilege escalation","llm security","offensive risk"],"status":"#ROUGE","path":"watch/pentestgpt-autonomous-pentest.md","github":"https://github.com/bizc0m/KM/blob/main/watch/pentestgpt-autonomous-pentest.md","summary":"PentestGPT est un framework agentique de penetration testing automatise par LLM. La page officielle met en avant une pipeline autonome de reconnaissance, analyse de vulnerabilites, exploitation, privilege escalation, session persistence et environnement Docker avec outils de securite.","body":"PentestGPT Autonomous Penetration Testing Type Veille ROUGE / outil IA de pentest autonome. Tags ROUGE, pentest, red team, autonomous agent, exploitation, recon, privilege escalation, llm security, offensive risk Appel canonique watch:pentestgpt autonomous pentest Sources Page Vibe Shit : https://vibeshit.org/product/pentestgpt Site officiel : https://pentestgpt.com/ Repo : https://github.com/GreyDGL/PentestGPT Papier : PentestGPT: Evaluating and Harnessing Large Language Models for Automated Penetration Testing Lecture : 2026 05 22 Verification GitHub API : repo : GreyDGL/PentestGPT description : automated penetration testing agentic framework powered by large language models stars lus : 13240 forks lus : 2274 licence : MIT archived : false dernier push lu : 2026 02 23 Resume court PentestGPT est un framework agentique de penetration testing automatise par LLM. La page officielle met en avant une pipeline autonome de reconnaissance, analyse de vulnerabilites, exploitation, privilege escalation, session persistence et environnement Docker avec outils de securite. Classification ROUGE Raison : l'outil facilite directement des actions offensives operationnelles : reconnaissance, exploitation, post exploitation et automatisation d'attack chains. A connaitre pour defense, audit, threat intelligence et comprehension du paysage, mais pas a diffuser comme guide d'usage. Usage defensif legitime Laboratoire interne, CTF, HackTheBox ou environnement explicitement autorise. Evaluation defensive d'agents de pentest autonomes. Etude des risques d'automatisation offensive par LLM. Benchmark de garde fous, detection, journalisation et containment. Formation securite uniquement dans un cadre autorise et supervise. Usage abusif possible Risque Description Classement Recon non autorisee scan ou enumeration de cibles tierces ROUGE Exploitation selection et execution de techniques d'exploitation ROUGE Privilege escalation recherche de chemins d'elevation sur systemes compromis ROUGE Lateral movement chainage d'actions apres acces initial ROUGE Abaissement de barriere aide a des profils non qualifies pour conduire des attaques ROUGE Garde fous Ne pas fournir de commandes, payloads, procedures ou chaines d'exploitation. Ne pas tester sur cible externe sans autorisation ecrite. Ne pas connecter a des credentials, VPN, clouds ou reseaux reels sans cadrage. Executer uniquement en lab isole si test local. Journaliser objectif, perimetre, autorisation, cible, duree et responsable. Ne pas integrer dans NightIntel ou un produit public. Relations watch:red team risk tools watch watch:vibeshit vibe coding directory watch:ai open source tools inventory process:ai tools theme:charte ia Decision KM Garder en veille ROUGE interne. Ne pas ajouter aux recommandations publiques. Toute experimentation demande un perimetre explicite, legal, isole et autorise. Changelog v0.1 2026 05 22 Objectif : integrer PentestGPT depuis Vibe Shit en veille ROUGE. Fichiers touches : watch/pentestgpt autonomous pentest.md, watch/red team risk tools watch.md, watch/index.md, index.md, watch/ai open source tools inventory.md, process/AI Tools.md, km/history.md. Risques : outil offensif directement operationnel. Rollback possible : supprimer cette fiche et retirer les lignes d'index."},{"title":"Red Team Risk Tools Watch","canonical":"watch:red-team-risk-tools-watch","type":"Veille outils sensibles ROUGE.","tags":["ROUGE","dual use","offensive risk","osint","anti detection","privacy","threat intelligence"],"status":"#ROUGE","path":"watch/red-team-risk-tools-watch.md","github":"https://github.com/bizc0m/KM/blob/main/watch/red-team-risk-tools-watch.md","summary":"Centraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger. ROUGE signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser publiquement ni transformer en tutoriel operationnel.","body":"Red Team Risk Tools Watch Type Veille outils sensibles ROUGE. Tags ROUGE, dual use, offensive risk, osint, anti detection, privacy, threat intelligence Appel canonique watch:red team risk tools watch Role Centraliser les outils offensifs, abusables ou a double usage pour les connaitre, les surveiller et s'en proteger. ROUGE signifie : a connaitre en interne pour defense, audit, hygiene, threat intelligence et prevention, mais pas a diffuser pu g usage limite tests legitimes, pas de contournement abusif Vehicle Search Tools plaques/VIN, donnees personnelles possibles privacy sensitive, veille seulement Claude Code redirect repo securite/secrets/conditions d'usage attendre identification + audit Quick wins 1. playwright mcp pour tests UI NightLife, Nocturne Intel et DemoForge. 2. OpenScreen pour creer des demos courtes des interfaces. 3. Plausible Analytics pour analytics privacy first sur pages publiques. 4. Postiz pour planifier des posts de demo, validation manuelle obligatoire. 5. Hyperframes pour generer des videos DemoForge / NightIntel reproductibles. 6. Vaultwarden pour hygiene secrets, hors repo. Relations KM watch:ai open source tools inventory watch:osint tools watch watch:x source authors log process:ai tools theme:charte ia Changelog v0.1 2026 05 22 Objectif : scanner les projets locaux et proposer les outils utiles par projet. Fichiers touches : watch/tool project fit scan.md, watch/index.md, index.md, km/history.md. Risques : scan rapide base sur README/index, pas audit complet du code. Rollback possible : supprimer cette fiche et retirer les lignes d'index."},{"title":"Twitter RSS Monitoring","canonical":"watch:twitter-rss-monitoring","type":"Veille process / source monitoring.","tags":["rss","twitter","x","monitoring","nitter","openrss","social watch","privacy"],"status":"sensible","path":"watch/twitter-rss-monitoring.md","github":"https://github.com/bizc0m/KM/blob/main/watch/twitter-rss-monitoring.md","summary":"L'article explique comment suivre quelques comptes Twitter/X via RSS afin de reduire le temps passe sur le site Twitter. Deux services sont cites : Nitter et OpenRSS. L'approche permet de generer des flux RSS publics sans acces API Twitter.","body":"Twitter RSS Monitoring Type Veille process / source monitoring. Tags rss, twitter, x, monitoring, nitter, openrss, social watch, privacy Appel canonique watch:twitter rss monitoring Source Article : Keeping Up With Twitter Via RSS Feeds URL : https://ohmypizza.com/2023/04/keeping up with twitter via rss Auteur : Scott Yoshinaga Date source : 2023 04 20 Lecture KM : 2026 05 22 Resume court L'article explique comment suivre quelques comptes Twitter/X via RSS afin de reduire le temps passe sur le site Twitter. Deux services sont cites : Nitter et OpenRSS. L'approche permet de generer des flux RSS publics sans acces API Twitter. Outils cites Outil URL Usage Statut Nitter https://nitter.net/<username consulter un compte Twitter via interface alternative et recuperer un RSS verifie partiel 2026 05 22, service/instances instables OpenRSS https://openrss.org/twitter.com/<username generer un flux RSS depuis un compte Twitter public verifie source officielle 2026 05 22 Nitter verification officielle Sources : Instance : https://nitter.net/ Repo : https://github.com/zedeus/nitter Verification 2026 05 22 : https://nitter.net/ repond, mais la page chargee est minimale. Repo GitHub verifie via GitHub API : zedeus/nitter. Licence GitHub : AGPL 3.0. Repo non archive au moment de la verification. Dernier push lu via GitHub API : 2026 04 16. Notes de contexte : Nitter est un frontend alternatif Twitter/X centre privacy/performance. Le projet a connu une forte instabilite apres les changements d'acces de Twitter/X. Plusieurs sources publiques indiquent que les instances et le RSS peuvent etre instables ou desactives selon les periodes. A utiliser comme source de veille opportuniste, pas comme infrastructure fiable de production. OpenRSS verification officielle Source officielle : https://openrss.org/ Guides / conditions lues : https://openrss.org/guides/how to use an open rss feed https://openrss.org/terms Points verifies : Page racine relue le 2026 05 22 depuis le lot fourni. OpenRSS permet d'ajouter openrss.org/ devant une URL pour obtenir un flux RSS quand la page est supportee. Le service annonce des flux sans algorithmes de recommandation. Le service indique retirer certains scripts, tracking links et contenus invasifs des flux. OpenRSS est presente comme organisation nonprofit 501(c)(3). Usage annonce : personnel, informatif, non commercial. Les conditions demandent de limiter la frequence des requetes. Les conditions interdisent l'usage illegal, le contournement de restrictions, l'acces a du contenu payant, l'espionnage, le harcelement et le monitoring de contenu non public. Usage utile Veille sobre sur comptes publics. Centraliser des sources X dans un lecteur RSS. Reduire l'exposition a l'interface addictive de X. Surveiller les comptes source utiles pour KM sans connexion directe a X. Alimenter une veille manuelle non intrusive. Usage abusif possible Risque Description Classement Surveillance abusive suivre systematiquement une personne sans cadre legitime ROUGE si cible personne privee Scraping agressif multiplier flux et requetes au dela d'une veille raisonnable sensible ; ROUGE si automatisation furtive ou massive Contournement plateforme utiliser des services alternatifs pour contourner limites/API sans respecter conditions sensible Profilage croiser flux publics pour profiler une personne ou un groupe sensible ; ROUGE si ciblage individuel non consenti Garde fous Utiliser uniquement des comptes publics et pertinents pour la veille. Ne pas suivre de personnes privees sans raison legitime. Ne pas stocker donnees personnelles issues de flux. Ne pas automatiser a grande echelle. Respecter les limites des services tiers et les conditions applicables. Preferer la veille thematique aux listes nominatives. Usage OpenRSS : personnel, non commercial, frequence raisonnable. Ne pas redistribuer les flux OpenRSS dans une app publique ou payante sans verifier les conditions. Usage Nitter : limiter a une veille manuelle ou faible frequence ; ne pas dependra d'instances publiques pour un produit. Relations watch:x source authors log watch:ai open source tools watch watch:red team risk tools watch process:km auto operating prompt v1.0 Decision KM Garder comme process de veille utile, mais classer les usages de surveillance/profilage en ROUGE. Rollback Supprimer watch/twitter rss monitoring.md et retirer les lignes correspondantes de index.md, watch/index.md, km/history.md. Changelog v0.1 2026 05 22 Objectif : integrer la methode RSS pour suivre Twitter/X dans KM. Fichiers touches : watch/twitter rss monitoring.md, watch/index.md, index.md, km/history.md. Risques : usage abusif possible pour surveillance ou scraping. Rollback possible : supprimer cette fiche et retirer les lignes d'index. v0.2 2026 05 22 Objectif : verifier la source officielle OpenRSS et ajouter les limites d'usage. Fichiers touches : watch/twitter rss monitoring.md, km/history.md. Risques : conditions OpenRSS variables dans le temps. Rollback possible : retirer le bloc OpenRSS verification officielle. v0.3 2026 05 22 Objectif : verifier Nitter et ajouter le statut d'instabilite. Fichiers touches : watch/twitter rss monitoring.md, km/history.md. Risques : instances Nitter variables, RSS parfois indisponible. Rollback possible : retirer le bloc Nitter verification officielle. v0.4 2026 05 22 Objectif : resserrer la classification ROUGE aux abus offensifs directs. Fichiers touches : watch/twitter rss monitoring.md. Risques : usage de veille pouvant deriver en surveillance. Rollback possible : revenir a v0.3. v0.5 2026 05 22 Objectif : confirmer https://openrss.org/ comme source directe du nouveau lot. Fichiers touches : watch/twitter rss monitoring.md, km/history.md. Risques : conditions et disponibilite variables. Rollback possible : retirer la mention de relecture."},{"title":"Vibe Shit - Vibe Coding Directory","canonical":"watch:vibeshit-vibe-coding-directory","type":"Veille outils IA / annuaire projets vibe coding.","tags":["vibe coding","ai tools","agents","llm","devtools","directory","inspiration","sensitive"],"status":"sensible","path":"watch/vibeshit-vibe-coding-directory.md","github":"https://github.com/bizc0m/KM/blob/main/watch/vibeshit-vibe-coding-directory.md","s     const state = { query: "", filter: "all" };

    function normalize(value) {
      return value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function scoreItem(item, terms) {
      if (!terms.length) return 1;
      const haystack = normalize([item.title, item.canonical, item.type, item.status, item.tags.join(" "), item.summary, item.body].join(" "));
      let score = 0;
      for (const term of terms) {
        if (!haystack.includes(term)) return 0;
        if (normalize(item.title).includes(term)) score += 8;
        if (normalize(item.canonical || "").includes(term)) score += 7;
        if (normalize(item.tags.join(" ")).includes(term)) score += 4;
        if (normalize(item.summary).includes(term)) score += 2;
        score += 1;
      }
      return score;
    }

    function matchesFilter(item) {
      if (state.filter === "all") return true;
      if (state.filter.endsWith("/")) return item.path.startsWith(state.filter);
      if (state.filter === "#ROUGE") return item.status === "#ROUGE" || item.tags.includes("#ROUGE");
      if (state.filter === "sensible") return normalize(item.status).includes("sensible") || item.body.toLowerCase().includes("sensible");
      if (state.filter === "a verifier") return normalize(item.status).includes("verifier") || item.tags.includes("to-verify");
      return true;
    }

    function highlight(text, terms) {
      let safe = String(text || "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
      for (const term of terms) {
        if (!term) continue;
        const escaped = term.replace(/[.*+?^\$\{\}()|[\]\\]/g, "\\$&");
        safe = safe.replace(new RegExp(escaped, "ig"), (match) => "<mark>" + match + "</mark>");
      }
      return safe;
    }

    function badgeClass(status) {
      if (status === "#ROUGE") return "red";
      if (normalize(status).includes("verifier")) return "warn";
      if (normalize(status).includes("sensible")) return "blue";
      return "";
    }

    function render() {
      const terms = normalize(state.query).split(/\s+/).filter(Boolean);
      const rows = KM_INDEX
        .map((item) => ({ item, score: scoreItem(item, terms) }))
        .filter((row) => row.score > 0 && matchesFilter(row.item))
        .sort((a, b) => b.score - a.score || a.item.title.localeCompare(b.item.title))
        .slice(0, 80);

      countEl.textContent = rows.length;
      redCountEl.textContent = KM_INDEX.filter((item) => item.status === "#ROUGE").length;
      sensitiveCountEl.textContent = KM_INDEX.filter((item) => normalize(item.status).includes("sensible")).length;
      verifyCountEl.textContent = KM_INDEX.filter((item) => normalize(item.status).includes("verifier")).length;

      if (!rows.length) {
        resultsEl.innerHTML = '<article class="result"><h2>Aucun resultat</h2><p class="summary">Essaie un appel canonique, un tag, un outil ou un risque.</p></article>';
        return;
      }

      resultsEl.innerHTML = rows.map(({ item }) => {
        const tags = item.tags.slice(0, 8).map((tag) => '<span class="badge">' + highlight(tag, terms) + '</span>').join("");
        return '<article class="result">'
          + '<h2><a href="' + item.github + '" target="_blank" rel="noreferrer">' + highlight(item.title, terms) + '</a></h2>'
          + '<div class="badges">'
          + '<span class="badge ' + badgeClass(item.status) + '">' + item.status + '</span>'
          + (item.canonical ? '<span class="badge">' + highlight(item.canonical, terms) + '</span>' : "")
          + '<span class="badge">' + highlight(item.type, terms) + '</span>'
          + tags
          + '</div>'
          + '<p class="summary">' + highlight(item.summary, terms) + '</p>'
          + '<div class="path">' + item.path + '</div>'
          + '</article>';
      }).join("");
    }

    queryInput.addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });
    document.getElementById("clear").addEventListener("click", () => {
      state.query = "";
      queryInput.value = "";
      queryInput.focus();
      render();
    });
    document.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach((node) => node.classList.remove("active"));
        chip.classList.add("active");
        state.filter = chip.dataset.filter;
        render();
      });
    });
    render();
  </script>
</body>
</html>
