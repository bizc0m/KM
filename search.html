  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f12;
      --panel: #15181d;

      --text: #f2f4f7;

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      letter-spacing: 0;
    }
    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    header {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 46px);
      line-height: 1;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
    }
    .searchbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin: 18px 0 12px;
    }
    input, select, button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 8px;
      font: inherit;
    }
    input {
      min-height: 48px;
      padding: 0 14px;
      font-size: 17px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      min-height: 48px;
      padding: 0 14px;
      cursor: pointer;
    }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      font-size: 14px;
    }
    .chip.active {
      color: #06110d;
      background: var(--accent);
      border-color: var(--accent);
    }
    .layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 16px;
      align-items: start;
    }
    aside, .results {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }
    aside { padding: 14px; position: sticky; top: 16px; }
    .stat {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
    .stat:last-child { border-bottom: 0; }
    .stat strong { color: var(--text); }
    .results { overflow: hidden; }
    .result {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 10px;
    }
    .result:last-child { border-bottom: 0; }
    .result h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }
    .result a { color: var(--text); text-decoration: none; }
    .result a:hover { color: var(--accent); }
    .summary { color: var(--muted); line-height: 1.55; }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .badge {
      color: var(--muted);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
    }
    .badge.red { color: #250707; background: var(--red); border-color: var(--red); }
    .badge.warn { color: #201600; background: var(--warn); border-color: var(--warn); }
    .badge.blue { color: #06111f; background: var(--blue); border-color: var(--blue); }
    .path {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    mark {
      background: rgba(110, 231, 183, .22);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }
    @media (max-width: 760px) {
      main { width: min(100vw - 20px, 680px); padding-top: 18px; }
      .layout { grid-template-columns: 1fr; }
      aside { display: none; }
      .searchbar { grid-template-columns: 1fr; }
      .filters { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
      .chip { white-space: nowrap; }
    }

ch/ccgui mossx vibecoding editor.md, watch/index.md, index.md, watch/ai open source tools inventory.md, process/AI Tools.md, km/history.md. Risques : repo GitHub non confirme, plugins et MCP a auditer. Rollback possible : retirer l'entree watch:ccgui mossx vibecoding editor."},{"title":"KM Index","canonical":"km:index","type":"km","tags":[],"status":"actif","path":"km/index.md","github":"https://github.com/bizc0m/KM/blob/main/km/index.md","summary":"Index des fiches KM creees via km.","body":"KM Index Role Index des fiches KM creees via km. Fiches Appel Fichier Type Tags Statut km:index index.md index km, index actif Regles fiche km Chaque fiche doit contenir : type ; tags ; relations ; resume ; source ; statut de deduplication ; historique. Changelog v0.1 2026 05 19 Objectif : creer l'index canonique des fiches KM. Risques : fiches a migrer progressivement. Rollback possible : revenir aux index historiques."},{"title":"Night Intel","canonical":"","type":"theme","tags":[],"status":"actif","path":"themes/night-intel.md","github":"https://github.com/bizc0m/KM/blob/main/themes/night-intel.md","summary":"Night Intel Fiche theme Statut : v0.1 cadrage Version courante : v0.1 cadrage Role : theme global Night Intel partage par les projets NightIntel. Mission : MAKE THE INVISIBLE VISIBLE. Tagline : Render the chaos legible. North Star : un systeme cache pour comprendre la vie nocturne mondiale, pas une simple app nightlife. Principes globaux Culture first : emotion, desir, esthetique et appartenance avant technologie. La","body":"Night Intel Fiche theme Statut : v0.1 cadrage Version courante : v0.1 cadrage Role : theme global Night Intel partage par les projets NightIntel. Mission : MAKE THE INVISIBLE VISIBLE. Tagline : Render the chaos legible. North Star : un systeme cache pour comprendre la vie nocturne mondiale, pas une simple app nightlife. Principes globaux Culture first : emotion, desir, esthetique et appartenance avant technologie. La ville est le plateau : heat, movement, trends, hidden places, emotional density, social energy. Night Intel est un signal : transmission, anomalie, couche cachee, systeme classe, mouvement culturel. Micro elites avant mass scale : DJs, photographes, bartenders, organisateurs, explorateurs nightlife, curateurs, operateurs locaux. Status money : decouverte, reputation, appartenance, acces, influence, rarete. Roles globaux Scout : decouvre lieux, events et signaux. Operator : valide l'information. Curator : guide la direction editoriale. Signal Keeper : modere confiance et qualite. City Node : maintient un ecosysteme local. Architect : construit outils et systemes. Langage visuel References : intelligence systems radar interfaces Swiss graphic design Bloomberg Terminal demoscene cyberpunk minimalism luxury black interfaces signal/noise visual systems A eviter : UI startup generique esthetique Web3 coloree gamification enfantine Propagation 1. Signal : mystere, QR codes, projections, stickers, maps, heatmaps, anomaly messages. 2. Local Cells : identite locale, recrutement selectif, curation. 3. Social Contamination : screenshots, videos courtes, maps, radar animations, city pulses. 4. World Map : carte mondiale temps reel des signaux nightlife/culture/mood/movement. Philosophie technique Frontend prefere : Next.js, WebGL, Deck.gl, Mapbox, Cesium, exports single file si utile. Backend prefere : Cloudflare ecosystem, edge first, architecture distribuee. Donnees : APIs, contributeurs locaux, curation manuelle, validation communautaire. Qualite quantite. Regles anti derive Ne pas over engineer trop tot. Ne pas construire de token system trop tot. Ne pas optimiser le scale avant retention. Ne pas remplir la plateforme d'utilisateurs de faible qualite. Ne pas sacrifier l'esthetique pour des growth hacks. Ne jamais ajouter de mecanique humiliante, punitive ou degradante. Scores, badges, XP/Aura et seuils doivent etre explicites. Collaboration IA Voir theme dedie : charte ia.md. Question filtre Est ce que cette fonction : augmente l'intensite emotionnelle ; ameliore la decouverte ; renforce l'appartenance ; amplifie l'experience de la ville ; ou rend l'invisible visible ? Si non : rejeter ou simplifier. Changelog v0.1 cadrage 2026 05 16 Objectif : separer le theme global Night Intel des fiches projet. Fichiers sources : NightCrawl/NIGHT INTEL PROTOCOL.md. Fichiers touches : themes/night intel.md, themes/THEMES.md, NightCrawl/NightCrawl NightIntel.md. Ajout : protocole de collaboration IA, ensuite separe dans charte ia.md. Risques : duplication partielle avec le protocole source. Rollback possible : reintegrer ces sections dans la fiche projet."},{"title":"PACTIA","canonical":"","type":"theme","tags":[],"status":"a verifier","path":"themes/pactia.md","github":"https://github.com/bizc0m/KM/blob/main/themes/pactia.md","summary":"PACTIA Fiche theme Statut : v0.1 cadrage Version courante : v0.1 cadrage Role : theme transversal pour transformer un chat, une idee ou une session IA en pacte de travail clair, documente et reutilisable. Projet lie : PACTE IA / NightIntel Lien vers le chat : https://chatgpt.com/share/6a086eeb b124 8331 8945 dbb3b026f567 Titre source : Vision PACTE IA GPT 5.5 Resume du chat Le chat source cadre une vision GPT pour PA","body":"PACTIA Fiche theme Statut : v0.1 cadrage Version courante : v0.1 cadrage Role : theme transversal pour transformer un chat, une idee ou une session IA en pacte de travail clair, documente et reutilisable. Projet lie : PACTE IA / NightIntel Lien vers le chat : https://chatgpt.com/share/6a086eeb b124 8331 8945 dbb3b026f567 Titre source : Vision PACTE IA GPT 5.5 Resume du chat Le chat source cadre une vision GPT pour PACTE IA. Il traite la relation entre IA, humains, audit, agency, flourishing, contradiction entre modeles et structuration documentaire. Points forts extraits : une IA doit assister sans capturer l'agency humaine ; une reponse fluide peut donner une illusion de verite ; les visions des IA doivent rester comparables sans etre homogenisees trop tot ; les desaccords entre IA peuvent etre plus utiles que les consensus ; PACTE IA doit devenir une charte operatoire, mesurable et testable ; une structure par branches/visions IA est utile : GPT, Claude, Perplexity, meta, audit, contradictions. Le theme PACTIA sert a garder une trace propre de ce type d'echange : lien source, contexte, fonction, decisions, points utiles, concepts associes et reprise possible. Fonction du theme PACTIA sert a transformer les conversations de construction projet en documents exploitables. Objectifs : ne pas perdre les intentions du chat ; relier chaque theme a son chat source ; separer la vision, les decisions et les concepts ; rendre les sessions IA auditables ; aider a reprendre le projet sans relire toute la conversation. 10 points precis Point Contenu precis A quoi cela sert Concepts associes 1 Toujours conserver le lien vers le chat source Retrouver le contexte exact d'une decision Trace, audit, source, memoire 2 Resumer le contenu du chat sous le lien Comprendre rapidement ce qui a ete dit Synthese, contexte, reprise 3 Decrire la fonction du chat Savoir pourquoi la conversation existe Intention, utilite, cadrage 4 Extraire les decisions prises Eviter de refaire les memes arbitrages Decision log, coherence, continuites 5 Distinguer idee, decision et action Ne pas confondre vision et execution Gouvernance, backlog, priorisation 6 Associer chaque point a des concepts Connecter le contenu a une architecture mentale Ontologie, themes, concepts 7 Garder une forme courte mais precise Rendre la documentation lisible et utile Documentation operative, densite 8 Signaler les zones a verifier Eviter que les hypotheses deviennent des faits Risque, validation, prudence 9 Relier le theme aux projets concernes Savoir ou appliquer le theme Projet, dependance, reutilisation 10 Ajouter changelog et rollback Pouvoir suivre et annuler les evolutions Versioning, controle, reversibilite Regles d'utilisation Pour chaque nouveau theme cree depuis un chat : 1. Mettre le lien vers le chat en haut. 2. Ajouter un resume court du contenu du chat. 3. Expliquer la fonction du chat. 4. Ecrire 10 points precis minimum. 5. Pour chaque point, ajouter a quoi cela sert. 6. Pour chaque point, ajouter les concepts associes. 7. Documenter les changements importants dans le changelog. 8. Ne pas inventer de lien si le lien du chat n'est pas disponible. Application aux projets PACTIA permet de structurer les sessions projet : creation ou reprise projet ; decisions produit ; themes transversaux ; visions IA ; contradictions entre IA ; audit ; system prompts ; sources ; risques ; prochaines actions. Decisions Date Decision Raison Impact Rollback 2026 05 16 Creer un theme PACTIA separe Eviter de melanger protocole de chat et theme Night Intel Documentation plus claire Fusionner dans THEMES.md si inutile 2026 05 16 Garder Lien vers le chat obligatoire L'utilisateur demande un lien systematique Meilleure tracabilite Rendre le champ optionnel 2026 05 16 Ne pas inventer le lien Aucun lien chat exploitable disponible localement Evite une fausse source Remplacer par le lien reel quand disponible 2026 05 16 Rattacher ce theme au chat PACTE IA Le lien fourni concerne PACTE IA, pas NightCrawl PACTIA devient un theme transversal IA/documentation Creer un theme PACTE IA separe si necessaire Risques La page partagee contient potentiellement des donnees personnelles : ne pas recopier les identifiants personnels dans les exports. Le theme peut devenir trop generique si on y met des decisions produit. Il faut garder PACTIA comme protocole de documentation, pas comme vision produit. Rollback Supprimer themes/pactia.md et retirer la ligne PACTIA de themes/THEMES.md. Changelog v0.1 cadrage 2026 05 16 Objectif : creer le theme PACTIA demande. Fichiers touches : themes/pactia.md, themes/THEMES.md. Ajout : lien chat, resume, fonction, 10 points precis, concepts associes, decisions, risques, rollback. Mise a jour : lien source PACTE IA renseigne et resume recadre. Risques : ne pas recopier de donnee personnelle depuis le chat source. Rollback possible : supprimer le theme et son index."},{"title":"KM Auto Operating Prompt v1.0","canonical":"process:km-auto-operating-prompt-v1.0","type":"process","tags":[],"status":"sensible","path":"process/km-auto-operating-prompt-v1.0.md","github":"https://github.com/bizc0m/KM/blob/main/process/km-auto-operating-prompt-v1.0.md","summary":"Prompt complet pour piloter KM en mode automatique. Appel canonique : process:km auto operating prompt v1.0 Emplacement canonique : DEV/KM/process/km auto operating prompt v1.0.md Version : v1.0 Date : 2026 05 22","body":"KM Auto Operating Prompt v1.0 Role Prompt complet pour piloter KM en mode automatique. Appel canonique : process:km auto operating prompt v1.0 Emplacement canonique : DEV/KM/process/km auto operating prompt v1.0.md Version : v1.0 Date : 2026 05 22 Prompt Usage Utiliser ce prompt comme reference principale pour toute operation km, veille outils, scan projet, inventaire, deduplication et indexation. Proposition de nom et emplacement Nom retenu : km auto operating prompt v1.0.md Emplacement retenu : DEV/KM/process/km auto operating prompt v1.0.md Raison : nom explicite, version lisible, place dans process/ car c'est une procedure reutilisable. Changelog v1.1 2026 05 22 Objectif : ajouter la classification ROUGE pour les outils offensifs ou abusables. Fichiers touches : process/km auto operating prompt v1.0.md, watch/red team risk tools watch.md, watch/ai open source tools inventory.md. Risques : confusion entre veille defensive et diffusion offensive. Rollback possible : retirer le bloc Classification ROUGE. v1.2 2026 05 22 Objectif : resserrer ROUGE aux outils offensifs directs, et utiliser sensible / interne pour le reste. Fichiers touches : process/km auto operating prompt v1.0.md, watch/red team risk tools watch.md, watch/ai open source tools inventory.md. Risques : sous classer un outil dual use ; revoir au cas par cas. Rollback possible : revenir a v1.1. v1.0 2026 05 22 Objectif : consolider toutes les consignes KM en un prompt complet automatique. Fichiers touches : process/km auto operating prompt v1.0.md, index.md, km/history.md. Risques : prompt large, a reviser si les conventions KM changent. Rollback possible : revenir a process/km resource import prompt.md."},{"title":"Themes - NightIntel","canonical":"resource:nocturne-intel/noctintel-pro-dashboard-chat","type":"theme","tags":[],"status":"actif","path":"themes/THEMES.md","github":"https://github.com/bizc0m/KM/blob/main/themes/THEMES.md","summary":"Index central des themes transversaux utilises par les projets NightIntel. Regle : un theme = un document .md dedie. Les projets ne recopient pas tout le theme ; ils pointent vers lui et documentent seulement l'application specifique au projet. Documents ressources : voir ../resources/RESOURCES.md.","body":"Themes NightIntel Role Index central des themes transversaux utilises par les projets NightIntel. Regle : un theme = un document .md dedie. Les projets ne recopient pas tout le theme ; ils pointent vers lui et documentent seulement l'application specifique au projet. Documents ressources : voir ../resources/RESOURCES.md. Ordre logique Ordre Theme Document Statut Role 1 Night Intel global night intel.md v0.1 cadrage Mission, principes, IA, propagation, anti derive 2 Charte IA charte ia.md v0.1 cadrage Relation avec les IA, regles operationnelles, limites 3 PACTIA pactia.md v0.1 cadrage Transformer les chats projet en themes documentes avec lien, resume, fonction, points et concepts Regles de suivi Toute nouvelle idee transversale doit etre ajoutee dans un theme, pas directement dans un projet. Toute idee projet doit pointer vers le theme parent si elle depend d'un principe global. Tout nouveau theme doit avoir : role, principes, decisions, changelog, risques, rollback. Toute modification importante doit etre datee dans le changelog du theme. Si un theme devient trop large, le scinder en themes plus precis. Les documents sources et appels canoniques doivent etre ajoutes dans ../resources/RESOURCES.md. Themes a creer si besoin Theme candidat Raison Statut Privacy & Consent Regles opt in, donnees, secrets, export a creer si plusieurs projets Gamification & Aura Scores, XP, badges, seuils explicites a creer avant implementation City Intelligence Signal, Pulse, Cell, heat, mood, movement a creer si plusieurs projets l'utilisent Data Sources & Scraping APIs, scraping, limites, attribution a creer avant automatisation Bots & Transmissions Telegram, Discord, ton, cadence a creer si reutilise hors NightCrawl Intelligence Dashboard UI Heatmap, score, source atlas, action panels, dashboard SaaS candidat depuis resource:nocturne intel/noctintel pro dashboard chat No Regression & Agent Safety Protocoles anti casse, verification, handoff, tests, Git et limites d'action agent candidat depuis resource:noregression/noregression chat Nightlife Radar OSINT Radar multi villes, events, venues, sources, love signals et cartographie nightlife candidat depuis resource:codex5/chat summary Gamification Privacy Guardrails XP, Aura, badges, missions, privacy first, anti dark patterns candidat depuis resource:nightlife 3darons/product guardrails AI Flourishing PACTE IA, visions multi IA, audit ethique, agency humaine candidat depuis resource:pacte visia/pacte visia summary Changelog v0.1 cadrage 2026 05 16 Objectif : creer l'index central des themes. Fichiers touches : themes/THEMES.md, themes/night intel.md, themes/charte ia.md, NightCrawl/NightCrawl NightIntel.md. Risques : certains themes candidats ne sont pas encore separes. Rollback possible : revenir a un document global unique. v0.2 pactia 2026 05 16 Objectif : ajouter le theme PACTIA demande. Fichiers touches : themes/THEMES.md, themes/pactia.md. Ajout : theme de documentation des chats avec lien source, resume, fonction, 10 points et concepts associes. Risques : lien chat a renseigner manuellement. Rollback possible : retirer pactia.md et la ligne PACTIA de cet index. v0.3 resources 2026 05 16 Objectif : ajouter un index ressources pour unifier noms et appels. Fichiers touches : themes/THEMES.md, ../resources/RESOURCES.md, ../resources/nightcrawl/ .md. Risques : duplication entre ressources et originaux. Rollback possible : supprimer ../resources/. v0.4 codex5 candidat 2026 05 16 Objectif : ajouter le theme candidat Nightlife Radar OSINT issu de la ressource CODEX5. Fichiers touches : themes/THEMES.md, ../resources/codex5/chat summary.md. Risques : theme encore large, a scinder plus tard entre data, gamification et UX radar. Rollback possible : retirer la ligne candidate. v0.4 nightlife guardrails candidate 2026 05 16 Objectif : proposer le theme transversal Gamification Privacy Guardrails. Fichiers touches : themes/THEMES.md, ../resources/RESOURCES.md, ../resources/nightlife 3darons/ . Source : resource:nightlife 3darons/product guardrails. Risques : theme encore candidat, a separer seulement si reutilise hors NightLife. Rollback possible : retirer la ligne candidate. v0.5 ai flourishing candidate 2026 05 16 Objectif : proposer le theme transversal AI Flourishing. Fichiers touches : themes/THEMES.md, ../resources/RESOURCES.md, ../resources/pacte visia/ . Source : resource:pacte visia/pacte visia summary. Risques : theme encore candidat, a separer seulement si reutilise hors PACTE IA. Rollback possible : retirer la ligne candidate. v0.4 noregression candidat 2026 05 16 Objectif : proposer le theme transversal No Regression & Agent Safety. Source : resource:noregression/noregression chat. Risques : a formaliser en theme dedie seulement si plusieurs projets le reutilisent. Rollback possible : retirer la ligne candidate et ce changelog."},{"title":"KM Resource Import Prompt","canonical":"statut: a cadrer","type":"process","tags":[],"status":"sensible","path":"process/km-resource-import-prompt.md","github":"https://github.com/bizc0m/KM/blob/main/process/km-resource-import-prompt.md","summary":"KM Resource Import Prompt Usage Appel process : process:km resource import prompt Chemin cible : DEV/KM/process/km resource import prompt.md Changelog v0.3 2026 05 22 Objectif : passer KM en mode automatique avec index global. Fichiers touches : process/km resource import prompt.md, index.md, watch/index.md. Risques : classement automatique imparfait. Rollback : revenir a la version v0.2 avec validation avant creatio","body":"KM Resource Import Prompt Usage Appel process : process:km resource import prompt Chemin cible : DEV/KM/process/km resource import prompt.md Changelog v0.3 2026 05 22 Objectif : passer KM en mode automatique avec index global. Fichiers touches : process/km resource import prompt.md, index.md, watch/index.md. Risques : classement automatique imparfait. Rollback : revenir a la version v0.2 avec validation avant creation. v0.2 2026 05 19 Objectif : migrer le prompt vers la racine canonique KM. Fichiers touches : process/km resource import prompt.md, km/index.md, km/history.md. Risques : chemins personnels a remplacer avant export public. Rollback : revenir a la version dans process. v0.1 2026 05 18 Objectif : formaliser le prompt KM pour importer chats/documents. Risques : le chemin personnel doit etre remplace par placeholder avant export public. Rollback : supprimer ce fichier du dossier process."},{"title":"AgentsView - Session Intelligence","canonical":"watch:agentsview-session-intelligence","type":"Veille outils IA / intelligence de sessions agents.","tags":["agents","coding agents","session intelligence","local first","search","analytics","token costs","devtools","sensitive"],"status":"sensible","path":"watch/agentsview-session-intelligence.md","github":"https://github.com/bizc0m/KM/blob/main/watch/agentsview-session-intelligence.md","summary":"AgentsView est une app desktop/web local first pour parcourir, chercher et analyser les sessions d'agents IA de code. Elle indexe les fichiers de sessions locaux dans SQLite, fournit une recherche full text, des tableaux de bord, des statistiques d'usage et des rapports de couts/tokens. Agents cites comme supportes ou visibles dans la documentation : Claude Code, Codex, Gemini, Copilot, Cursor, OpenCode, OpenHands, A","body":"AgentsView Session Intelligence Type Veille outils IA / intelligence de sessions agents. Tags agents, coding agents, session intelligence, local first, search, analytics, token costs, devtools, sensitive Appel canonique watch:agentsview session intelligence Sources Site : https://www.agentsview.io/ Repo : https://github.com/kenn io/agentsview Lecture : 2026 05 22 Verification GitHub API : repo : kenn io/agentsview description : local first session intelligence and analytics for coding agents stars lus : 1087 forks lus : 139 licence : MIT archived : false dernier push lu : 2026 05 22 Resume court AgentsView est une app desktop/web local first pour parcourir, chercher et analyser les sessions d'agents IA de code. Elle indexe les fichiers de sessions locaux dans SQLite, fournit une recherche full text, des tableaux de bord, des statistiques d'usage et des rapports de couts/tokens. Agents cites comme supportes ou visibles dans la documentation : Claude Code, Codex, Gemini, Copilot, Cursor, OpenCode, OpenHands, Amp, VS Code Copilot, Kiro, Warp et autres. Usage utile Rechercher dans les anciennes sessions Codex/Claude/Cursor. Retrouver une decision, une erreur ou un prompt sans relire manuellement les chats. Mesurer couts/tokens et usage par agent/projet. Alimenter KM avec des resumes de sessions, apres nettoyage privacy. Comparer l'activite agents par projet. Usage abusif possible Risque Description Classement Exposition de prompts les sessions peuvent contenir secrets, chemins locaux, donnees personnelles ou contexte client sensible Sync distante PostgreSQL sync peut sortir les historiques du poste local sensible Partage d'archives import/export de chats peut diffuser images, prompts ou tool calls sensibles sensible Monitoring humain usage en equipe pouvant surveiller les pratiques individuelles sans consentement clair sensible Garde fous Garder l'usage local first par defaut. Ne pas pousser la base SQLite, exports ou historiques bruts dans Git. Nettoyer secrets, chemins personnels, noms et donnees sensibles avant toute fiche KM. Activer la sync distante seulement avec consentement, auth et perimetre clair. Ne jamais exposer l'interface au reseau sans authentification. Relations watch:vibeshit vibe coding directory watch:ai open source tools inventory process:km auto operating prompt v1.0 process:ai tools theme:charte ia Fit projets Projet Fit Raison KM fort retrouver, analyser et transformer les sessions agents en fiches NightIntel moyen audit des decisions IA et documentation des iterations outils internes fort suivi couts/tokens, recherche multi agent, reprise de contexte Decision KM Garder comme outil prioritaire a tester localement. Classification sensible, pas ROUGE par defaut. Changelog v0.1 2026 05 22 Objectif : integrer AgentsView comme outil de session intelligence pour agents IA. Fichiers touches : watch/agentsview session intelligence.md, watch/index.md, index.md, watch/ai open source tools inventory.md, km/history.md. Risques : historiques de sessions potentiellement sensibles. Rollback possible : supprimer cette fiche et retirer les lignes d'index."},{"title":"AI Open Source Tools Inventory","canonical":"watch:ai-open-source-tools-inventory","type":"Inventaire outils issu de veille X et sources web verifiees.","tags":["ia","open source","github","tools","devtools","agents","saas","osint","inventory"],"status":"a verifier","path":"watch/ai-open-source-tools-inventory.md","github":"https://github.com/bizc0m/KM/blob/main/watch/ai-open-source-tools-inventory.md","summary":"AI Open Source Tools Inventory Type Inventaire outils issu de veille X et sources web verifiees. Tags ia, open source, github, tools, devtools, agents, saas, osint, inventory Appel
